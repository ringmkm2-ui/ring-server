<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data: https:; media-src https:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bro Chat 管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="login" class="login-wrap">
  <form id="loginForm" class="login-card" autocomplete="off">
    <div class="login-head">
      <span class="logo"><span data-icon="shield" data-size="20"></span></span>
      <div>
        <h1>Bro Chat 管理</h1>
        <p class="muted">管理キーで接続する</p>
      </div>
    </div>
    <label class="field">
      <span class="field-label">サーバーURL</span>
      <input id="url" class="inp" type="text" spellcheck="false" placeholder="https://">
    </label>
    <label class="field">
      <span class="field-label">管理キー</span>
      <span class="inp-wrap">
        <input id="key" class="inp" type="password" spellcheck="false">
        <button id="keyToggle" class="iconbtn inp-btn" type="button" title="表示を切り替え" aria-label="管理キーの表示を切り替え"><span data-icon="eye"></span></button>
      </span>
    </label>
    <label class="chk"><input id="remember" type="checkbox"><span>このPCに保存する</span></label>
    <button id="loginBtn" class="btn primary lg" type="submit"><span id="loginBtnText">接続</span></button>
    <div id="wake" class="wake" hidden>
      <div class="wake-row">
        <span class="spin"></span>
        <div class="wake-text">
          <strong>サーバーを起こしています(最大60秒)</strong>
          <span>経過 <b id="wakeSec">0</b> 秒</span>
        </div>
        <button id="wakeCancel" class="btn sm ghost" type="button">中止</button>
      </div>
      <div class="bar"><i id="wakeBar"></i></div>
    </div>
    <p id="loginErr" class="form-err" role="alert"></p>
  </form>
</section>

<div id="app" hidden>
  <nav class="side" aria-label="メニュー">
    <div class="brand">
      <span class="logo"><span data-icon="shield" data-size="18"></span></span>
      <span class="brand-name">Bro Chat 管理</span>
    </div>
    <div id="nav" class="nav"></div>
    <div class="side-foot">
      <div class="srv" id="srvInfo" title="">
        <span class="srv-dot" id="srvDot"></span>
        <span class="srv-text" id="srvText">-</span>
      </div>
      <button id="btnDisconnect" class="nav-item" type="button" title="切断">
        <span data-icon="logout"></span><span class="nav-label">切断</span>
      </button>
    </div>
  </nav>

  <div class="mainwrap">
    <div id="bannerOld" class="banner warn" hidden role="alert">
      <span data-icon="alert"></span>
      <div class="banner-text"><strong>サーバーが古い。デプロイが必要。</strong><span>管理API v2 に未対応のため、ユーザー一覧・報告・基本の統計だけ使える。</span></div>
    </div>
    <div id="bannerDown" class="banner err" hidden role="alert">
      <span data-icon="alert"></span>
      <div class="banner-text"><strong id="downTitle">サーバーに接続できない</strong><span id="downSub"></span></div>
      <button id="downRetry" class="btn sm" type="button">今すぐ再試行</button>
    </div>
    <header class="topbar">
      <h2 id="viewTitle"></h2>
      <div class="grow"></div>
      <span id="updated" class="muted"></span>
      <button id="btnRefresh" class="btn sm" type="button" title="再読み込み (Ctrl+R)"><span data-icon="refresh"></span>再読み込み</button>
    </header>
    <main id="views"></main>
  </div>
</div>

<div id="scrim" hidden></div>
<aside id="drawer" class="drawer" aria-hidden="true" role="dialog" aria-modal="true" aria-label="ユーザー詳細"></aside>
<div id="toasts" popover="manual" aria-live="polite"></div>

<script src="lib.js"></script>
<script src="views.js"></script>
<script src="app.js"></script>
</body>
</html>
