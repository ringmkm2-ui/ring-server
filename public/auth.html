<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bro Chat - ログイン</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1e293b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bro Chat">
  <link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="/js/i18n.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      max-width: 400px;
      width: 100%;
      padding: 40px 30px;
      text-align: center;
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.25);
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #1a1a1a;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 40px;
    }

    .auth-section {
      margin-bottom: 30px;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 30px 0;
      color: #ccc;
    }

    .divider span {
      flex: 1;
      height: 1px;
      background: #e0e0e0;
    }

    .divider p {
      margin: 0 10px;
      font-size: 13px;
      color: #999;
    }

    .form-group {
      margin-bottom: 16px;
    }

    input[type="email"],
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.3s;
      font-family: inherit;
    }

    input[type="email"]:focus,
    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-google {
      background: white;
      border: 1px solid #e0e0e0;
      color: #1a1a1a;
      margin-bottom: 12px;
    }

    .btn-google:hover {
      background: #f8f8f8;
      border-color: #d0d0d0;
    }

    .btn-login {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      margin-bottom: 12px;
    }

    .btn-login:hover {
      opacity: 0.9;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .btn-signup {
      background: #f0f0f0;
      color: #667eea;
      border: none;
    }

    .btn-signup:hover {
      background: #e8e8e8;
    }

    .toggle-form {
      margin-top: 20px;
      font-size: 13px;
      color: #666;
    }

    .toggle-form a {
      color: #667eea;
      text-decoration: none;
      cursor: pointer;
      font-weight: 600;
    }

    .toggle-form a:hover {
      text-decoration: underline;
    }

    .error-message {
      background: #fee;
      color: #c33;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .success-message {
      background: #efe;
      color: #3c3;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .loading {
      opacity: 0.7;
      pointer-events: none;
    }

    .spinner {
      display: inline-block;
      width: 4px;
      height: 4px;
      background: currentColor;
      border-radius: 50%;
      animation: spin 0.6s infinite;
    }

    @keyframes spin {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .google-icon {
      width: 18px;
      height: 18px;
      display: inline-block;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="%234285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="%2334A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="%23FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="%23EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>') no-repeat center;
      background-size: contain;
    }

    .auth-mode-switch {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px;
      border: 2px solid #e0e0e0;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #666;
      transition: all 0.3s;
    }

    .mode-btn.active {
      border-color: #667eea;
      color: #667eea;
      background: rgba(102, 126, 234, 0.05);
    }

    .form-section {
      display: none;
    }

    .form-section.active {
      display: block;
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px 20px;
      }

      h1 {
        font-size: 24px;
      }
    }
    .sec-title { font-size: 20px; font-weight: 800; color: #0f172a; margin-bottom: 8px; text-align: center; }
    .sec-desc { font-size: 14px; color: #64748b; margin-bottom: 16px; text-align: center; line-height: 1.5; }
    .link-btn { display: block; width: 100%; margin-top: 12px; padding: 8px; background: none; border: none; color: #64748b; font-size: 14px; cursor: pointer; text-decoration: underline; }
    .btn-glass{position:relative;padding:12px 24px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:12px;color:#fff;font-weight:600;cursor:pointer;transition:all 0.3s ease;box-shadow:0 8px 32px rgba(31,38,135,0.15)}
    .btn-glass:hover{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.3);box-shadow:0 12px 40px rgba(31,38,135,0.25);transform:translateY(-2px)}
    .btn-glass:active{transform:translateY(0);box-shadow:0 4px 16px rgba(31,38,135,0.15)}
  </style>
  <script>
    // 言語設定を反映
    const lang = localStorage.getItem('ring_language') || 'ja';
    document.documentElement.lang = lang;
  </script>
</head>
<body>
  <div class="container">
    <div class="logo"><img src="/images/logo.jpg" alt="Bro Chat"></div>
    <h1>Bro Chat</h1>
    <p class="subtitle" data-i18n="secure_chat_app">安全なチャットアプリ</p>

    <div class="auth-mode-switch">
      <button class="mode-btn active" onclick="switchMode('login')" data-i18n="login">ログイン</button>
      <button class="mode-btn" onclick="switchMode('signup')" data-i18n="signup">新規登録</button>
    </div>

    <div id="errorMsg" class="error-message"></div>
    <div id="successMsg" class="success-message"></div>

    <!-- ログインフォーム -->
    <div id="loginSection" class="form-section active">
      <div class="auth-section">
        <div id="googleLoginButton"></div>
      </div>

      <div class="divider">
        <span></span>
        <p data-i18n="or">または</p>
        <span></span>
      </div>

      <form onsubmit="emailLogin(event)" novalidate>
        <div class="form-group">
          <input type="text" id="loginEmail" inputmode="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="メールアドレス" required>
        </div>
        <div class="form-group">
          <input type="password" id="loginPassword" placeholder="パスワード" required>
        </div>
        <button type="submit" class="btn btn-login" data-i18n="login">ログイン</button>
      </form>
      <button type="button" class="link-btn" onclick="showForgot()" data-i18n="forgot_link">パスワードを忘れましたか?</button>
    </div>

    <!-- 登録フォーム -->
    <div id="signupSection" class="form-section">
      <div class="auth-section">
        <div id="googleSignupButton"></div>
      </div>

      <div class="divider">
        <span></span>
        <p data-i18n="or">または</p>
        <span></span>
      </div>

      <form onsubmit="emailSignup(event)">
        <div class="form-group">
          <input type="text" id="signupName" placeholder="表示名" required>
        </div>
        <div class="form-group">
          <input type="email" id="signupEmail" placeholder="メールアドレス" required>
        </div>
        <div class="form-group">
          <input type="password" id="signupPassword" placeholder="パスワード（8文字以上）" required minlength="8">
        </div>
        <button type="submit" class="btn btn-login" data-i18n="register">登録</button>
      </form>
    </div>

    <!-- メール認証コード入力 -->
    <div id="verifySection" class="form-section">
      <h2 class="sec-title" data-i18n="verify_title">メールアドレスの確認</h2>
      <p class="sec-desc" data-i18n="verify_desc">届いた6桁のコードを入力してください(10分間有効)</p>
      <form onsubmit="submitVerify(event)">
        <div class="form-group">
          <input type="text" id="verifyCode" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="6桁のコード" data-i18n-placeholder="verify_code_placeholder" required>
        </div>
        <button type="submit" class="btn btn-login" data-i18n="verify_btn">確認する</button>
      </form>
      <button type="button" class="link-btn" onclick="resendCode()" data-i18n="resend_code">コードを再送する</button>
      <button type="button" class="link-btn" onclick="backToLogin()" data-i18n="back_to_login">ログイン画面に戻る</button>
    </div>

    <!-- パスワード再設定: メールアドレス入力 -->
    <div id="forgotSection" class="form-section">
      <h2 class="sec-title" data-i18n="forgot_title">パスワードの再設定</h2>
      <p class="sec-desc" data-i18n="forgot_desc">登録したメールアドレスに6桁のコードを送ります</p>
      <form onsubmit="submitForgot(event)" novalidate>
        <div class="form-group">
          <input type="text" id="forgotEmail" inputmode="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="メールアドレス" required>
        </div>
        <button type="submit" class="btn btn-login" data-i18n="forgot_send">コードを送る</button>
      </form>
      <button type="button" class="link-btn" onclick="backToLogin()" data-i18n="back_to_login">ログイン画面に戻る</button>
    </div>

    <!-- パスワード再設定: コードと新しいパスワード -->
    <div id="resetSection" class="form-section">
      <h2 class="sec-title" data-i18n="reset_title">新しいパスワード</h2>
      <p class="sec-desc" data-i18n="reset_desc">届いたコードと、新しいパスワードを入力してください(10分間有効)</p>
      <form onsubmit="submitReset(event)">
        <div class="form-group">
          <input type="text" id="resetCode" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="6桁のコード" data-i18n-placeholder="verify_code_placeholder" required>
        </div>
        <div class="form-group">
          <input type="password" id="resetPassword" autocomplete="new-password" placeholder="新しいパスワード(8文字以上)" data-i18n-placeholder="reset_pw_placeholder" required minlength="8">
        </div>
        <div class="form-group" id="resetTotpGroup" style="display:none">
          <input type="text" id="resetTotp" autocomplete="one-time-code" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="16" placeholder="認証アプリのコード(2段階認証)" data-i18n-placeholder="reset_totp_placeholder">
        </div>
        <button type="submit" class="btn btn-login" data-i18n="reset_btn">パスワードを変更</button>
      </form>
      <button type="button" class="link-btn" onclick="resendReset()" data-i18n="resend_code">コードを再送する</button>
      <button type="button" class="link-btn" onclick="backToLogin()" data-i18n="back_to_login">ログイン画面に戻る</button>
    </div>

    <!-- 2段階認証コード入力 -->
    <div id="twofaSection" class="form-section">
      <h2 class="sec-title" data-i18n="twofa_title">2段階認証</h2>
      <p class="sec-desc" data-i18n="twofa_desc">認証アプリの6桁のコード、または予備コードを入力してください</p>
      <form onsubmit="submitTwoFa(event)">
        <div class="form-group">
          <input type="text" id="twofaCode" autocomplete="one-time-code" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="16" placeholder="コード" data-i18n-placeholder="twofa_code_placeholder" required>
        </div>
        <button type="submit" class="btn btn-login" data-i18n="twofa_btn">ログイン</button>
      </form>
      <button type="button" class="link-btn" onclick="backToLogin()" data-i18n="back_to_login">ログイン画面に戻る</button>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;

    // --- 共通: セッション保存 / 画面切替 ---
    let pendingVerifyEmail = null;
    let pendingTwoFaToken = null;

    function storeSession(data) {
      localStorage.setItem('ring_token', data.token);
      localStorage.setItem('ring_userId', data.userId);
      localStorage.setItem('ring_user_id', data.userId);
      localStorage.setItem('ring_userIdCode', data.userIdCode || '');
      localStorage.setItem('ring_username', data.username);
      localStorage.setItem('ring_display_name', data.displayName || '');
      localStorage.setItem('myName', data.displayName || data.username);
    }

    function showOnly(sectionId) {
      document.querySelectorAll('.form-section').forEach(el => el.classList.remove('active'));
      document.getElementById(sectionId).classList.add('active');
      document.querySelector('.auth-mode-switch').style.display = 'none';
      clearMessages();
    }

    function backToLogin() {
      pendingVerifyEmail = null;
      pendingTwoFaToken = null;
      pendingResetEmail = null;
      document.querySelector('.auth-mode-switch').style.display = '';
      switchMode('login');
    }

    function showVerify(email) {
      pendingVerifyEmail = email;
      document.getElementById('verifyCode').value = '';
      showOnly('verifySection');
    }

    function showTwoFa(token) {
      pendingTwoFaToken = token;
      document.getElementById('twofaCode').value = '';
      showOnly('twofaSection');
    }

    // ログインAPIの応答を見て次の画面へ(2段階認証 / メール認証 / ログイン完了)
    function handleAuthResult(response, data, fallbackEmail) {
      if (data.needs2fa) { showTwoFa(data.twoFaToken); return true; }
      if (data.needsVerification) { showVerify(data.username || fallbackEmail); return true; }
      return false;
    }

    async function submitVerify(e) {
      e.preventDefault();
      const code = document.getElementById('verifyCode').value.trim();
      try {
        const res = await fetch(`${API_BASE}/api/auth/verify-email`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: pendingVerifyEmail, code })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '確認に失敗しました');
        if (data.needs2fa) { showTwoFa(data.twoFaToken); return; }
        storeSession(data);
        window.location.replace('/talklist.html');
      } catch (err) {
        showError(err.message);
      }
    }

    async function resendCode() {
      try {
        await fetch(`${API_BASE}/api/auth/resend-code`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: pendingVerifyEmail })
        });
        showSuccess((window.i18n && i18n.t('code_resent')) || 'コードを再送しました');
      } catch (err) {
        showError(err.message);
      }
    }

    async function submitTwoFa(e) {
      e.preventDefault();
      const code = document.getElementById('twofaCode').value.trim();
      try {
        const res = await fetch(`${API_BASE}/api/auth/login/2fa`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ twoFaToken: pendingTwoFaToken, code })
        });
        const data = await res.json();
        if (!res.ok) {
          if (data.expired) { backToLogin(); }
          throw new Error(data.error || '認証に失敗しました');
        }
        storeSession(data);
        window.location.replace('/talklist.html');
      } catch (err) {
        showError(err.message);
      }
    }

    // --- パスワードを忘れた場合 ---
    let pendingResetEmail = null;
    function tr(key, fallback) { return (window.i18n && i18n.t(key)) || fallback; }

    async function showForgot() {
      // メール送信が未設定のサーバーでは、送ったように見せない
      try {
        const r = await fetch(`${API_BASE}/api/auth/features`);
        const f = await r.json();
        if (!f.passwordReset) { showError(tr('forgot_no_mail', 'このサーバーはメール送信が未設定のため、再設定できません。管理者に連絡してください')); return; }
      } catch (e) { /* 取れなくても画面は開く。送信時にサーバーが判断する */ }
      const typed = document.getElementById('loginEmail').value.trim();
      document.getElementById('forgotEmail').value = typed;
      showOnly('forgotSection');
    }

    async function requestResetCode(email) {
      const res = await fetch(`${API_BASE}/api/auth/forgot-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: email })
      });
      if (res.status === 429) throw new Error('試行が多すぎます。しばらくしてからお試しください');
      if (!res.ok) throw new Error('送信に失敗しました');
    }

    async function submitForgot(e) {
      e.preventDefault();
      const email = document.getElementById('forgotEmail').value.trim();
      if (!email) return;
      try {
        await requestResetCode(email);
        pendingResetEmail = email;
        document.getElementById('resetCode').value = '';
        document.getElementById('resetPassword').value = '';
        document.getElementById('resetTotp').value = '';
        document.getElementById('resetTotpGroup').style.display = 'none';
        showOnly('resetSection');
        showSuccess(tr('forgot_sent', '登録のあるアドレスならコードを送りました。届かない時は1分後に再送できます'));
      } catch (err) {
        showError(err.message);
      }
    }

    async function resendReset() {
      try {
        await requestResetCode(pendingResetEmail);
        showSuccess(tr('forgot_sent', '登録のあるアドレスならコードを送りました。届かない時は1分後に再送できます'));
      } catch (err) {
        showError(err.message);
      }
    }

    async function submitReset(e) {
      e.preventDefault();
      const body = {
        username: pendingResetEmail,
        code: document.getElementById('resetCode').value.trim(),
        newPassword: document.getElementById('resetPassword').value
      };
      const totp = document.getElementById('resetTotp').value.trim();
      if (totp) body.totpCode = totp;
      try {
        const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) {
          if (data.needs2fa) document.getElementById('resetTotpGroup').style.display = '';
          throw new Error(data.error || 'パスワードを変更できませんでした');
        }
        const email = pendingResetEmail;
        backToLogin();
        document.getElementById('loginEmail').value = email;
        document.getElementById('loginPassword').value = '';
        showSuccess(tr('reset_done', 'パスワードを変更しました。新しいパスワードでログインしてください'));
      } catch (err) {
        showError(err.message);
      }
    }

    function switchMode(mode) {
      document.querySelectorAll('.form-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.mode-btn').forEach(el => el.classList.remove('active'));
      
      if (mode === 'login') {
        document.getElementById('loginSection').classList.add('active');
        document.querySelectorAll('.mode-btn')[0].classList.add('active');
      } else {
        document.getElementById('signupSection').classList.add('active');
        document.querySelectorAll('.mode-btn')[1].classList.add('active');
      }

      clearMessages();
    }

    function showError(message) {
      const errorEl = document.getElementById('errorMsg');
      errorEl.textContent = message;
      errorEl.style.display = 'block';
      setTimeout(() => {
        errorEl.style.display = 'none';
      }, 5000);
    }

    function showSuccess(message) {
      const successEl = document.getElementById('successMsg');
      successEl.textContent = message;
      successEl.style.display = 'block';
    }

    function clearMessages() {
      document.getElementById('errorMsg').style.display = 'none';
      document.getElementById('successMsg').style.display = 'none';
    }

    async function emailLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      try {
        const response = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: email, password })
        });

        const data = await response.json();

        if (handleAuthResult(response, data, email)) return;
        if (!response.ok) {
          throw new Error(data.error || 'ログインに失敗しました');
        }

        // ローカルストレージに保存
        localStorage.setItem('ring_token', data.token);
        localStorage.setItem('ring_userId', data.userId);
        localStorage.setItem('ring_user_id', data.userId);
        localStorage.setItem('ring_userIdCode', data.userIdCode || '');
        localStorage.setItem('ring_username', data.username);
        localStorage.setItem('ring_display_name', data.displayName);
        localStorage.setItem('myName', data.displayName || data.username);

        showSuccess('ログイン成功！');
        setTimeout(() => {
          window.location.replace('/talklist.html');
        }, 1000);
      } catch (error) {
        showError(error.message);
      }
    }

    async function emailSignup(e) {
      e.preventDefault();
      const name = document.getElementById('signupName').value;
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;

      try {
        const response = await fetch(`${API_BASE}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: email, password, displayName: name })
        });

        const data = await response.json();

        if (handleAuthResult(response, data, email)) return;
        if (!response.ok) {
          throw new Error(data.error || '登録に失敗しました');
        }

        localStorage.setItem('ring_token', data.token);
        localStorage.setItem('ring_userId', data.userId);
        localStorage.setItem('ring_user_id', data.userId);
        localStorage.setItem('ring_userIdCode', data.userIdCode || '');
        localStorage.setItem('ring_username', data.username);
        localStorage.setItem('ring_display_name', data.displayName);
        localStorage.setItem('myName', data.displayName || data.username);

        showSuccess('登録成功！ログイン中...');
        setTimeout(() => {
          window.location.replace('/talklist.html');
        }, 1000);
      } catch (error) {
        showError(error.message);
      }
    }

    function handleGoogleSignIn(response) {
      try {
        const idToken = response.credential;
        fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idToken })
        })
        .then(r => r.json())
        .then(handleGoogleResult)
        .catch(err => showError('ネットワークエラー: ' + err.message));
      } catch (e) {
        showError('認証エラー: ' + e.message);
      }
    }

    function handleGoogleResult(data) {
      if (data.needs2fa) { showTwoFa(data.twoFaToken); return; }
      if (data.token) {
        localStorage.setItem('ring_token', data.token);
        localStorage.setItem('ring_userId', data.userId);
        localStorage.setItem('ring_username', data.username);
        window.location.replace('/talklist.html');
      } else {
        showError(data.error || 'ログインに失敗しました');
      }
    }

    // アプリ(Capacitor)ではWebView内のGoogleログインがブロックされるので、
    // システムのブラウザでGoogleを開き、結果をサーバー経由(ポーリング)で受け取る。
    let googleAppPollTimer = null;
    async function googleLoginViaBrowser() {
      clearInterval(googleAppPollTimer);
      const arr = new Uint8Array(24);
      crypto.getRandomValues(arr);
      const state = btoa(String.fromCharCode.apply(null, arr)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      try {
        const r = await fetch('/api/auth/google/app-start', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ state })
        });
        const d = await r.json();
        if (!r.ok || !d.url) { showError(d.error || 'Googleログインを開始できませんでした'); return; }
        window.open(d.url, '_system');
        showSuccess('ブラウザでGoogleにログインしたら、このアプリに戻ってください');
        const t0 = Date.now();
        let polling = false;
        const pollOnce = async () => {
          if (polling) return;
          polling = true;
          try {
            if (Date.now() - t0 > 5 * 60 * 1000) { clearInterval(googleAppPollTimer); showError('時間切れです。もう一度やり直してください'); return; }
            const pr = await fetch('/api/auth/google/app-poll?state=' + encodeURIComponent(state));
            const pd = await pr.json();
            if (pd.pending) return;
            clearInterval(googleAppPollTimer);
            document.removeEventListener('visibilitychange', onVis);
            handleGoogleResult(pd);
          } catch (e) { /* 一時的な通信失敗は次のポーリングで再試行 */ }
          finally { polling = false; }
        };
        // ブラウザからアプリに戻った瞬間に確認する(バックグラウンド中はタイマーが止まっていることがある)
        const onVis = () => { if (document.visibilityState === 'visible') pollOnce(); };
        document.addEventListener('visibilitychange', onVis);
        googleAppPollTimer = setInterval(pollOnce, 2000);
      } catch (e) { showError('ネットワークエラー: ' + e.message); }
    }

    function renderAppGoogleButton(el) {
      el.innerHTML = '<button type="button" class="btn btn-google" style="margin-bottom:0" onclick="googleLoginViaBrowser()">' +
        '<svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>' +
        '<span>Googleでログイン</span></button>';
    }

    function loginWithGoogle() {
      // 不要（SDKが直接処理）
    }

    function signupWithGoogle() {
      // 不要（SDKが直接処理）
    }

    // ページロード時にログイン状態をチェック
    window.addEventListener('load', () => {
      const token = localStorage.getItem('ring_token');
      if (token) {
        // 既にログイン済み
        window.location.replace('/talklist.html');
        return;
      }

      // アプリ内(WebView)はブラウザ経由のログインに切り替える
      // Capacitorの注入が間に合わない場合に備え、AndroidのWebView(UAに wv / Version/x が入る)でも判定する
      const ua = navigator.userAgent || '';
      const inAppWebView = !!window.Capacitor || /; wv\)/.test(ua) || (/Android/.test(ua) && /Version\/\d/.test(ua) && !/Brave|OPR|EdgA|SamsungBrowser|Firefox/.test(ua));
      if (inAppWebView) {
        renderAppGoogleButton(document.getElementById('googleLoginButton'));
        renderAppGoogleButton(document.getElementById('googleSignupButton'));
        return;
      }

      // Google Sign-In初期化
      if (typeof google !== 'undefined') {
        google.accounts.id.initialize({
          client_id: '253097251071-qsajqnr9l71vjma3hlg8d91hmh7m6c9l.apps.googleusercontent.com',
          callback: handleGoogleSignIn
        });
        
        // ログイン用ボタン
        google.accounts.id.renderButton(
          document.getElementById('googleLoginButton'),
          { theme: 'outline', size: 'large', width: '100%' }
        );
        
        // 登録用ボタン
        google.accounts.id.renderButton(
          document.getElementById('googleSignupButton'),
          { theme: 'outline', size: 'large', width: '100%' }
        );
      }
    });
  
    // --- 送信中の表示(押しても何も起きないように見えて、固まったと思われるのを防ぐ) ---
    // 無料のサーバーは、しばらく使われていないと起動に時間がかかる。待たせる時は理由を出す。
    function startBusy(ev) {
      const form = ev && (ev.target && ev.target.closest ? ev.target.closest('form') : null);
      const btn = form && form.querySelector('button[type="submit"], button.btn-login');
      if (!btn) return () => {};
      const label = btn.textContent;
      btn.disabled = true;
      btn.textContent = tr('busy', '処理中…');
      const hint = tr('slow_server', 'サーバーが混み合っているか、起動中です。1分ほどかかることがあります');
      let hinted = false;
      const timer = setTimeout(() => { hinted = true; showSuccess(hint); }, 6000);
      return () => {
        clearTimeout(timer);
        btn.disabled = false;
        btn.textContent = label;
        if (hinted) {
          const ok = document.getElementById('successMsg');
          if (ok && ok.textContent === hint) clearMessages();
        }
      };
    }
    ['emailLogin', 'emailSignup', 'submitVerify', 'submitTwoFa', 'submitForgot', 'submitReset'].forEach(name => {
      const orig = window[name];
      if (typeof orig !== 'function') return;
      window[name] = async function (ev) {
        const done = startBusy(ev);
        try { return await orig.apply(this, arguments); } finally { done(); }
      };
    });
