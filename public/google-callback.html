<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bro Chat</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;color:#1e293b}
  .c{background:#fff;border-radius:20px;padding:32px 28px;max-width:340px;margin:16px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.08)}
  h1{font-size:18px;margin:12px 0 6px}
  p{font-size:14px;color:#64748b;margin:0;line-height:1.6}
</style>
</head>
<body>
<div class="c">
  <svg id="ic" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="8 12.5 11 15.5 16 9"/></svg>
  <h1 id="t">処理中</h1>
  <p id="m">少しお待ちください</p>
</div>
<script>
(async function () {
  var h = new URLSearchParams(location.hash.replace(/^#/, ''));
  var idToken = h.get('id_token'), state = h.get('state');
  history.replaceState(null, '', location.pathname); // アドレスバーからトークンを消す
  function fail(msg) {
    document.getElementById('ic').setAttribute('stroke', '#ef4444');
    document.getElementById('t').textContent = 'ログインに失敗しました';
    document.getElementById('m').textContent = msg;
  }
  if (!idToken || !state) { fail('Googleから情報を受け取れませんでした。アプリからやり直してください'); return; }
  // 他人に送られたURLでログインさせられる(乗っ取られる)のを防ぐため、
  // アプリに出ている確認番号と同じかを見てもらってから進める
  try {
    var cr = await fetch('/api/auth/google/app-code?state=' + encodeURIComponent(state));
    var cd = await cr.json();
    if (!cr.ok) { fail(cd.error || '有効時間が切れました。アプリからやり直してください'); return; }
    if (cd.code) {
      document.getElementById('ic').setAttribute('stroke', '#007aff');
      document.getElementById('t').textContent = '確認番号 ' + cd.code;
      document.getElementById('m').textContent = 'Bro Chatのアプリに同じ番号が出ていますか? 自分で今ログインを始めた時だけ進んでください。心当たりが無ければこの画面を閉じてください。';
      var ok = await new Promise(function (resolve) {
        var box = document.createElement('div');
        box.style.cssText = 'display:flex;gap:10px;margin-top:18px';
        var no = document.createElement('button'); no.textContent = 'やめる';
        var yes = document.createElement('button'); yes.textContent = 'ログインする';
        [no, yes].forEach(function (b) { b.type = 'button'; b.style.cssText = 'flex:1;padding:12px;border-radius:12px;border:0;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit'; });
        no.style.background = '#e2e8f0'; no.style.color = '#334155';
        yes.style.background = '#007aff'; yes.style.color = '#fff';
        no.onclick = function () { resolve(false); }; yes.onclick = function () { resolve(true); };
        box.append(no, yes);
        document.querySelector('.c').appendChild(box);
      });
      document.querySelector('.c').lastChild.remove();
      if (!ok) { fail('ログインをやめました。この画面は閉じて大丈夫です'); return; }
      document.getElementById('ic').setAttribute('stroke', '#10b981');
      document.getElementById('t').textContent = '処理中';
      document.getElementById('m').textContent = '少しお待ちください';
    }
  } catch (e) { fail('通信に失敗しました'); return; }
  try {
    var r = await fetch('/api/auth/google/app-relay', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ state: state, idToken: idToken })
    });
    var d = await r.json();
    if (!r.ok) { fail(d.error || 'ログインできませんでした'); return; }
    document.getElementById('t').textContent = 'ログインできました';
    document.getElementById('m').textContent = 'このブラウザを閉じて、Bro Chatのアプリに切り替えてください';
  } catch (e) { fail('通信に失敗しました'); }
})();
</script>
</body>
</html>
