<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bro Chat</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bro Chat">
  <link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;overflow:hidden}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:#0a0a0f;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      position:relative;
    }

    .logo-container{
      position:relative;
      width:120px;height:120px;
      margin-bottom:32px;
    }

    .logo-img{
      width:120px;height:120px;
      border-radius:30px;
      object-fit:cover;
      position:relative;
      z-index:2;
      opacity:0;
      animation:logoFadeIn .8s ease .2s forwards;
    }

    /* ロゴの周りの光るリング */
    .glow-ring{
      position:absolute;
      top:-6px;left:-6px;
      width:132px;height:132px;
      border-radius:34px;
      z-index:1;
      background:conic-gradient(
        from 0deg,
        rgba(74,222,128,0) 0%,
        rgba(74,222,128,.6) 25%,
        rgba(59,130,246,.6) 50%,
        rgba(168,85,247,.6) 75%,
        rgba(74,222,128,0) 100%
      );
      animation:ringRotate 2s linear infinite;
      opacity:0;
      transition:opacity .5s;
    }
    .glow-ring.active{opacity:1}
    .glow-ring.done{opacity:0}

    /* 内側マスク（リングを枠だけにする） */
    .glow-ring::after{
      content:'';
      position:absolute;
      top:3px;left:3px;right:3px;bottom:3px;
      border-radius:31px;
      background:#0a0a0f;
    }

    @keyframes ringRotate{to{transform:rotate(360deg)}}

    @keyframes logoFadeIn{
      from{opacity:0;transform:scale(.8)}
      to{opacity:1;transform:scale(1)}
    }

    .app-name{
      font-size:28px;
      font-weight:700;
      color:#fff;
      letter-spacing:1px;
      opacity:0;
      animation:fadeUp .6s ease .5s forwards;
    }

    .status-text{
      margin-top:12px;
      font-size:13px;
      color:rgba(255,255,255,.4);
      opacity:0;
      animation:fadeUp .6s ease .7s forwards;
      transition:all .3s;
    }

    .status-text.ready{
      color:rgba(74,222,128,.8);
    }

    /* ドットローディング */
    .dots{
      display:inline-flex;
      gap:4px;
      margin-left:4px;
    }
    .dots span{
      width:4px;height:4px;
      border-radius:50%;
      background:rgba(255,255,255,.4);
      animation:dotPulse 1.4s ease-in-out infinite;
    }
    .dots span:nth-child(2){animation-delay:.2s}
    .dots span:nth-child(3){animation-delay:.4s}

    @keyframes dotPulse{
      0%,80%,100%{opacity:.3;transform:scale(.8)}
      40%{opacity:1;transform:scale(1.2)}
    }

    @keyframes fadeUp{
      from{opacity:0;transform:translateY(10px)}
      to{opacity:1;transform:translateY(0)}
    }

    .powered-by{
      position:absolute;
      bottom:60px;
      left:0;right:0;
      text-align:center;
      opacity:0;
      animation:fadeUp .6s ease 1s forwards;
    }
    .powered-by-label{
      font-size:11px;
      color:rgba(255,255,255,.25);
      margin-bottom:8px;
      letter-spacing:1px;
      text-transform:uppercase;
    }
    .powered-by-logos{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:16px;
    }
    .logo-item{display:flex;align-items:center;gap:6px}
    .logo-item img{height:16px;width:auto;opacity:.4}

    /* 遷移アニメーション */
    .transition-overlay{
      position:fixed;top:0;left:0;width:100%;height:100%;
      z-index:100;opacity:0;pointer-events:none;
      display:flex;align-items:center;justify-content:center;
    }
    .transition-overlay.active{opacity:1;pointer-events:all}
    .scale-panel{
      width:120px;height:120px;
      background:#fff;
      border-radius:30px;
      will-change:transform,border-radius,width,height;
    }
    .scale-panel.expanding{
      animation:panelExpand .6s cubic-bezier(.65,0,.35,1) forwards;
    }
    @keyframes panelExpand{
      to{width:100vw;height:100vh;border-radius:0}
    }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    // トークンがあればsplashを描画せず即遷移（チラつき防止）
    if (localStorage.getItem('ring_token')) {
      window.location.replace('/talklist.html');
      document.documentElement.style.display = 'none';
    }
  </script>
</head>
<body>

  <div class="logo-container">
    <div class="glow-ring" id="glowRing"></div>
    <img class="logo-img" src="/images/logo.jpg" alt="Bro Chat">
  </div>

  <div class="app-name">Bro Chat</div>

  <div class="status-text" id="statusText">
    接続中<span class="dots"><span></span><span></span><span></span></span>
  </div>

  <div class="powered-by">
    <div class="powered-by-label">Powered by</div>
    <div class="powered-by-logos">
      <div class="logo-item">
        <img src="/images/logo-black.jpg" alt="Claude">
      </div>
      <div class="logo-item">
        <img src="/images/render-logo.svg" alt="Render">
      </div>
    </div>
  </div>

  <div class="transition-overlay" id="transitionOverlay">
    <div class="scale-panel" id="scalePanel"></div>
  </div>

  <script>
    (function() {
      const startTime = Date.now();
      const MIN_SPLASH = 2000;
      const ring = document.getElementById('glowRing');
      const statusEl = document.getElementById('statusText');

      // ロゴ表示後にリング開始
      setTimeout(() => ring.classList.add('active'), 600);

      // トークンチェック
      const token = localStorage.getItem('ring_token');
      const destination = token ? '/talklist.html' : '/welcome.html';

      // サーバー起動チェック（ポーリング）
      let serverReady = false;
      let attempts = 0;

      function checkServer() {
        attempts++;
        fetch('/api/auth/me', {
          method: 'GET',
          headers: token ? { 'Authorization': 'Bearer ' + token } : {},
          signal: AbortSignal.timeout(5000)
        })
        .then(r => {
          // 200でも401でもサーバーは起きてる
          serverReady = true;
          onServerReady();
        })
        .catch(() => {
          // サーバーまだ起きてない
          if (attempts < 60) {
            const msg = attempts > 5 ? 'サーバー起動中' : '接続中';
            statusEl.innerHTML = msg + '<span class="dots"><span></span><span></span><span></span></span>';
            setTimeout(checkServer, 2000);
          } else {
            statusEl.textContent = '接続できません。再読み込みしてください。';
            statusEl.style.color = 'rgba(239,68,68,.8)';
          }
        });
      }

      function onServerReady() {
        const elapsed = Date.now() - startTime;
        const wait = Math.max(0, MIN_SPLASH - elapsed);

        ring.classList.remove('active');
        ring.classList.add('done');

        statusEl.innerHTML = '準備完了';
        statusEl.classList.add('ready');

        setTimeout(() => {
          playTransitionAndGo(destination);
        }, wait + 400);
      }

      function playTransitionAndGo(dest) {
        const overlay = document.getElementById('transitionOverlay');
        const panel = document.getElementById('scalePanel');
        overlay.classList.add('active');
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            panel.classList.add('expanding');
          });
        });
        panel.addEventListener('animationend', () => {
          window.location.href = dest;
        }, { once: true });
      }

      // 開始
      checkServer();

      // Service Worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then(reg => {
          console.log('SW registered');
          reg.update().catch(() => {});
        }).catch(err => console.log('SW registration failed:', err));
      }
    })();
  </script>
</body>
</html>
