};

// メディアモーダル
let scale=1,panX=0,panY=0,dragging=false,sx=0,sy=0,tmode='',ipd=0,iscale=1;
function openMedia(el, type) {
  const clone = el.cloneNode(true);
  if (type==='video') { clone.controls=true; clone.autoplay=true; }
  scale=1; panX=0; panY=0;
  clone.style.transformOrigin='center';
  const inner = document.getElementById('mmInner');
  inner.innerHTML=''; inner.appendChild(clone);
  document.getElementById('mediaMod').classList.add('show');
}
function updMM() { const e=document.getElementById('mmInner').firstElementChild; if(e) e.style.transform=`translate(${panX}px,${panY}px) scale(${scale})`; }
const gd = (a,b) => Math.hypot(b.clientX-a.clientX, b.clientY-a.clientY);
document.getElementById('mediaMod').addEventListener('wheel', e => { e.preventDefault(); const o=scale; scale=e.deltaY<0?Math.min(scale+.15,5):Math.max(scale-.15,.7); if(scale!==o){panX*=scale/o;panY*=scale/o;} updMM(); }, {passive:false});
document.getElementById('mediaMod').addEventListener('mousedown', e => { if(e.target.closest('#mmClose')||!document.getElementById('mmInner').firstElementChild) return; dragging=true; tmode='pan'; sx=e.clientX-(panX/scale); sy=e.clientY-(panY/scale); });
document.getElementById('mediaMod').addEventListener('touchstart', e => {
  const t=e.touches; if(!document.getElementById('mmInner').firstElementChild) return;
  if(t.length===2){tmode='zoom';ipd=gd(t[0],t[1]);iscale=scale;}
  else if(t.length===1){tmode='pan';dragging=true;sx=t[0].clientX-(panX/scale);sy=t[0].clientY-(panY/scale);}
}, {passive:true});
window.addEventListener('mousemove', e => { if(!dragging||tmode!=='pan') return; panX=(e.clientX-sx)*scale; panY=(e.clientY-sy)*scale; updMM(); });
window.addEventListener('touchmove', e => {
  const t=e.touches; if(!document.getElementById('mmInner').firstElementChild) return;
  if(tmode==='zoom'&&t.length===2){e.preventDefault();const o=scale;scale=Math.max(.7,Math.min(iscale*(gd(t[0],t[1])/ipd),5));if(scale!==o){panX*=scale/o;panY*=scale/o;}updMM();}
  else if(tmode==='pan'&&dragging&&t.length===1){e.preventDefault();panX=(t[0].clientX-sx)*scale;panY=(t[0].clientY-sy)*scale;updMM();}
}, {passive:false});
window.addEventListener('mouseup', () => { dragging=false; tmode=''; });
window.addEventListener('touchend', () => { dragging=false; tmode=''; });
document.getElementById('mmClose').onclick = () => { document.getElementById('mediaMod').classList.remove('show'); setTimeout(()=>{document.getElementById('mmInner').innerHTML='';},300); };
document.getElementById('mediaMod').onclick = e => { if(e.target===document.getElementById('mediaMod')){document.getElementById('mediaMod').classList.remove('show');setTimeout(()=>{document.getElementById('mmInner').innerHTML='';},300);} };

// ==================== 音声通話 (WebRTC) ====================
// サーバー(ws)はSDP/ICEの中継のみ。メディアはP2Pで直接流れる。
// Xiaomi HyperOS/MIUI は省電力設定でバックグラウンドWSが切れやすいので、
// 通話中は画面を極力アクティブに保ち、切断検知したら確実に終話処理する。

// ICEサーバー(STUN/TURN)は通話開始のたびにサーバー(/api/ice)から取得する。
// 以前は固定のOpen Relay Project認証情報をハードコードしていたが、
// これは現在アカウント登録必須の運用に移行しており非推奨(実質使えない)に
// なっていた。Twilio Network Traversal Serviceに切り替え、サーバー側で
// 都度発行される一時的な認証情報を使う方式にする。
// 万一取得に失敗した場合のフォールバックとしてGoogle STUNのみ保持する
// (TURNが無いと対称型NAT環境では繋がらないことがあるが、
//  STUNだけでも一定割合のケースはカバーできるため通話機能自体は止めない)。
let ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
];

async function refreshIceServers() {
  try {
    const res = await fetch('/api/ice', {
      headers: { 'Authorization': 'Bearer ' + token },
    });
    if (!res.ok) throw new Error('ICE取得APIが失敗: ' + res.status);
    const data = await res.json();
    if (Array.isArray(data.iceServers) && data.iceServers.length > 0) {
      ICE_SERVERS = data.iceServers;
      console.log('[ice] TwilioのICEサーバーを取得しました (' + ICE_SERVERS.length + '件)');
    }
  } catch (e) {
    console.warn('[ice] ICEサーバー取得に失敗、フォールバック(STUNのみ)を使用します:', e.message);
  }
}
// ページ読み込み時に一度先読みしておく(通話開始のたびに毎回待たせないため)。
// 発信/着信のたびにも念のため再取得し、常に有効期限内の最新情報を使う。
refreshIceServers();

let pc = null;             // RTCPeerConnection
let localStream = null;    // マイク音声(+カメラ映像)
let currentCallId = null;  // 現在の通話ID
let callRole = null;       // 'caller' | 'callee'
let callConnectTimer = null;
let callSeconds = 0;
let isMuted = false;
let wakeLock = null;       // 通話中の画面スリープ防止
let pendingRemoteIce = [];  // remote description 到着前に届いたICE候補の一時保管
let isVideoCall = urlIsVideoParam;    // 現在の通話がビデオ通話か（SW通知タップ時はURLパラメータで初期化）
let isVideoEnabled = true;  // 自分のカメラがONか（ビデオ通話中のみ意味を持つ）
let currentFacingMode = 'user'; // 'user'=インカメ, 'environment'=アウトカメ

function genCallId() {
  return 'call_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
}

async function acquireWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (e) { /* Xiaomi端末など非対応でも通話自体は継続させる */ }
}
function releaseWakeLock() {
  if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
}
// バックグラウンドから復帰した際にWakeLockを再取得（MIUIはこれが特に必要）
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && pc && !wakeLock) {
    await acquireWakeLock();
  }
});

function setCallStatus(text) {
  document.getElementById('callStatus').textContent = text;
}

function showCallOverlay() {
  document.getElementById('callOv').classList.add('show');
  // 下部のコントロールパネルがガラスとして凝縮しながら現れる演出 + 軽い触感フィードバック
  if (window.LiquidGlass) {
    window.LiquidGlass.materializeIn(document.getElementById('callControlsPanel'));
    window.LiquidGlass.haptic('medium');
  }
}
function hideCallOverlay() {
  document.getElementById('callOv').classList.remove('show');
  document.getElementById('incomingBtnRow').style.display = 'none';
  document.getElementById('callBtnRow').style.display = 'flex';
  document.getElementById('muteBtn').style.display = 'none';
  document.getElementById('speakerBtn').style.display = 'none';
}

function startCallTimer() {
  callSeconds = 0;
  clearInterval(callConnectTimer);
  callConnectTimer = setInterval(() => {
    callSeconds++;
    const m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
    const s = String(callSeconds % 60).padStart(2, '0');
    setCallStatus(`${m}:${s}`);
  }, 1000);
}
function stopCallTimer() {
  clearInterval(callConnectTimer);
  callConnectTimer = null;
}

function sendSignal(type, extra) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type, recipientId: otherId, callId: currentCallId, ...extra }));
  } else {
    console.error('[sendSignal] WebSocket not connected, cannot send:', type, 'readyState:', ws ? ws.readyState : 'ws is null');
    if (type === 'call_offer') {
      setCallStatus('接続エラー: サーバーに接続できません');
      setTimeout(hideCallOverlay, 2000);
    }
  }
}

async function getMediaStream(isVideo) {
  try {
    const constraints = {
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
      },
      video: isVideo ? {
        facingMode: currentFacingMode,
        width: { ideal: 640 },
        height: { ideal: 480 },
      } : false,
    };
    return await navigator.mediaDevices.getUserMedia(constraints);
  } catch (err) {
    console.error('media error:', err);
    throw err;
  }
}

function createPeerConnection() {
  const conn = new RTCPeerConnection({ iceServers: ICE_SERVERS });

  conn.onicecandidate = (e) => {
    if (e.candidate) {
      sendSignal('call_ice', { candidate: e.candidate });
    }
  };

  conn.ontrack = (e) => {
    if (e.track.kind === 'video') {
      const videoEl = document.getElementById('remoteVideo');
      videoEl.srcObject = e.streams[0];
      videoEl.style.display = 'block';
    } else {
      const audioEl = document.getElementById('remoteAudio');
      audioEl.srcObject = e.streams[0];
    }
  };

  conn.onconnectionstatechange = () => {
    if (!conn) return;
    if (conn.connectionState === 'connected') {
      setCallStatus('00:00');
      startCallTimer();
      if (window.LiquidGlass) window.LiquidGlass.haptic('success');
      const muteBtn = document.getElementById('muteBtn');
      const speakerBtn = document.getElementById('speakerBtn');
      muteBtn.style.display = 'flex';
      speakerBtn.style.display = 'flex';
      if (window.LiquidGlass) {
        window.LiquidGlass.materializeIn(muteBtn, true);
        window.LiquidGlass.materializeIn(speakerBtn, true);
      }
      if (isVideoCall) {
        const toggleVideoBtn = document.getElementById('toggleVideoBtn');
        const flipCamBtn = document.getElementById('flipCamBtn');
        toggleVideoBtn.style.display = 'flex';
        flipCamBtn.style.display = 'flex';
        if (window.LiquidGlass) {
          window.LiquidGlass.materializeIn(toggleVideoBtn, true);
          window.LiquidGlass.materializeIn(flipCamBtn, true);
        }
      }
      acquireWakeLock();
    } else if (['disconnected', 'failed', 'closed'].includes(conn.connectionState)) {
      // 相手側の回線都合の瞬断は自動再接続の余地があるため、failedのみ即終話とする
      if (conn.connectionState === 'failed') {
        setCallStatus('接続できませんでした');
        setTimeout(endCall, 1200);
      }
    }
  };

  return conn;
}

function cleanupCall() {
  stopCallTimer();
  releaseWakeLock();
  if (pc) {
    try { pc.close(); } catch (e) {}
    pc = null;
  }
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  currentCallId = null;
  callRole = null;
  isMuted = false;
  isVideoCall = false;
  isVideoEnabled = true;
  currentFacingMode = 'user';
  pendingRemoteIce = [];
  const audioEl = document.getElementById('remoteAudio');
  audioEl.srcObject = null;
  const remoteVideoEl = document.getElementById('remoteVideo');
  remoteVideoEl.srcObject = null;
  remoteVideoEl.style.display = 'none';
  const localVideoEl = document.getElementById('localVideo');
  localVideoEl.srcObject = null;
  localVideoEl.style.display = 'none';
  document.getElementById('toggleVideoBtn').style.display = 'none';
  document.getElementById('flipCamBtn').style.display = 'none';
  document.getElementById('callAv').style.display = '';
  hideCallOverlay();
  // 通話中に保留していたService Worker自動更新のリロードがあれば、ここで反映する
  if (window.__applyPendingSwReloadIfAny) window.__applyPendingSwReloadIfAny();
}

// --- 発信 ---
async function startOutgoingCall(isVideo = false) {
  if (pc) return; // 既に通話中

  // WebSocket未接続なら発信前に警告して中断（サイレント失敗を防ぐ）
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    alert(i18n.t('err_server_disconnected'));
    return;
  }

  currentCallId = genCallId();
  callRole = 'caller';
  isVideoCall = isVideo;
  showCallOverlay();
  // 発信時は必ず「着信ボタン(応答/拒否)」を隠し、「通話終了ボタン」のみ表示する
  document.getElementById('incomingBtnRow').style.display = 'none';
  document.getElementById('callBtnRow').style.display = 'flex';
  setCallStatus('発信中...');

  // 通話開始のたびにTwilioの一時的なICE認証情報を取得し直す
  // (有効期限があるため、通話ごとに最新のものを使う)
  await refreshIceServers();

  try {
    localStream = await getMediaStream(isVideo);
  } catch (err) {
    setCallStatus(isVideo ? 'カメラ/マイクにアクセスできません' : 'マイクにアクセスできません');
    setTimeout(hideCallOverlay, 1500);
    return;
  }

  if (isVideo) {
    document.getElementById('callAv').style.display = 'none';
    const localVideoEl = document.getElementById('localVideo');
    localVideoEl.srcObject = localStream;
    localVideoEl.style.display = 'block';
  }

  pc = createPeerConnection();
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

  // 通話録音開始
  if (callRecorder) {
    callRecorder.startRecording(localStream, currentCallId, otherId, otherName);
  }

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  sendSignal('call_offer', { sdp: offer, isVideo });
  setCallStatus('呼び出し中...');
}

// --- 着信 ---
function onCallOffer(data) {
  if (pc) {
    // 既に通話中なら自動的にビジーを返す
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'call_reject', recipientId: data.fromUserId, callId: data.callId, reason: 'busy' }));
    }
    return;
  }
  // このページは特定の相手(otherId、URLパラメータ由来)専用のチャット画面という
  // 設計のため、発信者(data.fromUserId)が画面に表示中の相手と一致しない場合、
  // 応答(call_answer)がotherId宛に送られてしまい発信者に届かず、
  // 「接続中のまま切れる」原因になりうる。現状は基本的に一致する設計だが、
  // 万一の不一致を後から追えるようログだけ残しておく。
  if (data.fromUserId !== otherId) {
    console.warn('[call] 発信者IDと表示中の相手IDが一致しません', { fromUserId: data.fromUserId, otherId });
  }
  currentCallId = data.callId;
  callRole = 'callee';
  isVideoCall = !!data.isVideo;
  window.__incomingOffer = data.sdp;
  window.__incomingOffer_callId = data.callId;

  // SW通知タップ経由で既にaccept/declineが指定されていれば、即座に実行して待たせない
  if (pendingBgCallAction && pendingBgCallAction.callId === data.callId) {
    const action = pendingBgCallAction.action;
    pendingBgCallAction = null;
    action === 'accept' ? acceptIncomingCall() : declineIncomingCall();
    return;
  }

  showCallOverlay();
  setCallStatus(isVideoCall ? 'ビデオ着信中...' : '着信中...');
  document.getElementById('callBtnRow').style.display = 'none';
  document.getElementById('incomingBtnRow').style.display = 'flex';

  // 着信音（バイブ）— Xiaomi含む多くのAndroid Chromeで有効
  if (navigator.vibrate) {
    navigator.vibrate([500, 300, 500, 300, 500]);
  }
}

async function acceptIncomingCall() {
  if (window.LiquidGlass) window.LiquidGlass.haptic('success');
  document.getElementById('incomingBtnRow').style.display = 'none';
  document.getElementById('callBtnRow').style.display = 'flex';
  setCallStatus('接続中...');

  // 通話応答のたびにTwilioの一時的なICE認証情報を取得し直す
  await refreshIceServers();

  try {
    localStream = await getMediaStream(isVideoCall);
  } catch (err) {
    setCallStatus(isVideoCall ? 'カメラ/マイクにアクセスできません' : 'マイクにアクセスできません');
    sendSignal('call_reject', { reason: 'declined' });
    setTimeout(cleanupCall, 1500);
    return;
  }

  if (isVideoCall) {
    document.getElementById('callAv').style.display = 'none';
    const localVideoEl = document.getElementById('localVideo');
    localVideoEl.srcObject = localStream;
    localVideoEl.style.display = 'block';
  }

  pc = createPeerConnection();
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

  await pc.setRemoteDescription(new RTCSessionDescription(window.__incomingOffer));
  for (const c of pendingRemoteIce) {
    try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch (e) {}
  }
  pendingRemoteIce = [];

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  sendSignal('call_answer', { sdp: answer });
}

function declineIncomingCall() {
  if (window.LiquidGlass) window.LiquidGlass.haptic('error');
  sendSignal('call_reject', { reason: 'declined' });
  cleanupCall();
}

// --- 相手からの応答受信（発信者側） ---
async function onCallAnswer(data) {
  if (!pc || data.callId !== currentCallId) return;
  await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
  for (const c of pendingRemoteIce) {
    try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch (e) {}
  }
  pendingRemoteIce = [];
  setCallStatus('接続中...');
}

async function onCallIce(data) {
  if (data.callId !== currentCallId) return;
  if (pc && pc.remoteDescription) {
    try { await pc.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch (e) {}
  } else {
    pendingRemoteIce.push(data.candidate);
  }
}

function onCallReject(data) {
  if (data.callId !== currentCallId) return;
  if (window.LiquidGlass) window.LiquidGlass.haptic('warning');
  setCallStatus(data.reason === 'busy' ? '通話中です' : '応答がありませんでした');
  setTimeout(cleanupCall, 1500);
}

function onCallEnd(data) {
  if (data.callId !== currentCallId) return;
  setCallStatus('通話終了');
  setTimeout(cleanupCall, 800);
}

function onCallUnavailable(data) {
  if (data.callId !== currentCallId) return;
  if (window.LiquidGlass) window.LiquidGlass.haptic('warning');
  // reason別にメッセージを出し分ける。以前は理由を問わず「相手はオフラインです」
  // 固定表示だったため、友達関係が未成立で発信できなかった場合にも
  // 誤解を招く表示になっていた。
  setCallStatus(data.reason === 'not_friends' ? '友達ではないため発信できません' : '相手はオフラインです');
  setTimeout(cleanupCall, 1500);
}

function endCall() {
  if (window.LiquidGlass) window.LiquidGlass.haptic('medium');
  if (currentCallId) {
    sendSignal('call_end', {});
  }
  
  // 通話録音停止
  if (callRecorder && callRecorder.isRecording) {
    callRecorder.stopRecording();
  }
  
  cleanupCall();
}

function toggleMute() {
  if (!localStream) return;
  isMuted = !isMuted;
  localStream.getAudioTracks().forEach(t => { t.enabled = !isMuted; });
  const muteBtn = document.getElementById('muteBtn');
  if (window.LiquidGlass) window.LiquidGlass.haptic('selection');
  // アイコンの線色は常に白のまま(ネイティブ風の暗い背景の上に置かれるため)。
  // オン/オフの区別はボタン背景(glass-clear ⇔ glass-btn-off)だけで表現する。
  if (isMuted) {
    muteBtn.classList.remove('glass-clear');
    muteBtn.classList.add('glass-btn-off');
  } else {
    muteBtn.classList.add('glass-clear');
    muteBtn.classList.remove('glass-btn-off');
  }
}

// スピーカー切替はブラウザAPIの制約上、対応端末のみ setSinkId が使えるため
// 非対応時はボタンを押しても現状維持（多くのAndroidは既定でスピーカー優先）
async function toggleSpeaker() {
  const audioEl = document.getElementById('remoteAudio');
  if (typeof audioEl.setSinkId !== 'function') return;
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const speaker = devices.find(d => d.kind === 'audiooutput' && /speaker/i.test(d.label));
    const current = audioEl.sinkId;
    if (speaker && current !== speaker.deviceId) {
      await audioEl.setSinkId(speaker.deviceId);
    } else {
      await audioEl.setSinkId('default');
    }
  } catch (e) { /* 非対応端末は無視 */ }
}

// 自分のカメラ映像のON/OFF切替（ビデオ通話中のみ）
function toggleVideo() {
  if (!localStream || !isVideoCall) return;
  isVideoEnabled = !isVideoEnabled;
  localStream.getVideoTracks().forEach(t => { t.enabled = isVideoEnabled; });
  const localVideoEl = document.getElementById('localVideo');
  const videoBtn = document.getElementById('toggleVideoBtn');
  if (window.LiquidGlass) window.LiquidGlass.haptic('selection');
  if (isVideoEnabled) {
    localVideoEl.style.display = 'block';
    videoBtn.classList.add('glass-clear');
    videoBtn.classList.remove('glass-btn-off');
  } else {
    localVideoEl.style.display = 'none';
    // オフ状態は「無効化」を視覚的に示すため、透明なガラスではなく
    // 不透明な暗色に切り替える(glass-clearだとOFFに見えづらいため)
    videoBtn.classList.remove('glass-clear');
    videoBtn.classList.add('glass-btn-off');
  }
}

// インカメ/アウトカメ切替（モバイル端末向け）
async function flipCamera() {
  if (!localStream || !isVideoCall || !pc) return;
  currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
  try {
    const newStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: currentFacingMode, width: { ideal: 640 }, height: { ideal: 480 } },
    });
    const newVideoTrack = newStream.getVideoTracks()[0];
    const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
    if (sender) {
      await sender.replaceTrack(newVideoTrack);
    }
    // 旧トラックを止めてlocalStreamを更新
    localStream.getVideoTracks().forEach(t => t.stop());
    localStream.removeTrack(localStream.getVideoTracks()[0]);
    localStream.addTrack(newVideoTrack);
    document.getElementById('localVideo').srcObject = localStream;
  } catch (e) {
    console.error('camera flip error:', e);
    // 失敗時は元のfacingModeに戻す
    currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
  }
}

document.getElementById('phoneBtn').onclick = () => { startOutgoingCall(false); };
document.getElementById('videoCallBtn').onclick = () => { startOutgoingCall(true); };
document.getElementById('endBtn').onclick = () => {
  // 通話終了は最重要操作のため、他の処理で例外が起きていても
  // 必ず通話状態をクリアしてオーバーレイを閉じられるようにする
  try {
    endCall();
  } catch (e) {
    console.error('[endBtn] endCall failed, forcing cleanup:', e);
    try { cleanupCall(); } catch (e2) { console.error('[endBtn] cleanupCall also failed:', e2); }
  }
};
document.getElementById('acceptBtn').onclick = () => { acceptIncomingCall(); };
document.getElementById('declineBtn').onclick = () => { declineIncomingCall(); };
document.getElementById('muteBtn').onclick = () => { toggleMute(); };
document.getElementById('speakerBtn').onclick = () => { toggleSpeaker(); };
document.getElementById('toggleVideoBtn').onclick = () => { toggleVideo(); };
document.getElementById('flipCamBtn').onclick = () => { flipCamera(); };

// Call Assist ボタン（音声認識・翻訳・要約）
const callAssistBtn = document.getElementById('callAssistBtn');
let isCallAssistActive = false;

if (callAssistBtn) {
  callAssistBtn.onclick = async () => {
    if (!deepgramRecognizer) {
      deepgramRecognizer = new DeepgramVoiceRecognizer('2e285616a508509c91f32f188a56d76e717f3315');
    }

    if (!isCallAssistActive) {
      // Call Assist 開始
      const success = await deepgramRecognizer.startRealtimeStream();
      if (success) {
        isCallAssistActive = true;
        callAssistBtn.style.background = 'rgba(59, 130, 246, 0.8)';
        callAssistBtn.textContent = '● 聞き取り中...';
        console.log('[CallAssist] Recording started');
      } else {
        alert(i18n.t('err_mic_denied'));
      }
    } else {
      // Call Assist 停止
      deepgramRecognizer.stopStream();
      isCallAssistActive = false;
      callAssistBtn.style.background = '';
      callAssistBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg><span>Call assist</span>';
      console.log('[CallAssist] Recording stopped');
    }
  };
}

// ページを離れる/リロード時に通話中なら相手へ確実に終話通知（Xiaomi等の強制終了対策）
window.addEventListener('pagehide', () => {
  if (currentCallId) {
    sendSignal('call_end', {});
  }
});

</script>
