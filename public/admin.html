<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title data-i18n="talk">トーク</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1e293b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bro Chat">
<link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/css/globalTheme.css">
<link rel="stylesheet" href="/css/liquidGlass.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#fdfaf6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body.has-custom-bg{background:transparent}
.phone-container{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:#fdfaf6;z-index:9999}
body.has-custom-bg .phone-container{background:transparent}
.bg-orb{position:absolute;border-radius:40% 60% 70% 30%/40% 50% 60% 50%;filter:blur(60px);z-index:0;opacity:.5}
body.has-custom-bg .bg-orb,body.has-custom-bg .phone-container::before{display:none}
.orb-1{width:90vw;height:90vw;background:radial-gradient(circle,#fde3cf 0%,rgba(253,227,207,0) 70%);top:-20%;left:-20%}
.orb-2{width:100vw;height:100vw;background:radial-gradient(circle,#d1fae5 0%,rgba(209,250,229,0) 70%);bottom:-10%;right:-25%}
.orb-3{width:80vw;height:80vw;background:radial-gradient(circle,#fce7f3 0%,rgba(252,231,243,0) 70%);bottom:-20%;left:-10%}
.phone-container::before{content:'';position:absolute;width:70vw;height:70vw;background:radial-gradient(circle,#e0f2fe 0%,rgba(224,242,254,0) 70%);top:15%;right:-10%;filter:blur(50px);z-index:0;opacity:.4}
@keyframes spin{to{transform:rotate(360deg)}}
.app-header-container,.chat-screen,.input-bar-container{position:relative;z-index:10}
.app-header-container{padding:14px 16px}
.app-header-bar{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.25);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid rgba(255,255,255,.4);border-top:1px solid rgba(255,255,255,.8);border-left:1px solid rgba(255,255,255,.8);box-shadow:0 10px 30px rgba(0,0,0,.05);padding:10px 14px;border-radius:24px;width:100%}
.back-link{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.6);color:#0f172a;font-weight:700;text-decoration:none;flex-shrink:0}
.partner-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0;background-size:cover;background-position:center;backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px)}
.name{font-weight:700;font-size:15px;color:#1e293b}
.status{font-size:12px;font-weight:600;color:#059669}
/* phone-btn: 発信ボタン。liquidGlass.cssの.glass-clearに背景/ぼかし/縁は任せ、
   ここでは形状(円形・サイズ)のみ定義する。 */
.phone-btn{border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;width:38px;height:38px}
.pin-banner{position:relative;z-index:10;margin:0 16px 6px;background:rgba(255,255,255,.4);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.6);border-radius:14px;padding:9px 12px;display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(-6px);transition:all .3s ease;pointer-events:none}
.pin-banner.show{opacity:1;transform:translateY(0);pointer-events:auto}
.pin-text{flex:1;font-size:12px;font-weight:600;color:#0f172a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pin-close{font-size:14px;color:#64748b;cursor:pointer;padding:0 2px}
.chat-screen{flex:1;padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.message{display:flex;width:100%;align-items:flex-end;gap:8px}
.outgoing{justify-content:flex-end}
.incoming{justify-content:flex-start}
.msg-wrap{display:flex;flex-direction:column;max-width:72%}
.outgoing .msg-wrap{align-items:flex-end}
.incoming .msg-wrap{align-items:flex-start}
.bubble{padding:11px 15px;font-size:15px;line-height:1.5;position:relative;background:rgba(255,255,255,.35);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.4);border-top:1px solid rgba(255,255,255,.9);border-left:1px solid rgba(255,255,255,.9);box-shadow:0 8px 24px rgba(0,0,0,.04);color:#0f172a;display:flex;flex-direction:column;align-items:flex-start;min-width:80px;word-break:break-all;overflow-wrap:break-word}
.outgoing .bubble{border-radius:20px 20px 4px 20px}
.incoming .bubble{border-radius:20px 20px 20px 4px;background:rgba(255,255,255,.55)}
.bubble.media-bub{padding:0!important;background:none!important;backdrop-filter:none!important;border:none!important;box-shadow:0 12px 30px rgba(0,0,0,.15)!important;border-radius:16px!important;overflow:hidden;min-width:unset}
.bubble.media-bub img,.bubble.media-bub video{display:block;width:100%;max-height:280px;object-fit:cover;cursor:pointer}
.file-inner{display:flex;align-items:center;gap:10px}
.file-icon{font-size:28px;flex-shrink:0}
.file-info{flex:1;min-width:0}
.file-name{font-size:13px;font-weight:600;color:#0f172a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-sz{font-size:11px;color:#64748b}
.dl-btn{display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:5px 12px;background:rgba(59,130,246,.12);border:none;border-radius:999px;font-size:12px;font-weight:700;color:#3b82f6;cursor:pointer;text-decoration:none}
.msg-meta{align-self:flex-end;margin-top:5px;margin-bottom:-3px;display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:rgba(15,23,42,.5)}
.check-marks{display:flex;align-items:center;margin-left:2px}
.check-1,.check-2{stroke:rgba(15,23,42,.3);transition:stroke .4s ease}
.check-1.lit,.check-2.lit{stroke:#059669}
.cancel-notice{text-align:center;font-size:12px;color:#94a3b8;padding:6px 20px;font-weight:500;width:100%}
.reaction-bar{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.rbadge{display:inline-flex;align-items:center;gap:2px;background:rgba(255,255,255,.75);backdrop-filter:blur(10px);border:1.5px solid rgba(255,255,255,.9);border-radius:999px;padding:3px 8px;font-size:13px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.04);transition:all .15s ease}
.rbadge.active{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.3)}
.input-bar-container{padding:10px 16px 14px;width:100%}
.input-floating-bar{display:flex;flex-direction:column;background:rgba(255,255,255,.3);backdrop-filter:blur(35px) saturate(200%);-webkit-backdrop-filter:blur(35px) saturate(200%);border:1px solid rgba(255,255,255,.5);border-top:1px solid rgba(255,255,255,.9);border-left:1px solid rgba(255,255,255,.9);box-shadow:0 16px 40px rgba(0,0,0,.08);padding:10px 14px;border-radius:28px;max-height:54px;transition:all .45s cubic-bezier(.25,1,.5,1);overflow:hidden;width:100%}
.input-floating-bar.media-open{max-height:230px;border-radius:22px}
.input-main-row{display:flex;align-items:center;width:100%;height:34px;min-width:0}
/* plus-btn: 添付メニュー開閉ボタン。形状のみ定義し、素材はglass-clearに任せる。 */
.plus-btn{border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;width:34px;height:34px;flex-shrink:0;transition:transform .3s ease}
.input-floating-bar.media-open .plus-btn{transform:rotate(45deg)}
.txt-form{flex:1;display:flex;align-items:center;gap:8px;margin-left:10px;min-width:0}
.txt-form input{flex:1;min-width:0;border:none;background:transparent;outline:none;font-size:16px;color:#0f172a;padding:6px 0}
.txt-form input::placeholder{color:rgba(15,23,42,.4)}
/* glass-send-btn: 送信ボタン。素材(背景/ぼかし/縁)はliquidGlass.cssの
   .glass-clearに統一し、ここでは形状とホバー/タップ時の追加演出のみ定義する。 */
.glass-send-btn{
  position:relative;width:34px;height:34px;border-radius:50%;border:none;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;cursor:pointer;outline:0;padding:0;
}
.glass-send-btn:hover{transform:scale(1.08);}
.glass-send-btn:active{transform:scale(0.95);}
.version-badge{position:fixed;left:8px;bottom:6px;font-size:10px;color:rgba(100,116,139,.6);z-index:10000;pointer-events:none;user-select:none;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
html.dark-mode .version-badge{color:rgba(148,163,184,.5)}
.media-opts{display:flex;flex-direction:column;gap:4px;padding-top:10px;margin-top:8px;border-top:1px solid rgba(255,255,255,.4);opacity:0;transform:translateY(-8px);transition:all .4s ease}
.input-floating-bar.media-open .media-opts{opacity:1;transform:translateY(0)}
.mopt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;cursor:pointer;border:none;background:none;width:100%;text-align:left}
.mopt:hover{background:rgba(255,255,255,.5)}
.mopt span{font-size:14px;font-weight:600;color:#1e293b}
.menu-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,.08);opacity:0;pointer-events:none;transition:all .3s ease;z-index:150}
.menu-overlay.show{opacity:1;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);pointer-events:auto}
.ctx-menu{position:absolute;background:rgba(255,255,255,.6);backdrop-filter:blur(40px) saturate(200%);-webkit-backdrop-filter:blur(40px) saturate(200%);border:1px solid rgba(255,255,255,.7);border-top:1px solid rgba(255,255,255,1);border-left:1px solid rgba(255,255,255,1);box-shadow:0 20px 50px rgba(0,0,0,.12);min-width:190px;z-index:200;pointer-events:none;border-radius:24px;transform:scale(.4) translateY(30px);opacity:0;transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .2s ease;overflow:hidden}
.ctx-menu.show{pointer-events:auto;transform:scale(1) translateY(0);opacity:1}
.ctx-btn{background:none;border:none;padding:14px 18px;width:100%;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s}
.ctx-btn:hover{background:rgba(255,255,255,.5)}
.ctx-edit{color:#007aff}.ctx-pin{color:#8b5cf6}.ctx-del{color:#ff3b30}.ctx-react{color:#f59e0b}
.ctx-div{height:1px;background:rgba(0,0,0,.05);margin:0 12px}
.react-picker{position:absolute;display:flex;gap:6px;padding:10px 14px;background:rgba(255,255,255,.88);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.9);border-radius:999px;box-shadow:0 8px 32px rgba(0,0,0,.1);z-index:260;opacity:0;pointer-events:none;transition:all .25s cubic-bezier(.34,1.56,.64,1);transform:scale(.8) translateY(10px)}
.react-picker.show{opacity:1;pointer-events:auto;transform:scale(1) translateY(0)}
.rp-btn{font-size:22px;background:none;border:none;cursor:pointer;padding:2px 4px;border-radius:8px;transition:transform .15s ease}
.rp-btn:hover{transform:scale(1.3)}
.media-modal{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;background:rgba(0,0,0,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:400;display:flex;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:opacity .3s ease;overflow:hidden}
.media-modal.show{opacity:1;pointer-events:auto}
.mm-inner{width:100%;height:100%;display:flex;justify-content:center;align-items:center;position:relative}
.mm-inner img,.mm-inner video{max-width:96%;max-height:96%;border-radius:12px;object-fit:contain}
.mm-close{position:absolute;top:22px;right:22px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:50%;width:42px;height:42px;display:flex;justify-content:center;align-items:center;cursor:pointer;z-index:420}
/* ネイティブの電話アプリ(発信中/着信中/通話中画面)を参考にしたレイアウト。
   中央の浮遊カードではなく、画面全体を使い、上部に名前とステータス、
   中央にアバター(または相手の映像)、下部にドッキングされたコントロール
   パネルというネイティブの標準的な構成に変更。 */
/* position:absoluteだと、ページがスクロール可能な状態(コンテンツが長い)で
   通話を開始した場合、「ページの一番上から100vh分」の位置に固定されてしまい、
   実際のビューポート(今画面に見えている範囲)とズレて、下部のコントロール
   パネルが画面外にはみ出し操作不能になる不具合があった。
   position:fixedに変更し、常に「今見えている画面」を基準に配置する。
   高さも100vh(静的なビューポート高さ)ではなく100dvh(動的ビューポート高さ)を
   優先させ、モバイルブラウザのアドレスバー表示/非表示による実効高さの変動にも
   追従できるようにする(100dvh非対応の古いブラウザ向けに100vhもフォールバックとして残す)。 */
.call-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;box-sizing:border-box;background:rgba(20,22,30,.55);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);z-index:500;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:env(safe-area-inset-top,48px) 0 env(safe-area-inset-bottom,32px);opacity:0;pointer-events:none;transition:opacity .4s var(--glass-ease, ease)}
.call-overlay.show{opacity:1;pointer-events:auto}
/* call-cardはヘッダー(名前/ステータス)+アバターを縦に並べる領域。
   ネイティブ風にするため背景・ガラス質感は持たせず(映像の上に直接文字を置く)、
   テキストには影を付けて可読性を確保する。 */
.call-card{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:auto;max-width:100%;padding:12px 20px;text-align:center;z-index:1;box-sizing:border-box}
.call-av{width:128px;height:128px;min-width:128px;min-height:128px;max-width:128px;max-height:128px;flex-shrink:0;border-radius:50%;margin:20px auto 4px;box-shadow:0 12px 36px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:700;color:#fff;background-size:cover;background-position:center}
.call-name{font-size:26px;font-weight:700;color:#fff;margin-bottom:6px;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.call-status{font-size:15px;font-weight:600;color:rgba(255,255,255,.82);text-shadow:0 1px 8px rgba(0,0,0,.4)}
/* 下部のドッキングされたコントロールパネル(glass-regularで質感を出す)。
   ネイティブの通話アプリのように、丸背景のアイコンボタンをグリッド状に収める。 */
.call-controls-panel{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;width:calc(100% - 48px);max-width:340px;padding:26px 22px;border-radius:32px;z-index:1;margin-bottom:14px}
/* 通話終了ボタン: 意味の即時性が重要なため、Clear Glassをベースにしつつ
   赤みを乗せた「色付きガラス」にする(全面赤ではなく、ガラス質感は保つ)。 */
.end-btn{background:rgba(239,68,68,.55);backdrop-filter:blur(var(--glass-blur-clear,36px)) saturate(140%);-webkit-backdrop-filter:blur(var(--glass-blur-clear,36px)) saturate(140%);border:1px solid rgba(255,255,255,.35);border-radius:50%;width:64px;height:64px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 24px rgba(239,68,68,.4);transform:rotate(135deg)}
/* 応答/拒否ボタンも同様に色付きClear Glassにする */
.accept-btn-glass{background:rgba(34,197,94,.55);backdrop-filter:blur(var(--glass-blur-clear,36px)) saturate(140%);-webkit-backdrop-filter:blur(var(--glass-blur-clear,36px)) saturate(140%);border:1px solid rgba(255,255,255,.35)}
.decline-btn-glass{background:rgba(239,68,68,.55);backdrop-filter:blur(var(--glass-blur-clear,36px)) saturate(140%);-webkit-backdrop-filter:blur(var(--glass-blur-clear,36px)) saturate(140%);border:1px solid rgba(255,255,255,.35)}
.btn-glass{position:relative;padding:12px 24px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:12px;color:#fff;font-weight:600;cursor:pointer;transition:all 0.3s ease;box-shadow:0 8px 32px rgba(31,38,135,0.15)}
.btn-glass:hover{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.3);box-shadow:0 12px 40px rgba(31,38,135,0.25);transform:translateY(-2px)}
.btn-glass:active{transform:translateY(0);box-shadow:0 4px 16px rgba(31,38,135,0.15)}
</style>
<script defer src="/js/globalBg.js"></script>
<script defer src="/js/globalSettings.js"></script>
<script defer src="/js/liquidGlass.js"></script>
<script defer src="/js/pushSubscribe.js"></script>
<script defer src="/js/deepgramVoice.js"></script>
<script defer src="/js/callRecording.js"></script>
<script defer src="/js/cloudinaryE2EUpload.js"></script>
<script src="/js/nacl.min.js"></script>
<script src="/js/nacl-util.min.js"></script>
<script src="/js/i18n.js"></script>
</head>
<body>
<svg style="position:absolute;width:0;height:0">
  <defs>
    <filter id="glassFrost" primitiveUnits="objectBoundingBox" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise" seed="4"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.02"/>
    </filter>
  </defs>
</svg>
<div class="phone-container">
  <div class="version-badge">Bro Chat v1.28.2 beta</div>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <div class="app-header-container">
    <div class="app-header-bar">
      <a href="talklist.html" class="back-link">←</a>
      <div class="partner-avatar" id="partnerAv"></div>
      <div style="flex:1;min-width:0">
        <div class="name" id="partnerName">ユーザー名</div>
        <div class="status" data-i18n="online">オンライン</div>
      </div>
      <button class="phone-btn glass-clear glass-interactive" id="videoCallBtn" type="button" style="margin-right:6px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      </button>
      <button class="phone-btn glass-clear glass-interactive" id="phoneBtn" type="button">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </button>
    </div>
  </div>

  <div class="pin-banner" id="pinBanner" style="display:none;flex-direction:column;align-items:stretch;max-height:140px;overflow-y:auto;">
    <div id="pinnedList"></div>
  </div>

  <div class="chat-screen" id="chatScreen"></div>

  <div class="input-bar-container">
    <div id="replyPreview" style="background:rgba(59,130,246,.1);border-left:3px solid #3b82f6;padding:8px 12px;margin-bottom:8px;border-radius:6px;display:none;font-size:13px;opacity:0;transition:opacity 0.2s;max-height:60px;overflow-y:auto;">
      <div style="font-weight:600;color:#1e293b;margin-bottom:3px;" data-i18n="replying_to">リプライ中:</div>
      <div id="replyText" style="color:#64748b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></div>
      <button type="button" onclick="cancelReply()" style="background:none;border:none;color:#64748b;cursor:pointer;padding:3px;margin-top:3px;font-size:12px;" data-i18n="cancel">キャンセル</button>
    </div>
    <div class="input-floating-bar" id="inputBar">
      <div class="input-main-row">
        <button class="plus-btn glass-clear glass-interactive" id="plusBtn" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>

<script>
const REACTIONS = ['❤️','😂','👍','😮','😢','🔥','👏','🎉'];
const COLORS = ['#3b82f6','#ec4899','#8b5cf6','#f59e0b','#10b981','#ef4444','#06b6d4','#84cc16'];

function nameColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffffffff;
  return COLORS[Math.abs(h) % COLORS.length];
}

const params = new URLSearchParams(location.search);
const partnerName = params.get('name') || 'ユーザー名';
const otherId = params.get('userId') || params.get('id') || params.get('callerId');
// アバター画像はURLに乗せると431エラー(ヘッダ肥大化)の原因になるため、
// API経由で別途取得する(loadPartnerProfile参照)
let otherPic = '';
const myName = localStorage.getItem('myName') || '自分';
const myAvatar = localStorage.getItem('myAvatar') || '';
const myUserIdForCheck = localStorage.getItem('ring_userId');

// 相手のオンライン/オフライン表示を更新する
function setPartnerOnlineStatus(online) {
  const statusEl = document.querySelector('.status');
  if (!statusEl) return;
  statusEl.removeAttribute('data-i18n');
  if (window.i18n) {
    statusEl.textContent = online ? i18n.t('online') : i18n.t('offline');
  } else {
    statusEl.textContent = online ? 'オンライン' : 'オフライン';
  }
  statusEl.style.color = online ? '' : '#94a3b8';
}

// 自分自身とのチャットは開けないようにする（データ不整合防止）
if (otherId && myUserIdForCheck && String(otherId) === String(myUserIdForCheck)) {
  alert(i18n.t('err_self_chat'));
  location.href = '/talklist.html';
}

const token = localStorage.getItem('ring_token');
const myUserId = localStorage.getItem('ring_userId');
if (!token) location.href = '/auth.html';

// SW通知タップ時、まだWS/SDPが届いていない場合にaccept/decline要求を保持する変数
// (この変数を参照する処理は複数箇所にあるため、ファイル冒頭で先に宣言する)
let pendingBgCallAction = null;

// talklist.html経由(Service Worker通知タップ)で開かれた場合のURL着信パラメータ
// 実際のSDPはこの後WS経由のcall_offerイベントで届くので、ここではペンディング登録のみ行う
const urlCallId = params.get('callId');
const urlAction = params.get('action');
const urlIsVideoParam = params.get('isVideo') === '1'; // isVideoCall変数は後方で宣言されるため、ここでは一時変数に保持
if (urlCallId) {
  pendingBgCallAction = { callId: urlCallId, action: urlAction === 'answer' ? null : urlAction };
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', ...(opts.headers || {}) },
  });
  return res.json();
}

// E2E暗号化用：鍵ペア生成・登録・暗号化・復号化
let myKeyPair = null;
const publicKeyCache = new Map(); // userId -> Uint8Array公開鍵（メモリキャッシュ）

// 自分の鍵ペアを取得（なければ生成してサーバーに公開鍵を登録）
async function getOrCreateMyKeyPair() {
  if (myKeyPair) return myKeyPair;

  const keyStorageName = `e2e_keypair_${myUserId}`;
  let keyStr = localStorage.getItem(keyStorageName);

  if (!keyStr) {
    // 新規鍵ペア生成（Curve25519）
    myKeyPair = nacl.box.keyPair();
    keyStr = JSON.stringify({
      publicKey: Array.from(myKeyPair.publicKey),
      secretKey: Array.from(myKeyPair.secretKey)
    });
    localStorage.setItem(keyStorageName, keyStr);
    await registerMyPublicKey(myKeyPair);
  } else {
    const keyObj = JSON.parse(keyStr);
    myKeyPair = {
      publicKey: new Uint8Array(keyObj.publicKey),
      secretKey: new Uint8Array(keyObj.secretKey)
    };

    // 重要: サーバー側に保存されている公開鍵と、ローカルの鍵ペアが
    // 本当に一致しているかを毎回確認する。
    // これが無いと、サーバーのDBがリセットされたりユーザーレコードが
    // 作り直された場合、ローカルには「古い」鍵ペアが残ったまま
    // サーバー側は「この人の公開鍵を知らない」状態になり、
    // 以降このユーザーが関わる全ての暗号化メッセージで復号が
    // 必ず失敗するという致命的な不整合が、ユーザーが気づく手段もなく
    // 永続してしまう。
    try {
      const myLocalPublicKeyB64 = nacl.util.encodeBase64(myKeyPair.publicKey);
      const me = await api('/api/friends/me');
      if (!me || me.publicKey !== myLocalPublicKeyB64) {
        console.warn('サーバー側の公開鍵とローカルの鍵が不一致です。再登録します。');
        await registerMyPublicKey(myKeyPair);
      }
    } catch (err) {
      console.error('公開鍵の整合性チェックに失敗しました:', err);
    }
  }
  return myKeyPair;
}

async function registerMyPublicKey(keyPair) {
  try {
    await api('/api/friends/publickey', {
      method: 'POST',
      body: JSON.stringify({ publicKey: nacl.util.encodeBase64(keyPair.publicKey) })
    });
  } catch (err) {
    console.error('公開鍵登録エラー:', err);
  }
}

// 相手の公開鍵を取得（キャッシュ優先、なければサーバーから取得）
// forceRefresh=trueの場合、メモリキャッシュを無視して必ずサーバーから
// 最新の公開鍵を取得する(相手が鍵を再登録した直後などに使う)
async function getRecipientPublicKey(userId, forceRefresh = false) {
  if (!forceRefresh && publicKeyCache.has(userId)) {
    return publicKeyCache.get(userId);
  }

  try {
    const data = await api('/api/friends/publickey/' + userId);
    if (data.publicKey) {
      const keyBytes = nacl.util.decodeBase64(data.publicKey);
      publicKeyCache.set(userId, keyBytes);
      return keyBytes;
    }
  } catch (err) {
    console.error('公開鍵取得エラー:', err);
  }
  return null;
}

// メッセージ内容を暗号化（自分の秘密鍵 + 相手の公開鍵）
async function encryptMessage(plaintext, recipientId) {
  const myKeys = await getOrCreateMyKeyPair();
  const recipientPublicKey = await getRecipientPublicKey(recipientId);

  if (!recipientPublicKey) {
    // 相手がまだ公開鍵を登録していない場合は平文のまま送る（フォールバック）
    console.warn('相手の公開鍵が見つかりません。暗号化なしで送信します。');
    return { encrypted: false, content: plaintext };
  }

  const nonce = nacl.randomBytes(nacl.box.nonceLength);
  const message = nacl.util.decodeUTF8(plaintext);
  const encryptedBytes = nacl.box(message, nonce, recipientPublicKey, myKeys.secretKey);

  // nonce + 暗号化データをBase64エンコード
  const full = new Uint8Array(nonce.length + encryptedBytes.length);
  full.set(nonce);
  full.set(encryptedBytes, nonce.length);

  return { encrypted: true, content: nacl.util.encodeBase64(full) };
}

// メッセージ内容を復号化（自分の秘密鍵 + 送信者の公開鍵）
async function decryptMessage(encryptedBase64, senderId) {
  const myKeys = await getOrCreateMyKeyPair();
  const senderPublicKey = await getRecipientPublicKey(senderId);

  if (!senderPublicKey) {
    console.warn('送信者の公開鍵が見つかりません');
    return null;
  }

  const tryDecrypt = (pubKey) => {
    try {
      const full = nacl.util.decodeBase64(encryptedBase64);
      const nonce = full.slice(0, nacl.box.nonceLength);
      const encryptedBytes = full.slice(nacl.box.nonceLength);
      const decrypted = nacl.box.open(encryptedBytes, nonce, pubKey, myKeys.secretKey);
      return decrypted ? nacl.util.encodeUTF8(decrypted) : null;
    } catch (e) {
      console.error('復号化エラー:', e);
      return null;
    }
  };

  let result = tryDecrypt(senderPublicKey);
  if (result !== null) return result;

  // 初回の復号に失敗した場合、キャッシュされた送信者の公開鍵が
  // 古い(相手が鍵を再登録した後だった等)可能性があるため、
  // キャッシュを無視して強制的にサーバーから最新の公開鍵を取得し
  // もう一度だけ復号を試みる。
  console.warn('復号化に失敗しました。送信者の公開鍵を再取得して再試行します。');
  const freshPublicKey = await getRecipientPublicKey(senderId, true);
  if (freshPublicKey) {
    result = tryDecrypt(freshPublicKey);
  }
  return result;
}

// メッセージのcontentを復号する共通ヘルパー。
// テキストメッセージ: content自体が暗号化Base64 → そのままdecryptMessageにかける。
// メディアメッセージ: content は平文JSON `{text, media, mediaType}` で、
//   暗号化されているのは内側の media フィールドだけ。
//   content全体を復号にかけると必ず失敗する（テキストは「復号化に失敗しました」、
//   画像は暗号化バイナリがそのままsrcに渡り表示できない、という形でバグが起きる）。
// 戻り値: 表示用にそのままrenderできる文字列（テキストは平文、メディアは
//   {text, media: 復号済みBase64, mediaType} を再JSON化した文字列）。
async function decryptMessageContent(rawContent, senderId) {
  let parsed = null;
  try {
    parsed = JSON.parse(rawContent);
  } catch (e) {
    // JSONでなければ通常のテキストメッセージ
  }

  if (parsed && typeof parsed === 'object') {
    if (parsed.mediaUrl && parsed.mediaType) {
      // Cloudinary方式: コンテンツ自体は暗号化されておらず、
      // 復号はlazyLoadObserver側で実施する。そのままrawContentを返す。
      return rawContent;
    }
    if (parsed.media && parsed.mediaType) {
      // Base64直送り方式: media フィールドだけを復号する
      const decryptedMedia = await decryptMessage(parsed.media, senderId);
      if (decryptedMedia === null) {
        return null;
      }
      return JSON.stringify({ text: parsed.text || '', media: decryptedMedia, mediaType: parsed.mediaType });
    }
  }

  // 通常のテキストメッセージ
  return await decryptMessage(rawContent, senderId);
}

function handleMedia(f, t) {
  if (!f) return;
  if (t === 'file') {
    alert(i18n.t('err_file_send_unsupported'));
    return;
  }

  // サイズ上限（groupchat.htmlと同じ基準。CloudinaryにE2E暗号化して直接アップロードする方式のため、
  // サーバーのJSON body上限(50MB)には影響されない）
  const maxSize = t === 'video' ? 500 * 1024 * 1024 : 100 * 1024 * 1024;
  if (f.size > maxSize) {
    alert(i18n.t(t === 'video' ? 'media_type_video' : 'media_type_image') + i18n.t('err_media_too_large_template').replace('{limit}', maxSize / 1024 / 1024));
    document.getElementById('inputBar').classList.remove('media-open');
    return;
  }

  document.getElementById('inputBar').classList.remove('media-open');
  sendMediaViaCloudinary(f, t);
}

async function sendMediaViaCloudinary(f, t) {
  const sendBtn = document.getElementById('sendBtn');
  sendBtn.innerHTML = '<div style="width:16px;height:16px;border:2px solid #007aff;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;"></div>';

  try {
    // 1対1チャットの共有鍵: 自分の秘密鍵 + 相手の公開鍵からECDHで導出した32byteの
    // 共有シークレット(nacl.box.before)。これはbox暗号と同じ数学的基盤で、
    // 対称鍵(secretbox)として cloudinaryE2EUpload.js にそのまま渡せる。
    const myKeys = await getOrCreateMyKeyPair();
    const recipientPublicKey = await getRecipientPublicKey(otherId);
    if (!recipientPublicKey) {
      alert(i18n.t('err_encryption_not_ready'));
      sendBtn.innerHTML = paperPlane;
      return;
    }
    const sharedKey = nacl.box.before(recipientPublicKey, myKeys.secretKey);

    const caption = `[${t === 'image' ? '画像' : '動画'}]`;
    const metadata = await cloudinaryE2EUploader.uploadEncryptedChunked(
      f,
      sharedKey,
      `brochat/dm/${[myUserId, otherId].sort().join('_')}`,
      (progress) => console.log('[upload] Progress:', progress + '%')
    );

    if (!metadata || !metadata.cloudinaryUrl) {
      throw new Error('Upload failed');
    }

    const data = await api('/api/messages/send', {
      method: 'POST',
      body: JSON.stringify({
        recipientId: otherId,
        content: caption,
        mediaType: t,
        mediaUrl: metadata.cloudinaryUrl,
        mediaPublicId: metadata.cloudinaryPublicId,
        encryptedMetadata: metadata.encryptedMetadata,
        chunkCount: metadata.chunkCount,
        encrypted: true,
      }),
    });

    if (data.message) {
      // 自分が送った分は、平文のCloudinary URL+メタデータ+実サイズ情報をそのままローカル表示用に使う
      // （メディア自体はCloudinary上で暗号化保存されているため、自分の画面でも同じ復号経路で表示する）
      const ownContent = JSON.stringify({
        text: '', mediaType: t, mediaUrl: metadata.cloudinaryUrl,
        mediaPublicId: metadata.cloudinaryPublicId, encryptedMetadata: metadata.encryptedMetadata,
        chunkCount: metadata.chunkCount,
      });
      cacheOwnPlaintext(data.message.id, ownContent);
      const displayMsg = { ...data.message, content: ownContent };
      addRealMessage(displayMsg);
      renderMessage(displayMsg);
    } else if (data.error) {
      alert(i18n.t('err_send_failed') + data.error);
    } else {
      console.error('unexpected response:', data);
      alert(i18n.t('err_send_failed_generic'));
    }
  } catch (err) {
    console.error('media send error:', err);
    alert(i18n.t('err_file_upload_failed') + err.message);
  } finally {
    sendBtn.innerHTML = paperPlane;
  }
}

// 共有IntersectionObserver（複数メッセージで使い回し）
const lazyLoadObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting && !entry.target.dataset.loaded) {
      entry.target.dataset.loaded = 'true';
      lazyLoadObserver.unobserve(entry.target);
      loadLazyMedia(entry.target);
    }
  });
}, { rootMargin: '50px' });

async function loadLazyMedia(placeholder) {
  const mediaType = placeholder.dataset.mediaType;
  let mediaSrc = placeholder.dataset.mediaSrc;

  if (mediaSrc && mediaSrc.startsWith('cloudinary:') && placeholder._cloudinaryMedia) {
    try {
      const myKeys = await getOrCreateMyKeyPair();
      const recipientPublicKey = await getRecipientPublicKey(otherId);
      if (!recipientPublicKey) throw new Error('相手の公開鍵が見つかりません');
      const sharedKey = nacl.box.before(recipientPublicKey, myKeys.secretKey);

      const { mediaUrl, encryptedMetadata } = placeholder._cloudinaryMedia;
      const blob = await cloudinaryE2EUploader.downloadAndDecryptMedia(mediaUrl, encryptedMetadata, sharedKey);
      mediaSrc = URL.createObjectURL(blob);
    } catch (e) {
      console.error('[lazyLoadMedia] decrypt error:', e);
      placeholder.textContent = '(メディアの復号に失敗しました)';
      return;
    }
  }

  let mediaEl;
  if (mediaType === 'image') {
    mediaEl = document.createElement('img');
    mediaEl.src = mediaSrc;
    mediaEl.loading = 'lazy';
    mediaEl.style.cssText = 'width:100%;max-width:100%;border-radius:8px;';
  } else if (mediaType === 'video') {
    mediaEl = document.createElement('video');
    mediaEl.src = mediaSrc;
    mediaEl.controls = true;
    mediaEl.preload = 'metadata';
    mediaEl.style.cssText = 'width:100%;max-width:100%;border-radius:8px;';
  }
  if (mediaEl) {
    placeholder.replaceWith(mediaEl);
    let lp = false;
    setTimeout(() => { lp = true; }, 400);
    mediaEl.addEventListener('click', () => { if (!lp) openMedia(mediaEl, mediaType); });
  }
}

// 実際のメッセージ送受信管理
let realMessages = [];
const msgDOMCache = new Map(); // msgId -> DOM要素（querySelector高速化用）

async function sendRealMessage(content) {
  // 楽観的更新: 送信中でも即座に画面へ反映する
  const tempId = 'temp-' + Date.now() + '-' + Math.random().toString(36).slice(2, 9);
  const optimisticMsg = { id: tempId, senderId: myUserId, recipientId: otherId, content, createdAt: new Date().toISOString(), isRead: false };
  addRealMessage(optimisticMsg);
  renderMessage(optimisticMsg);

  try {
    const { encrypted, content: sendContent } = await encryptMessage(content, otherId);
    const payload = {
      recipientId: otherId,
      content: sendContent,
      encrypted,
    };
    if (replyingTo) {
      payload.repliedToId = replyingTo;
    }
    const data = await api('/api/messages/send', {
      method: 'POST',
      body: JSON.stringify(payload),
    });
    if (data && data.message) {
      // 自分が送った平文をローカルにキャッシュ（自分は受信者ではないため復号化できないので、自分用に平文を保存）
      cacheOwnPlaintext(data.message.id, content);
      // 仮メッセージをサーバーの正式なメッセージに差し替え
      removeMessageById(tempId);
      const displayMsg = { ...data.message, content: content };
      addRealMessage(displayMsg);
      renderMessage(displayMsg);
      // リプライ表示をクリア
      cancelReply();
    } else {
      console.error('send response missing message:', data);
    }
  } catch (err) {
    console.error('send error:', err);
  }
}

// 仮メッセージ（送信中プレースホルダー）を画面とメモリ上のリストから削除
function removeMessageById(msgId) {
  const el = document.querySelector(`[data-msg-id="${msgId}"]`);
  if (el) el.remove();
  msgDOMCache.delete(msgId);
  const idx = realMessages.findIndex(m => m.id === msgId);
  if (idx !== -1) realMessages.splice(idx, 1);
}

// 自分が送信したメッセージの平文をローカルストレージにキャッシュ
// （E2E暗号化では送信者も暗号文を復号できないため、自分用の控えとして保存する）
// 画像・動画は非常に大きい(Base64で数MB)ため、キャッシュ全体でlocalStorageの
// 容量上限(ブラウザにより5〜10MB)を超えるとQuotaExceededErrorで書き込み自体が
// 失敗する。失敗した場合は諦めて「復号できません」表示にフォールバックさせる
// （画像添付メッセージのキャッシュを個別に間引くよりシンプルで安全なため）。
function cacheOwnPlaintext(msgId, plaintext) {
  try {
    const cacheKey = `own_plaintext_${myUserId}`;
    let cache = JSON.parse(localStorage.getItem(cacheKey) || '{}');
    cache[msgId] = plaintext;
    // キャッシュ件数制限（最新500件のみ保持）
    const keys = Object.keys(cache);
    if (keys.length > 500) {
      const toRemove = keys.slice(0, keys.length - 500);
      toRemove.forEach(k => delete cache[k]);
    }
    localStorage.setItem(cacheKey, JSON.stringify(cache));
  } catch (e) {
    // QuotaExceededError等: 直近の大きいメディアキャッシュから間引いて1回だけ再試行
    console.warn('平文キャッシュ保存エラー、古いメディアキャッシュを間引いて再試行します:', e.message);
    try {
      const cacheKey = `own_plaintext_${myUserId}`;
      let cache = JSON.parse(localStorage.getItem(cacheKey) || '{}');
      const entries = Object.entries(cache);
      // メディア(長い文字列)を古い順に間引く
      const mediaEntries = entries.filter(([, v]) => typeof v === 'string' && v.length > 10000);
      mediaEntries.slice(0, Math.ceil(mediaEntries.length / 2)).forEach(([k]) => delete cache[k]);
      cache[msgId] = plaintext;
      localStorage.setItem(cacheKey, JSON.stringify(cache));
    } catch (e2) {
      console.error('平文キャッシュ保存に失敗しました（このメディアはこのデバイスで復元できません）:', e2.message);
    }
  }
}

function getOwnPlaintext(msgId) {
  try {
    const cacheKey = `own_plaintext_${myUserId}`;
    const cache = JSON.parse(localStorage.getItem(cacheKey) || '{}');
    return cache[msgId] || null;
  } catch (e) {
    return null;
  }
}

function addRealMessage(msg) {
  const idx = realMessages.findIndex(m => m.id === msg.id);
  if (idx === -1) realMessages.push(msg);
  else realMessages[idx] = msg;
}

// メッセージ内容をパースして { displayText, mediaType, mediaSrc } を返す
// パース結果はメッセージオブジェクトにキャッシュして、毎回のJSONパースを避ける。
// 注意: renderMessageImplはメッセージ更新時(既読・リアクション等)に同じmsgへ
// 何度もDOM再構築(innerHTML='')をかけ直す設計のため、mediaSrcをキャッシュから
// 除外すると2回目以降の再描画で画像が消えるバグになる。そのため全フィールドを
// キャッシュする（画像1枚分のBase64を保持するだけなので実用上のメモリ影響は小さい）。
function parseMsgContent(content, msg) {
  if (msg && msg._parsedCache && msg._parsedCache._sourceContent === content) {
    return msg._parsedCache;
  }
  
  let result = { displayText: content, mediaType: null, mediaSrc: null, cloudinaryMedia: null };
  try {
    const parsed = JSON.parse(content);
    if (parsed && parsed.mediaUrl && parsed.mediaType) {
      // Cloudinary方式: 復号は重い処理のため、実際に画面に表示される瞬間まで遅延させる。
      // mediaSrcにはプレースホルダー用の一意な文字列を入れ、cloudinaryMediaに
      // 復号に必要な情報一式を保持しておく(lazyLoadObserver側で使用)。
      result = {
        displayText: parsed.text || '',
        mediaType: parsed.mediaType,
        mediaSrc: 'cloudinary:' + (parsed.mediaPublicId || parsed.mediaUrl),
        cloudinaryMedia: {
          mediaUrl: parsed.mediaUrl,
          encryptedMetadata: parsed.encryptedMetadata,
        },
      };
    } else if (parsed && parsed.media && parsed.mediaType) {
      result = { displayText: parsed.text || '', mediaType: parsed.mediaType, mediaSrc: parsed.media, cloudinaryMedia: null };
    }
  } catch (e) {}
  
  if (msg) {
    msg._parsedCache = { ...result, _sourceContent: content };
  }
  return result;
}

// レンダリングキューとバッチ処理（複数のrenderMessage呼び出しを集約）
let renderQueue = [];
let renderScheduled = false;
// 履歴の一括読み込み中はtrueにして、メッセージ出現アニメーションを抑制する
// (initialLoadHistory参照)
let isBulkHistoryLoad = false;

function queueRender(msg) {
  renderQueue.push(msg);
  if (!renderScheduled) {
    renderScheduled = true;
    requestAnimationFrame(flushRenderQueue);
  }
}

function flushRenderQueue() {
  if (renderQueue.length === 0) {
    renderScheduled = false;
    return;
  }
  
  // 1フレームで最大5件だけ処理（CPU負荷分散）
  const MAX_PER_FRAME = 5;
  const toRender = renderQueue.splice(0, Math.min(MAX_PER_FRAME, renderQueue.length));
  toRender.forEach(msg => {
    renderMessageImpl(msg);
  });
  
  renderScheduled = false;
  if (renderQueue.length > 0) {
    requestAnimationFrame(flushRenderQueue); // 次フレームで続行
  }
}

// 実際のレンダリング関数（内部用）
function renderMessage(msg) {
  queueRender(msg);
}

function renderMessageImpl(msg) {
  if (!msg || !msg.id) return null;
  const cs = document.getElementById('chatScreen');
  const isMine = msg.senderId === myUserId;
  let msgDiv = msgDOMCache.get(msg.id);
  const isNew = !msgDiv;

  if (isNew) {
    msgDiv = document.createElement('div');
    msgDiv.dataset.msgId = msg.id;
  }
  msgDiv.className = 'message ' + (isMine ? 'outgoing' : 'incoming');
  msgDiv.innerHTML = ''; // 中身だけクリア（要素自体は使い回す）

  const wrap = document.createElement('div'); wrap.classList.add('msg-wrap');
  const bubble = document.createElement('div'); bubble.classList.add('bubble');

  // 削除済みメッセージ
  if (msg.deletedAt) {
    msgDiv.className = 'cancel-notice-wrap';
    const notice = document.createElement('div');
    notice.className = 'cancel-notice';
    notice.textContent = isMine ? `${myName}がメッセージの送信を取り消しました` : `${partnerName}がメッセージの送信を取り消しました`;
    msgDiv.appendChild(notice);
    if (isNew) {
      cs.appendChild(msgDiv);
      msgDOMCache.set(msg.id, msgDiv); // キャッシュに登録
      cs.scrollTop = 99999;
    }
    return msgDiv;
  }

  const { displayText, mediaType, mediaSrc, cloudinaryMedia } = parseMsgContent(msg.content, msg);

  // リプライ対象メッセージの表示
  if (msg.repliedToId) {
    const repliedMsg = realMessages.find(m => m.id === msg.repliedToId);
    if (repliedMsg) {
      const replyQuote = document.createElement('div');
      replyQuote.style.cssText = 'background:rgba(59,130,246,.08);border-left:3px solid #3b82f6;padding:6px 8px;margin-bottom:6px;border-radius:4px;font-size:12px;color:#64748b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
      const senderName = repliedMsg.senderId === myUserId ? 'あなた' : partnerName;
      const { displayText: repliedText, mediaType: repliedMediaType } = parseMsgContent(repliedMsg.content);
      const repliedPreview = repliedMediaType === 'image' ? '[画像]'
        : repliedMediaType === 'video' ? '[動画]'
        : repliedText.substring(0, 50);
      replyQuote.textContent = `${senderName}: ${repliedPreview}`;
      bubble.appendChild(replyQuote);
    }
  }

  if (mediaSrc) {
    bubble.classList.add('media-bub');
    
    // メディアは遅延ロード：プレースホルダーだけ先に表示
    const mediaPlaceholder = document.createElement('div');
    mediaPlaceholder.className = 'media-placeholder';
    mediaPlaceholder.style.cssText = 'background:#f0f0f0;width:200px;height:150px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;';
    mediaPlaceholder.textContent = mediaType === 'image' ? '画像読み込み中...' : '動画読み込み中...';
    mediaPlaceholder.dataset.mediaSrc = mediaSrc;
    mediaPlaceholder.dataset.mediaType = mediaType;
    if (cloudinaryMedia) {
      // datasetは文字列しか持てないため、複合オブジェクトは要素の直接プロパティとして保持する
      mediaPlaceholder._cloudinaryMedia = cloudinaryMedia;
    }
    bubble.appendChild(mediaPlaceholder);
    
    // 共有ObserverにObserveさせる
    lazyLoadObserver.observe(mediaPlaceholder);
    
    if (displayText && displayText !== '[画像]' && displayText !== '[動画]') {
      const cap = document.createElement('div');
      cap.className = 'msg-text';
      cap.style.marginTop = '6px';
      cap.textContent = displayText;
      bubble.appendChild(cap);
    }
  } else if (displayText) {
    const sp = document.createElement('span'); sp.className = 'msg-text'; sp.textContent = displayText;
    bubble.appendChild(sp);
  }

  // リアクション表示（複数種類対応、自分がついているかも視覚化）
  if (msg.reactions && msg.reactions.length > 0) {
    const rDiv = document.createElement('div');
    rDiv.className = 'msg-reactions';
    rDiv.style.cssText = 'display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;';
    msg.reactions.forEach(r => {
      const rb = document.createElement('span');
      rb.style.cssText = 'background:rgba(0,0,0,.06);border-radius:10px;padding:2px 6px;font-size:12px;';
      rb.textContent = `${r.emoji}${r.count > 1 ? ' ' + r.count : ''}`;
      rDiv.appendChild(rb);
    });
    bubble.appendChild(rDiv);
  }

  const d = new Date(msg.createdAt);
  // 補足: サーバーはUTCで保存しているが、JavaScriptのDateオブジェクトの
  // getHours()/getMinutes()は元々呼び出し側のローカルタイムゾーンに
  // 自動変換した値を返す仕様のため、追加の変換は一切不要。
  // (過去の実装はここでgetTimezoneOffset()を使ってさらに変換を
  //  重ねてしまっており、実行環境のタイムゾーン設定によって
  //  数時間単位で時刻がずれる原因になっていた)
  const t = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}${msg.editedAt ? ' (編集済)' : ''}`;
  const meta = document.createElement('div'); meta.className = 'msg-meta';

  if (isMine) {
    meta.innerHTML = `<span class="time">${t}</span><div class="check-marks"><svg width="12" height="11" viewBox="0 0 12 11" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:-5px"><polyline points="1 6 4 9 11 1" class="check-1 lit"/></svg><svg width="12" height="11" viewBox="0 0 12 11" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 6 4 9 11 1" class="check-2${msg.readAt ? ' lit' : ''}"/></svg></div>`;
  } else {
    meta.innerHTML = `<span class="time">${t}</span>`;
  }
  bubble.appendChild(meta);
  wrap.appendChild(bubble);
  msgDiv.appendChild(wrap);

  if (isNew) {
    cs.appendChild(msgDiv);
    msgDOMCache.set(msg.id, msgDiv); // キャッシュに登録
    cs.scrollTop = 99999;
    // 履歴の一括読み込み中でなければ、ガラスが凝縮するように出現させる
    // (リアルタイム受信・自分の送信直後のみ演出する)
    if (!isBulkHistoryLoad && window.LiquidGlass) {
      window.LiquidGlass.materializeIn(msgDiv, true);
    }
  }

  attachPress(msgDiv, wrap, bubble, isMine);
  return msgDiv;
}

// 統合ポーリング: 新規メッセージ・既読・編集・削除・リアクション・ピン留めを1回のAPI呼び出しでまとめてチェック
// WebSocketが主軸、これは補助的なフォールバック（間隔を長めにして負荷軽減）
async function syncMessages() {
  try {
    const data = await api('/api/messages/history/' + otherId);
    if (!Array.isArray(data)) return;

    for (const msg of data) {
      const existingLocal = realMessages.find(m => m.id === msg.id);

      // 暗号化メッセージは復号化してから比較・保存
      let displayContent = msg.content;
      if (msg.encrypted && !msg.deletedAt) {
        if (msg.senderId === myUserId) {
          const cached = getOwnPlaintext(msg.id);
          displayContent = cached !== null ? cached : '(このデバイスでは表示できません)';
        } else {
          const decrypted = await decryptMessageContent(msg.content, msg.senderId);
          displayContent = decrypted !== null ? decrypted : '(復号化に失敗しました)';
        }
      }

      const changed = !existingLocal ||
        existingLocal.content !== displayContent ||
        existingLocal.deletedAt !== msg.deletedAt ||
        existingLocal.editedAt !== msg.editedAt ||
        existingLocal.readAt !== msg.readAt ||
        JSON.stringify(existingLocal.reactions) !== JSON.stringify(msg.reactions);

      const displayMsg = { ...msg, content: displayContent };
      addRealMessage(displayMsg);
      if (changed) {
        renderMessage(displayMsg);
      }
    }

    updatePinnedBanner();
  } catch (err) {
    console.error('syncMessages error:', err);
  }
}

// WebSocket接続（リアルタイム受信）+ バックグラウンド対応
let ws = null;
let wsReconnectAttempts = 0;
const MAX_RECONNECT_ATTEMPTS = 10;
const RECONNECT_DELAY = [1000, 2000, 5000, 10000, 15000, 30000, 60000, 120000, 300000, 600000];

function scheduleWsReconnect() {
  const delay = RECONNECT_DELAY[Math.min(wsReconnectAttempts, RECONNECT_DELAY.length - 1)];
  wsReconnectAttempts++;
  console.log(`[WS] Reconnecting in ${delay}ms (attempt ${wsReconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})`);
  setTimeout(connectRealWS, delay);
}

function connectRealWS() {
  const wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
  ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    console.log('[WS] Connected');
    wsReconnectAttempts = 0; // リセット
    ws.send(JSON.stringify({ type: 'auth', token }));
  };

  ws.onmessage = async e => {
    try {
      const data = JSON.parse(e.data);
      if (data.type === 'auth_ok') {
        // 自分の接続がサーバーに登録された直後に、相手の現在のオンライン状態を問い合わせる
        ws.send(JSON.stringify({ type: 'presence_query', targetUserId: otherId }));
        return;
      }
      if (data.type === 'presence_result') {
        if (data.userId === otherId) {
          setPartnerOnlineStatus(data.online);
        }
        return;
      }
      if (data.type === 'presence_update') {
        if (data.userId === otherId) {
          setPartnerOnlineStatus(data.online);
        }
        return;
      }
      if (data.type === 'new_message') {
        const msg = data.message;
        if ((msg.senderId === otherId && msg.recipientId === myUserId) || (msg.senderId === myUserId && msg.recipientId === otherId)) {
          if (msg.senderId !== myUserId) {
            // 相手からのメッセージは復号化してから表示
            let displayContent = msg.content;
            if (msg.encrypted) {
              const decrypted = await decryptMessageContent(msg.content, msg.senderId);
              if (decrypted !== null) displayContent = decrypted;
              else displayContent = '(復号化に失敗しました)';
            }
            const displayMsg = { ...msg, content: displayContent };
            addRealMessage(displayMsg);
            renderMessage(displayMsg);
            // ブラウザ通知を送信(タブを見ている最中は煩わしいため非表示時のみ)
            if (document.hidden) {
              // メディアメッセージの場合、通知本文には巨大なBase64ではなく短いラベルを出す
              const { displayText, mediaType } = parseMsgContent(displayContent);
              const notifBody = mediaType === 'image' ? '画像を送信しました'
                : mediaType === 'video' ? '動画を送信しました'
                : displayContent;
              sendNotification(partnerName, {
                body: notifBody,
                tag: 'dm-' + otherId
              });
            }
            // 既読通知を即座にWebSocketで送信（10秒待たずに）
            if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ type: 'read_receipt', recipientId: msg.senderId, msgUuid: msg.id }));
            }
          }
        }
      } else if (data.type === 'typing' && data.userId === otherId) {
        showTypingIndicator();
      } else if (data.type === 'message_edited') {
        // 編集されたメッセージのみローカル更新（全体同期ではなく差分更新）
        const msg = realMessages.find(m => m.id === data.messageId);
        if (msg) {
          let newContent = data.content;
          if (data.encrypted && msg.senderId !== myUserId) {
            const decrypted = await decryptMessageContent(data.content, msg.senderId);
            if (decrypted !== null) newContent = decrypted;
          } else if (data.encrypted && msg.senderId === myUserId) {
            // 自分がした編集のWSブロードキャストが自分自身にも返ってくるケース
            // (マルチデバイス同期のための正しい挙動)。E2E暗号化では送信者も
            // 暗号文を復号できないため、以前はここで data.content (暗号文=Base64) を
            // そのままcontentに代入してしまい、編集直後に自分の画面上で
            // メッセージが暗号文の文字列(意味不明な文字列)に化けるバグがあった。
            // 他の受信箇所(syncMessages等)と同様、自分のプレーンテキストの
            // 控えをローカルキャッシュから取得する。
            const cached = getOwnPlaintext(data.messageId);
            if (cached !== null) newContent = cached;
          }
          msg.content = newContent;
          msg.editedAt = data.editedAt;
          msg._parsedCache = null; // キャッシュクリア（再パース）
          renderMessage(msg);
        }
      } else if (data.type === 'message_deleted') {
        // 削除されたメッセージのみローカル更新
        const msg = realMessages.find(m => m.id === data.messageId);
        if (msg) {
          msg.deletedAt = new Date().toISOString();
          msg.content = '';
          renderMessage(msg);
        }
      } else if (data.type === 'message_reaction') {
        // リアクション更新のみ
        const msg = realMessages.find(m => m.id === data.messageId);
        if (msg) {
          msg.reactions = data.reactions;
          renderMessage(msg);
        }
      } else if (data.type === 'message_pinned') {
        // ピン留め状態のみ更新
        const msg = realMessages.find(m => m.id === data.messageId);
        if (msg) {
          msg.pinnedAt = data.pinned ? new Date().toISOString() : null;
          // ピン留めリスト更新
          loadPinnedMessages();
        }
      } else if (data.type === 'read_receipt') {
        // 相手が既読にした通知を受け取った
        const msg = realMessages.find(m => m.id === data.msgUuid);
        if (msg && msg.senderId === myUserId) {
          // 自分の送信メッセージが既読になった
          msg.readAt = new Date().toISOString();
          renderMessage(msg);
        }
      } else if (data.type === 'read_receipt_bulk') {
        // 相手がトーク画面を開いて、まとめて複数メッセージが既読になった通知
        if (data.readerId === otherId && Array.isArray(data.messageIds)) {
          data.messageIds.forEach(msgId => {
            const msg = realMessages.find(m => m.id === msgId);
            if (msg && msg.senderId === myUserId) {
              msg.readAt = data.readAt;
              renderMessage(msg);
            }
          });
        }
      } else if (data.type === 'call_offer') {
        onCallOffer(data);
      } else if (data.type === 'call_answer') {
        onCallAnswer(data);
      } else if (data.type === 'call_ice') {
        onCallIce(data);
      } else if (data.type === 'call_reject') {
        onCallReject(data);
      } else if (data.type === 'call_end') {
        onCallEnd(data);
      } else if (data.type === 'call_unavailable') {
        onCallUnavailable(data);
      }
    } catch (err) {}
  };

  ws.onclose = () => {
    console.log('[WS] Disconnected');
    scheduleWsReconnect();
  };
  
  ws.onerror = (err) => {
    console.error('[WS] Error:', err);
    ws.close();
  };
}

// 画面外のメッセージのBase64データをメモリから削除（メモリ節約用）
const memoryCleanupObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (!entry.isIntersecting) {
      // 画面外に出たメッセージは_parsedCacheをクリア
      const msgId = entry.target.dataset.msgId;
      const msg = realMessages.find(m => m.id === msgId);
      if (msg) {
        msg._parsedCache = null; // キャッシュクリア（再度スクロール時にJSONパース）
      }
    }
  });
}, { rootMargin: '500px' }); // 500px手前で削除開始

// すべてのメッセージをobserve
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('[data-msg-id]').forEach(el => {
    memoryCleanupObserver.observe(el);
  });
});

// 新規メッセージ追加時もobserve
const originalAppendChild = Element.prototype.appendChild;
Element.prototype.appendChild = function(child) {
  const result = originalAppendChild.call(this, child);
  if (child.dataset && child.dataset.msgId) {
    memoryCleanupObserver.observe(child);
  }
  return result;
};

// 入力中通知を送信（debounce）
let lastTypingTime = 0;
document.getElementById('msgInput').addEventListener('input', () => {
  const now = Date.now();
  if (now - lastTypingTime > 1500) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'typing', recipientId: otherId }));
    }
    lastTypingTime = now;
  }
});

async function initialLoadHistory() {
  // 履歴の一括読み込み中は、メッセージ1件ごとの出現アニメーション(materialize)を
  // 抑制する。何十件も同時にアニメーションさせると視覚的にうるさく、
  // 低スペック端末では描画負荷にもなるため、リアルタイム受信時のみ演出する。
  isBulkHistoryLoad = true;
  try {
    const data = await api('/api/messages/history/' + otherId);
    if (!Array.isArray(data)) return;

    // 復号化してから保持・描画（自分が送ったメッセージは復号化不要、相手からのみ復号化）
    for (const msg of data) {
      let displayContent = msg.content;
      if (msg.encrypted && msg.senderId !== myUserId && !msg.deletedAt) {
        const decrypted = await decryptMessageContent(msg.content, msg.senderId);
        if (decrypted !== null) displayContent = decrypted;
        else displayContent = '(復号化に失敗しました)';
      } else if (msg.encrypted && msg.senderId === myUserId) {
        // 自分が送った暗号化メッセージはローカルキャッシュから復元
        const cached = getOwnPlaintext(msg.id);
        displayContent = cached !== null ? cached : '(このデバイスでは表示できません)';
      }
      const displayMsg = { ...msg, content: displayContent };
      addRealMessage(displayMsg);
      renderMessage(displayMsg);
    }
  } catch (err) {
    console.error('initialLoadHistory error:', err);
  } finally {
    isBulkHistoryLoad = false;
  }
}

// Service Workerからのメッセージ受信：バックグラウンド着信の復帰
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('message', event => {
    const { type, callId, callerId, isVideo, action } = event.data;
    
    if (type === 'INCOMING_CALL_RESUMED' || type === 'INCOMING_CALL_DIRECT') {
      console.log(`[BG CALL] Resuming from background: callId=${callId}, callerId=${callerId}, isVideo=${isVideo}, action=${action}`);
      
      // 通話画面だけ先に開いて、ユーザーに「つながっています」感を出す
      // (otherIdはページ読み込み時のURLパラメータから決まるconstのため、通知側のcallerIdと
      //  食い違う場合はこのページの相手とは別ユーザーからの着信 → talklist経由で該当ページを開き直す)
      if (otherId && otherId !== callerId) {
        window.location.href = `/admin.html?callerId=${callerId}&callId=${callId}&isVideo=${isVideo ? '1' : '0'}&action=${action || 'answer'}`;
        return;
      }
      currentCallId = callId;
      isVideoCall = !!isVideo;
      showCallOverlay();
      setCallStatus(isVideoCall ? 'ビデオ着信中...' : '着信中...');
      
      if (action === 'accept' || action === 'decline') {
        // 実際のSDPはWS経由のcall_offerイベントで届く。まだ届いていなければ待機。
        if (window.__incomingOffer && window.__incomingOffer_callId === callId) {
          action === 'accept' ? acceptIncomingCall() : declineIncomingCall();
        } else {
          pendingBgCallAction = { callId, action };
        }
      } else {
        document.getElementById('callBtnRow').style.display = 'none';
        document.getElementById('incomingBtnRow').style.display = 'flex';
      }
    }
  });
}

function attachPress(msgDiv, wrap, bubble, own) {
  let timer; let lp = false;
  const start = ev => {
    lp = false;
    const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
    const cy = ev.touches ? ev.touches[0].clientY : ev.clientY;
    timer = setTimeout(() => { lp = true; showMenu(msgDiv, wrap, bubble, cx, cy, own); }, 400);
  };
  const cancel = () => clearTimeout(timer);
  bubble.addEventListener('contextmenu', ev => { ev.preventDefault(); showMenu(msgDiv, wrap, bubble, ev.clientX, ev.clientY, own); });
  bubble.addEventListener('mousedown', start);
  bubble.addEventListener('touchstart', start, { passive: true });
  bubble.addEventListener('mouseup', cancel);
  bubble.addEventListener('mouseleave', cancel);
  bubble.addEventListener('touchend', cancel);
}

function showMenu(msgDiv, wrap, bubble, x, y, own) {
  activeMsg = msgDiv; activeBubble = bubble; isOwn = own; reactTarget = wrap;
  if (window.LiquidGlass) window.LiquidGlass.haptic('selection');
  const hasText = bubble.querySelector('.msg-text');
  document.getElementById('editBtn').style.display = own && hasText ? 'flex' : 'none';
  document.getElementById('delBtn').style.display = own ? 'flex' : 'none';
  const ctx = document.getElementById('ctxMenu');
  ctx.style.left = `${Math.max(10, Math.min(x-95, innerWidth-210))}px`;
  ctx.style.top  = `${Math.max(10, Math.min(y-70, innerHeight-220))}px`;
  document.getElementById('menuOv').classList.add('show');
  ctx.classList.add('show');
}

function hideMenu() {
  document.getElementById('ctxMenu').classList.remove('show');
  document.getElementById('menuOv').classList.remove('show');
  rp.classList.remove('show');
}

document.getElementById('menuOv').onclick = hideMenu;

  // (長押しされたメッセージのDOM要素、dataset.msgIdにメッセージIDが入っている)

async function loadPinnedMessages() {
  if (!otherId) return;
  try {
    const pinned = await api('/api/messages/pinned/' + otherId);
    const banner = document.getElementById('pinBanner');
    const list = document.getElementById('pinnedList');

    if (!Array.isArray(pinned) || pinned.length === 0) {
      banner.style.display = 'none';
      return;
    }

    banner.style.display = 'flex';
    // 以前は txt.replace(/</g,'&lt;') のみで '&' '>' '"' はエスケープされておらず、
    // 不完全なエスケープだった。DOM構築+textContentに切り替えて構造的に解消する。
    list.textContent = '';
    pinned.forEach(p => {
      const { displayText } = parseMsgContent(p.content, p);

      const row = document.createElement('div');

      const dot = document.createElement('span');
      dot.style.color = '#999';
      dot.textContent = '●';

      const textSpan = document.createElement('span');
      textSpan.style.cssText = 'flex:1;font-size:13px;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;';
      textSpan.textContent = txt;

      const closeBtn = document.createElement('span');
      closeBtn.className = 'pin-close-btn';
      closeBtn.dataset.pinId = p.id;
      closeBtn.style.cssText = 'cursor:pointer;color:#999;font-size:16px;padding:0 4px;';
      closeBtn.textContent = 'x';

      row.appendChild(dot);
      row.appendChild(textSpan);
      row.appendChild(closeBtn);
      list.appendChild(row);
    });

    list.querySelectorAll('.pin-close-btn').forEach(btn => {
      btn.onclick = () => {
        const pinId = btn.dataset.pinId;
        api('/api/messages/pin', { method: 'POST', body: JSON.stringify({ messageId: pinId, pinned: false }) })
          .then(() => loadPinnedMessages())
          .catch(err => console.error('unpin error:', err));
      };
    });
  } catch (err) {
    console.error('loadPinnedMessages error:', err);
  }
}

function updatePinnedBanner() {
  loadPinnedMessages();
}

document.getElementById('delBtn').onclick = () => {

  }
