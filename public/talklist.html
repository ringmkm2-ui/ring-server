<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>トーク一覧</title>
<link rel="stylesheet" href="/css/globalTheme.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f1f5f9;min-height:100vh}
body.has-custom-bg{background:transparent}
.pc{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;background:#e0f2fe;background-size:cover;background-position:center;overflow:hidden;z-index:9999;display:flex;flex-direction:column}
body.has-custom-bg .pc{background:transparent}
.bgo{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:1}
.tp{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}
.ahdr{display:flex;justify-content:center;align-items:center;padding:20px 0 10px}
.sc{position:relative;display:inline-flex;background:rgba(255,255,255,.2);backdrop-filter:blur(25px) saturate(180%) url(#glassFrost);-webkit-backdrop-filter:blur(25px) saturate(180%);border:1.5px solid rgba(255,255,255,.6);padding:6px;border-radius:999px;box-shadow:0 8px 32px rgba(0,0,0,.08)}
.sslider{position:absolute;top:4px;left:4px;width:90px;height:calc(100% - 8px);background:rgba(255,255,255,.5);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,.7);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:transform .3s cubic-bezier(.25,1,.5,1);z-index:1}
.sbtn{position:relative;z-index:2;background:none;border:none;outline:none;width:90px;padding:8px 0;font-size:14px;font-weight:700;color:rgba(15,23,42,.4);cursor:pointer;text-align:center;transition:color .3s ease}
.sbtn.active{color:#0f172a}
.tc{flex:1;padding:0 16px 16px;overflow-y:auto}
.card{background:rgba(255,255,255,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.4);border-radius:24px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.03);margin-bottom:12px}
.search input{width:100%;padding:10px 14px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.5);border-radius:999px;box-sizing:border-box;outline:none;font-size:14px;margin-bottom:12px}
.ti{display:flex;align-items:center;text-decoration:none;padding:12px 0;border-bottom:1px solid rgba(15,23,42,.05);cursor:pointer;color:inherit}
.ti:last-child{border-bottom:none}
.tav{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.2);color:#0f172a;font-size:13px;font-weight:700;display:flex;justify-content:center;align-items:center;margin-right:12px;flex-shrink:0;background-size:cover;background-position:center;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 4px 10px rgba(0,0,0,.1)}
.group-default-av{position:relative}
.group-default-av::before{content:'💬';font-size:20px}
.tbody{flex:1;min-width:0}
.ttr{display:flex;justify-content:space-between;margin-bottom:4px}
.tname{font-weight:700;color:#0f172a;font-size:14px}
.ttime{font-size:11px;color:#64748b}
.tmsg{font-size:13px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slabel{font-size:12px;font-weight:700;color:#64748b;margin-bottom:10px;letter-spacing:.05em}
.ngbtn{display:flex;align-items:center;gap:10px;padding:12px 0;cursor:pointer;border:none;background:none;width:100%;border-bottom:1px solid rgba(15,23,42,.05)}
.ngicon{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;flex-shrink:0;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 8px 24px rgba(0,0,0,.08);color:#0f172a}
.nglabel{font-weight:700;color:#0f172a;font-size:14px}
.hha{display:flex;justify-content:space-between;align-items:center;width:100%}
.mypro{display:flex;align-items:center;gap:14px}
.myav{width:55px;height:55px;border-radius:50%;background:#cbd5e1;background-size:cover;background-position:center;box-shadow:0 4px 10px rgba(0,0,0,.1);flex-shrink:0}
.myn{font-size:18px;font-weight:800;color:#0f172a}
.sibtn{background:none;border:none;padding:0;cursor:pointer;outline:none;transition:transform .2s ease}
.sibtn:hover{transform:rotate(30deg)}
.siico{width:36px;height:36px;display:block;border-radius:9px;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.mov{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:10000;display:flex;justify-content:center;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .3s ease}
.mov.open{opacity:1;pointer-events:auto}
.mc{width:100%;max-width:500px;max-height:90vh;overflow-y:auto;background:rgba(255,255,255,.9);border-radius:32px 32px 0 0;padding:24px;box-sizing:border-box;box-shadow:0 -10px 40px rgba(0,0,0,.15);transform:translateY(100%);transition:transform .3s cubic-bezier(.25,1,.5,1)}
.mov.open .mc{transform:translateY(0)}
.mtitle{font-size:18px;font-weight:800;color:#0f172a;text-align:center;margin:0 0 20px 0}
.sg{margin-bottom:20px}
.sgrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sgrow-label{display:flex;flex-direction:column;gap:2px}
.sgrow-label .sgtitle{font-size:14px;font-weight:600;color:#0f172a}
.sgrow-label .sgdesc{font-size:12px;color:#94a3b8}
.toggle-switch{position:relative;display:inline-block;width:48px;height:28px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:rgba(148,163,184,.4);border-radius:999px;transition:background .25s ease}
.toggle-slider::before{position:absolute;content:"";height:22px;width:22px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:transform .25s ease;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.toggle-switch input:checked + .toggle-slider{background:#34c759}
.toggle-switch input:checked + .toggle-slider::before{transform:translateX(20px)}
.version-badge{position:fixed;left:8px;bottom:6px;font-size:10px;color:rgba(100,116,139,.6);z-index:10000;pointer-events:none;user-select:none;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
html.dark-mode .version-badge{color:rgba(148,163,184,.5)}
.sg label{display:block;font-size:12px;font-weight:700;color:#64748b;margin-bottom:8px}
.sg input[type=text]{width:100%;padding:12px 16px;background:#fff;border:1px solid rgba(15,23,42,.1);border-radius:14px;box-sizing:border-box;outline:none;font-size:15px;font-weight:600}
.fiw{position:relative;margin-bottom:10px}
.fiw input[type=file]{position:absolute;left:0;top:0;opacity:0;width:100%;height:100%;cursor:pointer}
.cfb{display:block;text-align:center;padding:12px;background:#fff;border:1px dashed #94a3b8;border-radius:14px;color:#475569;font-size:14px;font-weight:600}
.cropcon{position:relative;width:100%;height:220px;background:#0f172a;border-radius:16px;overflow:hidden;display:none;margin-top:10px;touch-action:none}
.cropim{position:absolute;top:0;left:0;cursor:move;user-select:none;transform-origin:top left}
.cropmk{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle 70px at center,transparent 99%,rgba(0,0,0,.6) 100%);pointer-events:none;border:1px solid rgba(255,255,255,.2);border-radius:16px;box-sizing:border-box}
.cropmk::before{content:'';position:absolute;top:calc(50% - 70px);left:calc(50% - 70px);width:140px;height:140px;border-radius:50%;border:1px solid rgba(255,255,255,.5);box-sizing:border-box;
  background-image:linear-gradient(rgba(255,255,255,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.3) 1px,transparent 1px);
  background-size:calc(140px/3) calc(140px/3);}
.ranger{width:100%;margin-top:10px;display:none}
.savebtn{width:100%;padding:14px;background:#0f172a;color:#fff;border:none;border-radius:16px;font-size:15px;font-weight:700;cursor:pointer;margin-top:15px}
.cancelbtn{width:100%;padding:14px;background:rgba(15,23,42,.06);color:#0f172a;border:none;border-radius:16px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}
.btn-glass{position:relative;padding:12px 24px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:12px;color:#fff;font-weight:600;cursor:pointer;transition:all 0.3s ease;box-shadow:0 8px 32px rgba(31,38,135,0.15)}
.btn-glass:hover{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.3);box-shadow:0 12px 40px rgba(31,38,135,0.25);transform:translateY(-2px)}
.btn-glass:active{transform:translateY(0);box-shadow:0 4px 16px rgba(31,38,135,0.15)}
.glass-plus-btn{
  position:absolute;right:20px;top:70px;width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.08);border:none;
  box-shadow:0 0 0 1px rgba(255,255,255,.5),0 6px 14px rgba(0,0,0,.1);
  backdrop-filter:url(#plusGlass);-webkit-backdrop-filter:blur(6px);
  color:transparent;font-size:0;cursor:pointer;display:grid;place-items:center;
  flex-shrink:0;padding:0;transition:transform .35s cubic-bezier(.25,1,.5,1),box-shadow .35s ease;outline:0;
}
.glass-plus-btn::before,.glass-plus-btn::after{content:"";position:absolute;background:#0f172a;border-radius:10px}
.glass-plus-btn::before{width:40%;height:2px}
.glass-plus-btn::after{width:2px;height:40%}
.glass-plus-btn:hover{
  box-shadow:0 0 0 1px rgba(255,255,255,.7),0 10px 20px rgba(0,0,0,.15);
  transform:scale(1.06);
}
.glass-plus-btn:active{transform:scale(0.94);box-shadow:0 0 0 1px rgba(255,255,255,.4),0 3px 8px rgba(0,0,0,.08);}
</style>
<script defer src="/js/globalBg.js"></script>
<script defer src="/js/globalSettings.js"></script>
</head>
<body>
<svg style="position:absolute;width:0;height:0">
  <defs>
    <filter id="glassFrost" primitiveUnits="objectBoundingBox" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise" seed="4"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.02"/>
    </filter>
    <filter id="plusGlass" primitiveUnits="objectBoundingBox" x="-60%" y="-60%" width="220%" height="220%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.06" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
<div class="pc" id="pc">
  <div class="bgo"></div>
  <div class="tp">
    <header class="ahdr">
      <div class="sc">
        <div class="sslider" id="slider"></div>
        <button class="sbtn active" id="btnTalk" type="button">トーク</button>
        <button class="sbtn" id="btnHome" type="button">ホーム</button>
      </div>
    </header>
    <main class="tc">
      <section id="pageTalk">
        <div class="card">
          <input type="text" placeholder="トークを検索..." id="talkSearchInput" style="flex:1;padding:10px 14px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.5);border-radius:999px;box-sizing:border-box;outline:none;font-size:14px;width:100%;margin-bottom:12px;">
          <button onclick="openAddFriend()" class="glass-plus-btn" aria-label="友達を追加"></button>
          <div id="talkList"><div style="text-align:center;color:#94a3b8;font-size:14px;padding:24px">読み込み中...</div></div>
        </div>
        <div class="card">
          <div class="slabel">グループ</div>
          <div>
            <button class="ngbtn" id="ngBtn" type="button">
              <div class="ngicon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
              <span class="nglabel">新しいグループを作成</span>
            </button>
            <div id="groupList"></div>
          </div>
        </div>
      </section>
      <section id="pageHome" style="display:none">
        <div class="card">
          <div class="hha">
            <div class="mypro">
              <div class="myav" id="dispAv"></div>
              <div>
                <div class="myn" id="dispName">マイネーム</div>
                <div id="myIdCode" style="font-size:12px;color:#64748b;margin-top:2px;">ID: 読み込み中...</div>
              </div>
            </div>
            <button class="sibtn" id="openSettings" type="button">
              <svg class="siico" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs><linearGradient id="g1" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#afafb3"/><stop offset="100%" stop-color="#8e8e93"/></linearGradient></defs>
                <rect width="100" height="100" rx="22" fill="url(#g1)"/>
                <circle cx="50" cy="50" r="28" fill="none" stroke="#fff" stroke-width="5"/>
                <g fill="#fff" transform="translate(50,50)">
                  <rect x="-4" y="-33" width="8" height="7" rx="1"/><rect x="-4" y="26" width="8" height="7" rx="1"/><rect x="-33" y="-4" width="7" height="8" rx="1"/><rect x="26" y="-4" width="7" height="8" rx="1"/>
                  <g transform="rotate(45)"><rect x="-4" y="-33" width="8" height="7" rx="1"/><rect x="-4" y="26" width="8" height="7" rx="1"/><rect x="-33" y="-4" width="7" height="8" rx="1"/><rect x="26" y="-4" width="7" height="8" rx="1"/></g>
                </g>
                <circle cx="50" cy="50" r="16" fill="url(#g1)"/>
                <circle cx="50" cy="50" r="5" fill="url(#g1)"/><circle cx="50" cy="50" r="2.5" fill="#fff"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- 友達リクエストセクション -->
        <div class="card" id="pendingRequestsCard" style="display:none;">
          <div class="slabel">友達リクエスト</div>
          <div id="pendingList"></div>
        </div>
    </main>
  </div>
  <div class="version-badge">Bro Chat v0.9 beta</div>
</div>

<!-- プロフィール設定モーダル -->
<div class="mov" id="settingsMov">
  <div class="mc">
    <h3 class="mtitle">プロフィールの編集</h3>
    <div class="sg"><label>表示名</label><input type="text" id="inName" value="マイネーム"></div>
    <div class="sg">
      <label>プロフィール画像</label>
      <div class="fiw"><span class="cfb">画像を選択する</span><input type="file" id="inAvFile" accept="image/*"></div>
      <div class="cropcon" id="cropBox"><img class="cropim" id="cropImg" src="" alt="" draggable="false"><div class="cropmk"></div></div>
      <input type="range" class="ranger" id="cropZoom" min="0.1" max="3" step="0.01" value="1">
    </div>
    <div class="sg">
      <label>全体の背景画像</label>
      <div class="fiw"><span class="cfb">背景画像を選択する</span><input type="file" id="inBgFile" accept="image/*"></div>
    </div>
    <div class="sg">
      <div class="sgrow">
        <div class="sgrow-label"><span class="sgtitle">ダークモード</span><span class="sgdesc">画面全体を暗いテーマに切り替えます</span></div>
        <label class="toggle-switch"><input type="checkbox" id="toggleDarkMode"><span class="toggle-slider"></span></label>
      </div>
      <div class="sgrow">
        <div class="sgrow-label"><span class="sgtitle">モバイルデータ節約</span><span class="sgdesc">モバイル回線利用中は画像の画質を下げて送信します</span></div>
        <label class="toggle-switch"><input type="checkbox" id="toggleDataSaver"><span class="toggle-slider"></span></label>
      </div>
      <div class="sgrow">
        <div class="sgrow-label"><span class="sgtitle">バッテリーセーバー時のアニメーション軽減</span><span class="sgdesc">オンにすると、装飾アニメーションを常に無効化します</span></div>
        <label class="toggle-switch"><input type="checkbox" id="toggleBatterySaver"><span class="toggle-slider"></span></label>
      </div>
    </div>
    <button class="savebtn btn-glass" id="saveSettings" type="button">変更を適用して閉じる</button>
    <button onclick="logout()" style="width:100%;padding:14px;background:#fee2e2;color:#ef4444;border:none;border-radius:16px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;">ログアウト</button>
  </div>
</div>

<!-- グループ作成モーダル -->
<div class="mov" id="ngMov">
  <div class="mc">
    <h3 class="mtitle">新しいグループ</h3>
    <div class="sg"><label>グループ名</label><input type="text" id="ngName" placeholder="グループ名を入力"></div>
    <div class="sg" style="max-height:200px;overflow-y:auto;border:1px solid #ddd;border-radius:6px;padding:8px;">
      <label>メンバー選択</label>
      <div id="ngMemberList" style="margin-top:8px;font-size:12px;color:#999;">読み込み中...</div>
    </div>
    <button class="savebtn btn-glass" id="ngCreate" type="button">作成する</button>
    <button class="cancelbtn btn-glass" id="ngCancel" type="button">キャンセル</button>
  </div>
</div>

<script>
// タブ切り替え
const slider=document.getElementById('slider');
const pageTalk=document.getElementById('pageTalk');
const pageHome=document.getElementById('pageHome');
const pc=document.getElementById('pc');

const token = localStorage.getItem('ring_token');
const myUserId = localStorage.getItem('ring_userId');
if (!token) location.href = '/auth.html';

document.getElementById('btnTalk').onclick=()=>{
  document.getElementById('btnTalk').classList.add('active');
  document.getElementById('btnHome').classList.remove('active');
  slider.style.transform='translateX(0)';
  pageTalk.style.display='block';pageHome.style.display='none';
  loadTalks();
};

document.getElementById('btnHome').onclick=()=>{
  document.getElementById('btnHome').classList.add('active');
  document.getElementById('btnTalk').classList.remove('active');
  slider.style.transform='translateX(90px)';
  pageTalk.style.display='none';pageHome.style.display='block';
  loadPendingRequests();
};

async function api(path, opts={}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', ...(opts.headers||{}) }
  });
  return res.json();
}

// プロフィール読み込み（サーバーから）
async function loadProfile(){
  try {
    const data = await api('/api/friends/me');
    const name = data.displayName || data.username || 'マイネーム';
    const idCode = data.userIdCode || '';
    localStorage.setItem('myName', name);
    localStorage.setItem('myUserId', data.userId);
    localStorage.setItem('ring_userId', data.userId);
    localStorage.setItem('ring_userIdCode', idCode);
    document.getElementById('dispName').textContent = name;
    document.getElementById('inName').value = name;
    document.getElementById('myIdCode').textContent = 'ID: ' + idCode;
    const av=localStorage.getItem('myAvatar')||data.profilePic||'';
    const dav=document.getElementById('dispAv');
    if(av){dav.style.backgroundImage=`url(${av})`;dav.style.background='';}
    else{dav.style.backgroundImage='';dav.style.background='#cbd5e1';}
  } catch(e) {
    const name=localStorage.getItem('myName')||'マイネーム';
    const idCode=localStorage.getItem('ring_userIdCode')||'';
    document.getElementById('dispName').textContent=name;
    document.getElementById('inName').value=name;
    document.getElementById('myIdCode').textContent = idCode ? 'ID: ' + idCode : 'ID: 取得中...';
    const av=localStorage.getItem('myAvatar')||'';
    const dav=document.getElementById('dispAv');
    if(av){dav.style.backgroundImage=`url(${av})`;dav.style.background='';}
    else{dav.style.backgroundImage='';dav.style.background='#cbd5e1';}
  }
}
loadProfile();

// トークリスト読み込み
async function loadTalks() {
  try {
    const talks = await api('/api/messages/talks');
    const friends = await api('/api/friends/list');
    const groupsData = await api('/api/groups/list');
    const list = document.getElementById('talkList');
    
    // トークリストのユーザーIDセット
    const talkUserIds = new Set(Array.isArray(talks) ? talks.map(t => t.userId) : []);
    
    // 合併リスト：トーク + 友達（重複削除）
    const merged = [];
    
    if (Array.isArray(talks) && talks.length > 0) {
      merged.push(...talks.map(t => ({ ...t, kind: 'dm' })));
    }
    
    if (Array.isArray(friends)) {
      friends.forEach(f => {
        if (!talkUserIds.has(f.userId)) {
          merged.push({
            kind: 'dm',
            userId: f.userId,
            displayName: f.displayName,
            profilePic: f.profilePic,
            userIdCode: f.userIdCode,
            lastMessage: 'まだメッセージがありません',
            lastTime: null
          });
        }
      });
    }

    // グループをリストに統合
    if (groupsData && Array.isArray(groupsData.groups)) {
      groupsData.groups.forEach(g => {
        merged.push({
          kind: 'group',
          groupId: g.groupId,
          displayName: g.name,
          lastMessage: g.lastMessage ? (g.lastMessage.encrypted ? '(暗号化されたメッセージ)' : g.lastMessage.content) : 'まだメッセージがありません',
          lastTime: g.lastMessage ? g.lastMessage.createdAt : null,
          memberCount: g.members.length,
        });
      });
    }

    // 最終メッセージ時刻で降順ソート（メッセージが無いものは末尾）
    merged.sort((a, b) => {
      if (!a.lastTime && !b.lastTime) return 0;
      if (!a.lastTime) return 1;
      if (!b.lastTime) return -1;
      return new Date(b.lastTime) - new Date(a.lastTime);
    });
    
    if (merged.length === 0) {
      list.innerHTML = '<div style="text-align:center;color:#94a3b8;font-size:14px;padding:24px">トークリストが空です<br>友達を追加してメッセージしよう！</div>';
      return;
    }
    
    list.innerHTML = merged.map(t => {
      if (t.kind === 'group') {
        const time = t.lastTime ? formatTime(t.lastTime) : '';
        return `<div class="ti" onclick="openGroupChat('${t.groupId}','${escHtml(t.displayName)}')">
          <div class="tav group-default-av"></div>
          <div class="tbody">
            <div class="ttr"><div class="tname">${escHtml(t.displayName)}</div><div class="ttime">${time}</div></div>
            <div class="tmsg">${escHtml(t.lastMessage||'')} ・ ${t.memberCount}人</div>
          </div>
        </div>`;
      }
      const initial = (t.displayName||'?')[0];
      const pic = t.profilePic ? `background-image:url(${t.profilePic})` : '';
      const time = t.lastTime ? formatTime(t.lastTime) : '';
      return `<div class="ti" onclick="openChat('${t.userId}','${escHtml(t.displayName)}')">
        <div class="tav" style="${pic}">${pic?'':initial}</div>
        <div class="tbody">
          <div class="ttr"><div class="tname">${escHtml(t.displayName)}</div><div class="ttime">${time}</div></div>
          <div class="tmsg">${escHtml(t.lastMessage||'')}</div>
        </div>
        ${t.unreadCount>0?`<div style="background:rgba(255,255,255,.3);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);color:#0f172a;border:1px solid rgba(255,255,255,.5);border-radius:50%;width:20px;height:20px;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700">${t.unreadCount}</div>`:''}
      </div>`;
    }).join('');
  } catch(e) { console.error('loadTalks:', e); }
}

function formatTime(ts) {
  const d = new Date(ts);
  const today = new Date();
  if (d.toDateString() === today.toDateString()) {
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }
  return (d.getMonth()+1) + '/' + d.getDate();
}

function escHtml(str) {
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function closeAddFriend() {

  if (!mov) return;
  const sheet = mov.querySelector('div:last-child') || mov.children[0];

  mov.style.background = 'rgba(15,23,42,0)';
  if (sheet) sheet.style.transform = 'translateY(100%)';

  setTimeout(() => mov.remove(), 380);

async function sendFriendRequest(targetId, btn) {
  btn.disabled = true;
  btn.textContent = '送信中...';
  try {
    const data = await api('/api/friends/request', { method:'POST', body: JSON.stringify({ targetUserIdCode: targetId }) });
    if (data.ok) {
      btn.textContent = '送信済み ✓';
      btn.style.background = '#10b981';
    } else {
      btn.textContent = data.error || 'エラー';
      btn.disabled = false;
    }
  } catch(e) {

    btn.disabled = false;
  }

// クロップ
let cx=0,cy=0,cs=1,cd=false,csx=0,csy=0;
const cropBox=document.getElementById('cropBox');
const cropImg=document.getElementById('cropImg');
const cropZoom=document.getElementById('cropZoom');
let croppedUrl=localStorage.getItem('myAvatar')||'';
let bgUrl=localStorage.getItem('myBgImage')||'';

document.getElementById('inAvFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    cropImg.src=ev.target.result;
    cropBox.style.display='block';cropZoom.style.display='block';
    cropImg.onload=()=>{cx=(cropBox.offsetWidth-cropImg.offsetWidth)/2;cy=(cropBox.offsetHeight-cropImg.offsetHeight)/2;cs=1;cropZoom.value=1;updC();};
  };r.readAsDataURL(f);
};
function updC(){cropImg.style.transform=`translate(${cx}px,${cy}px) scale(${cs})`;}
let pinchStartDist=0,pinchStartScale=1;
function touchDist(touches){const dx=touches[0].clientX-touches[1].clientX,dy=touches[0].clientY-touches[1].clientY;return Math.hypot(dx,dy);}
cropBox.addEventListener('mousedown',e=>{cd=true;csx=e.clientX-cx;csy=e.clientY-cy;});
cropBox.addEventListener('touchstart',e=>{
  if(e.touches.length===1){cd=true;csx=e.touches[0].clientX-cx;csy=e.touches[0].clientY-cy;}
  else if(e.touches.length===2){cd=false;pinchStartDist=touchDist(e.touches);pinchStartScale=cs;}
},{passive:true});
window.addEventListener('mousemove',e=>{if(!cd)return;cx=e.clientX-csx;cy=e.clientY-csy;updC();});
window.addEventListener('touchmove',e=>{
  if(cropBox.style.display!=='block')return;
  if(e.touches.length===2){
    e.preventDefault();
    const scale=pinchStartScale*(touchDist(e.touches)/pinchStartDist);
    cs=Math.min(3,Math.max(0.5,scale));
    cropZoom.value=cs;
    updC();
    return;
  }
  if(!cd||e.touches.length!==1)return;
  e.preventDefault();
  cx=e.touches[0].clientX-csx;cy=e.touches[0].clientY-csy;updC();
},{passive:false});
window.addEventListener('mouseup',()=>cd=false);window.addEventListener('touchend',()=>cd=false);
cropZoom.oninput=e=>{cs=parseFloat(e.target.value);updC();};

document.getElementById('inBgFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=ev=>{bgUrl=ev.target.result;};r.readAsDataURL(f);
};

document.getElementById('saveSettings').onclick=async ()=>{
  const name=document.getElementById('inName').value.trim();
  let newAvatarUrl=null;

  if(cropImg.src&&cropImg.complete&&cropImg.src!==location.href){
    const canvas=document.createElement('canvas');canvas.width=140;canvas.height=140;
    const ctx=canvas.getContext('2d');
    const bx=cropBox.offsetWidth/2,by=cropBox.offsetHeight/2;
    const sx=(bx-cx)/cs,sy=(by-cy)/cs;
    const cw=140/cs,ch=140/cs;
    ctx.drawImage(cropImg,sx-cw/2,sy-ch/2,cw,ch,0,0,140,140);
    croppedUrl=canvas.toDataURL();
    newAvatarUrl=croppedUrl;
    localStorage.setItem('myAvatar',croppedUrl);
    const dav=document.getElementById('dispAv');
    dav.style.backgroundImage=`url(${croppedUrl})`;
  }

  if(name){
    localStorage.setItem('myName',name);
    document.getElementById('dispName').textContent=name;
  }

  // 名前・画像のどちらか一方でも変更があればサーバーへ反映する
  if(name||newAvatarUrl!==null){
    const body={ displayName: name||localStorage.getItem('myName')||'' };
    if(newAvatarUrl!==null) body.profilePic=newAvatarUrl;
    try{
      await api('/api/friends/me', { method:'POST', body: JSON.stringify(body) });
    }catch(e){console.error('プロフィール保存エラー:',e);}
  }

  if(bgUrl){
    localStorage.setItem('myBgImage',bgUrl);
    document.documentElement.style.backgroundImage=`url(${bgUrl})`;
    document.documentElement.style.backgroundSize='cover';
    document.documentElement.style.backgroundPosition='center';
    document.documentElement.style.backgroundAttachment='fixed';
    document.body.classList.add('has-custom-bg');
  }
  settingsMov.classList.remove('open');
};

  // トークリスト（友達含む）から人を取得
  try {
    const talks = await api('/api/messages/talks');
    const friends = await api('/api/friends/list');
    
    // マージ
    const talkUserIds = new Set(Array.isArray(talks) ? talks.map(t => t.userId) : []);
    const allPeople = [];
    
    if (Array.isArray(talks)) {
      talks.forEach(t => {
        allPeople.push(t);
        memberNameMap.set(t.userId, t.displayName);
      });
    }
    if (Array.isArray(friends)) {
      friends.forEach(f => {
        if (!talkUserIds.has(f.userId)) {
          allPeople.push(f);
          memberNameMap.set(f.userId, f.displayName);
        }
      });
    }
    
    const memberList = document.getElementById('ngMemberList');
    if (allPeople.length > 0) {
      memberList.innerHTML = allPeople.map(p => `
        <label style="display:flex;align-items:center;margin:8px 0;cursor:pointer;">
          <input type="checkbox" value="${p.userId}" onchange="event.currentTarget.checked ? selectedGroupMembers.add('${p.userId}') : selectedGroupMembers.delete('${p.userId}')" style="margin-right:8px;">
          ${p.displayName}
        </label>
      `).join('');
    } else {
      memberList.innerHTML = '<div style="color:#999;font-size:12px;">トークリストが空です</div>';
    }
  } catch (err) {
    console.error('load people error:', err);
  }
  
  ngMov.classList.add('open');
};

async function acceptFriendRequest(friendshipId, btn) {
  btn.disabled = true;
  btn.textContent = '承認中...';
  try {
    const data = await api('/api/friends/accept', { method: 'POST', body: JSON.stringify({ friendshipId }) });
    if (data.ok) {
      btn.textContent = '承認済み ✓';
      btn.style.background = '#6b7280';
      loadPendingRequests();
      loadTalks();
    } else {
      btn.textContent = 'エラー';
      btn.disabled = false;
    }
  } catch (e) {
    btn.textContent = 'エラー';
    btn.disabled = false;
  }
}

// ブラウザ通知の許可リクエスト
// 個人チャット画面(admin.html)だけでリクエストしていたため、
// トーク一覧を経由せず直接他ページを開いた場合など、リクエストの
// タイミングが不安定になっていた。アプリの入口であるここで一度、
// 確実にリクエストする。
// 注意: ブラウザによっては「ユーザー操作なしの自動リクエスト」を
// 無視して許可ダイアログを出さない仕様がある。その場合は
// requestNotificationPermission()をクリック等のユーザー操作からも
// 呼べるようにしておく。
function requestNotificationPermission(){
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}
requestNotificationPermission();
// 最初のユーザー操作(クリック/タップ)でも一度だけ試す
// (自動リクエストが無視されるブラウザ向けのフォールバック)
document.addEventListener('click', requestNotificationPermission, { once: true });

function sendNotification(title, options = {}) {
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification(title, {
      icon: '/favicon.ico',
      ...options
    });
  }
}

  const homeVisible = document.getElementById('pageHome').style.display !== 'none';
  if (talkVisible) loadTalks();
  if (homeVisible) loadPendingRequests();
}, 4000);

  localStorage.clear();
  window.location.href = '/auth.html';
}
