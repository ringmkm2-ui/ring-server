<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title data-i18n="talk_list">トーク一覧</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1e293b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bro Chat">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f1f5f9;min-height:100vh}
body.has-custom-bg{background:transparent}
.pc{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;background:#e0f2fe;background-size:cover;background-position:center;overflow:hidden;z-index:9999;display:flex;flex-direction:column}
body.has-custom-bg .pc{background:transparent}
.bgo{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:1}
.tp{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}
.ahdr{display:flex;justify-content:center;align-items:center;padding:20px 0 10px}
/* .sc(セグメントコントロールの外枠)と.sslider(選択中インジケータ)は
   素材(背景/ぼかし/縁)をliquidGlass.cssの.glass-clearに統一し、
   ここでは形状・レイアウトのみ定義する。
   3タブ(トーク/ホーム/投稿)構成のため、各ボタン幅を80pxに調整。 */
/* ===== Codepen "ios26-nav" デザインをそのまま移植 (アイコンは不使用、テキストのみ) ===== */
:root{
  --panel-soft:#dce2eaab;
  --line-soft:rgba(123,138,161,.28);
  --shadow-light:rgba(255,255,255,.78);
  --shadow-dark:rgba(148,160,181,.36);
  --accent:#3b82f6;
  --nav-glow-rgb:205,228,255;
}
html.dark-mode{
  --panel-soft:#1b191f80;
  --line-soft:rgba(165,177,205,.2);
  --shadow-light:rgba(255,255,255,.04);
  --shadow-dark:rgba(0,0,0,.52);
  --accent:#4f8cff;
  --nav-glow-rgb:168,201,255;
}
.sc{
  position:relative;
  display:inline-grid;
  grid-auto-flow:column;
  grid-auto-columns:1fr;
  align-items:center;
  gap:6px;
  padding:8px 10px;
  border-radius:999px;
  background:var(--panel-soft);
  box-shadow:
    14px 14px 36px var(--shadow-dark),
    -14px -14px 36px var(--shadow-light);
  --gx:50%;--gy:50%;--ga:0;
  overflow:visible;
}
.nav-glow{
  position:absolute;inset:0;border-radius:999px;
  clip-path:inset(0 round 999px);
  pointer-events:none;z-index:0;
  background:radial-gradient(240px 150px at var(--gx) var(--gy), rgba(var(--nav-glow-rgb),var(--ga)) 0%, rgba(var(--nav-glow-rgb),0) 74%);
  transition:background .18s ease;
}
.sslider{
  position:absolute;left:10px;top:8px;height:calc(100% - 16px);width:80px;
  border-radius:999px;z-index:6;pointer-events:none;
  transform-origin:center center;will-change:left,width,transform;
  background:rgba(255,255,255,.22);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.46),
    10px 10px 24px var(--shadow-dark),
    -8px -8px 20px var(--shadow-light);
  transition:
    left .24s cubic-bezier(.2,.9,.22,1),
    width .24s cubic-bezier(.2,.9,.22,1),
    transform .25s ease,
    background-color .25s ease,
    box-shadow .25s ease;
}
.sslider.interacting{z-index:999;transform:scale(1.5);background:rgba(255,255,255,.16);}
.sbtn{
  position:relative;z-index:2;border:none;outline:none;cursor:pointer;
  height:44px;border-radius:999px;color:var(--muted,#3d434e);
  background:transparent;
  display:inline-flex;align-items:center;justify-content:center;
  font-weight:600;font-size:14px;letter-spacing:.01em;
  padding:0 18px;white-space:nowrap;
  transition:color .2s ease;
}
.sbtn:hover{color:var(--accent);}
.sbtn.active{color:var(--accent);}
.tc{flex:1;padding:0 16px 16px;overflow-y:auto}
.card{background:rgba(255,255,255,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.4);border-radius:24px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.03);margin-bottom:12px}
/* 投稿タイムライン */
.post-card{background:rgba(255,255,255,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.4);border-radius:24px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.03);margin-bottom:12px}
.post-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.post-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;background-size:cover;background-position:center}
.post-author{font-weight:700;font-size:14px;color:#0f172a}
.post-time{font-size:12px;color:#94a3b8}
.post-text{font-size:14px;color:#0f172a;white-space:pre-wrap;word-break:break-word;line-height:1.5}
.post-media{width:100%;max-height:340px;object-fit:cover;border-radius:16px;margin-top:10px;display:block}
.post-actions{display:flex;align-items:center;gap:18px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(15,23,42,.06)}
.post-action-btn{display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;font-size:13px;font-weight:700;color:#64748b;padding:4px}
.post-action-btn.liked{color:#ef4444}
.post-del-btn{margin-left:auto;background:none;border:none;cursor:pointer;color:#94a3b8;padding:4px}
.post-comments{margin-top:10px;padding-top:10px;border-top:1px solid rgba(15,23,42,.06)}
.post-comment-row{display:flex;gap:8px;margin-bottom:8px;font-size:13px}
.post-comment-author{font-weight:700;color:#0f172a}
.post-comment-text{color:#334155;word-break:break-word}
.post-comment-form{display:flex;gap:8px;margin-top:8px}
.post-comment-input{flex:1;padding:8px 12px;background:rgba(255,255,255,.7);border:1px solid rgba(15,23,42,.08);border-radius:999px;font-size:13px;outline:none}
.post-comment-send{background:none;border:none;color:#3b82f6;font-weight:700;font-size:13px;cursor:pointer;padding:4px 8px}
.search input{width:100%;padding:10px 14px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.5);border-radius:999px;box-sizing:border-box;outline:none;font-size:14px;margin-bottom:12px}
.ti{display:flex;align-items:center;text-decoration:none;padding:12px 0;border-bottom:1px solid rgba(15,23,42,.05);cursor:pointer;color:inherit}
.ti:last-child{border-bottom:none}
/* tav: トークリストのアバター。親の.cardが既にbackdrop-filter:blur(20px)を
   持つため、入れ子backdrop-filterを避ける。 */
.tav{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.55);color:#0f172a;font-size:13px;font-weight:700;display:flex;justify-content:center;align-items:center;margin-right:12px;flex-shrink:0;background-size:cover;background-position:center;box-shadow:0 4px 10px rgba(0,0,0,.1)}
.group-default-av{position:relative}
.tbody{flex:1;min-width:0}
.ttr{display:flex;justify-content:space-between;margin-bottom:4px}
.tname{font-weight:700;color:#0f172a;font-size:14px}
.ttime{font-size:11px;color:#64748b}
.tmsg{font-size:13px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slabel{font-size:12px;font-weight:700;color:#64748b;margin-bottom:10px;letter-spacing:.05em}
.ngbtn{display:flex;align-items:center;gap:10px;padding:12px 0;cursor:pointer;border:none;background:none;width:100%;border-bottom:1px solid rgba(15,23,42,.05)}
/* ngicon: 「新しいグループを作成」行のプラスアイコン背景。
   素材はliquidGlass.cssの.glass-clearに統一し、形状のみ定義する。 */
.ngicon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#0f172a}
.nglabel{font-weight:700;color:#0f172a;font-size:14px}
.hha{display:flex;justify-content:space-between;align-items:center;width:100%}
.mypro{display:flex;align-items:center;gap:14px}
.myav{width:55px;height:55px;border-radius:50%;background:#cbd5e1;background-size:cover;background-position:center;box-shadow:0 4px 10px rgba(0,0,0,.1);flex-shrink:0}
.myn{font-size:18px;font-weight:800;color:#0f172a}
.sibtn{background:none;border:none;padding:0;cursor:pointer;outline:none;transition:transform .2s ease}
.sibtn:hover{transform:rotate(30deg)}
.siico{width:36px;height:36px;display:block;border-radius:9px;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.mov{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:10000;display:flex;justify-content:center;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .3s ease}
.mov.open{opacity:1;pointer-events:auto}
.mc{width:100%;max-width:500px;max-height:90vh;overflow-y:auto;background:rgba(255,255,255,.9);border-radius:32px 32px 0 0;padding:24px;box-sizing:border-box;box-shadow:0 -10px 40px rgba(0,0,0,.15);transform:translateY(100%);transition:transform .3s cubic-bezier(.25,1,.5,1)}
.mov.open .mc{transform:translateY(0)}
.mtitle{font-size:18px;font-weight:800;color:#0f172a;text-align:center;margin:0 0 20px 0}
.sg{margin-bottom:20px}
.sgrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sgrow-label{display:flex;flex-direction:column;gap:2px}
.sgrow-label .sgtitle{font-size:14px;font-weight:600;color:#0f172a}
.sgrow-label .sgdesc{font-size:12px;color:#94a3b8}
/* Tactile Switch — 物理スプリング+SVGフィルターによるガラストグル */
.toggle-switch{position:relative;display:inline-block;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0;position:absolute}
/* Tactile Switch トラック */
.ts-track{
  display:inline-block;position:relative;
  width:80px;height:34px;
  background-color:rgba(200,210,215,0.35);
  border-radius:100px;cursor:pointer;
  box-shadow:inset 0 2px 8px rgba(0,0,0,0.18),0 1px 0 rgba(255,255,255,0.6);
  border:1px solid rgba(255,255,255,0.4);
  transition:background-color 0.3s ease;
  overflow:visible;
}
/* サム（ノブ） */
.ts-thumb{
  position:absolute;
  width:72px;height:46px;
  border-radius:23px;
  top:17px;
  transform:translateY(-50%) scale(0.65);
  transform-origin:center center;
  cursor:pointer;touch-action:none;user-select:none;
  background-color:rgba(255,255,255,1);
  box-shadow:0 10px 30px rgba(0,0,0,0.35);
  overflow:hidden;
  will-change:transform,left,background-color,box-shadow;
  z-index:10;
}
.ts-thumb-clone{
  position:absolute;top:0;left:0;width:100%;height:100%;
  overflow:hidden;border-radius:inherit;z-index:1;opacity:0;
  will-change:opacity;
}
.ts-thumb-clone-inner{
  position:absolute;top:0;left:0;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,#e8f5e9 0%,#c8e6c9 100%);
}
.ts-thumb-clone-inner::before{
  content:"";position:absolute;
  left:var(--track-left,0);top:var(--track-top,0);
  width:80px;height:34px;border-radius:100px;
  background-color:var(--ts-track-color,rgba(200,210,215,0.35));
}
.ts-thumb-inner{
  position:absolute;top:0;left:0;width:100%;height:100%;
  border-radius:inherit;z-index:3;pointer-events:none;
}
.use-backdrop-filter .ts-thumb-inner{
  backdrop-filter:url(#tsGlassFilter);
  -webkit-backdrop-filter:url(#tsGlassFilter);
}
.use-backdrop-filter .ts-thumb-clone{display:none;}
.version-badge{position:fixed;left:8px;bottom:6px;font-size:10px;color:rgba(100,116,139,.6);z-index:10000;pointer-events:none;user-select:none;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
html.dark-mode .version-badge{color:rgba(148,163,184,.5)}
.sg label{display:block;font-size:12px;font-weight:700;color:#64748b;margin-bottom:8px}
.sg input[type=text]{width:100%;padding:12px 16px;background:#fff;border:1px solid rgba(15,23,42,.1);border-radius:14px;box-sizing:border-box;outline:none;font-size:15px;font-weight:600}
.fiw{position:relative;margin-bottom:10px}
.fiw input[type=file]{position:absolute;left:0;top:0;opacity:0;width:100%;height:100%;cursor:pointer}
.cfb{display:block;text-align:center;padding:12px;background:#fff;border:1px dashed #94a3b8;border-radius:14px;color:#475569;font-size:14px;font-weight:600}
.cropcon{position:relative;width:100%;height:220px;background:#0f172a;border-radius:16px;overflow:hidden;display:none;margin-top:10px;touch-action:none}
.cropim{position:absolute;top:0;left:0;cursor:move;user-select:none;transform-origin:top left}
.cropmk{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle 70px at center,transparent 99%,rgba(0,0,0,.6) 100%);pointer-events:none;border:1px solid rgba(255,255,255,.2);border-radius:16px;box-sizing:border-box}
.cropmk::before{content:'';position:absolute;top:calc(50% - 70px);left:calc(50% - 70px);width:140px;height:140px;border-radius:50%;border:1px solid rgba(255,255,255,.5);box-sizing:border-box;
  background-image:linear-gradient(rgba(255,255,255,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.3) 1px,transparent 1px);
  background-size:calc(140px/3) calc(140px/3);}
.ranger{width:100%;margin-top:10px;display:none}
.crop-controls{margin-top:10px}
.crop-zoom-row{display:flex;align-items:center;gap:8px}
.crop-zoom-row .ranger{display:block;margin-top:0;flex:1;width:auto}
.crop-zoom-label{font-size:12px;font-weight:700;color:#64748b;min-width:38px;text-align:right}
.crop-reset-btn{width:100%;margin-top:10px;padding:9px;border-radius:12px;font-size:13px;font-weight:700;color:#0f172a;cursor:pointer;border:none}
/* savebtn/cancelbtn/btn-glass: 主要アクションボタンも含めてClear Glassに統一。
   素材(背景/ぼかし/縁)はliquidGlass.cssの.glass-clearに任せ、ここでは
   レイアウト・文字色のみ定義する。主要アクション(保存/作成)は文字を太字化して
   視認性を保つ。 */
.savebtn{width:100%;padding:14px;color:#0f172a;border:none;border-radius:16px;font-size:15px;font-weight:700;cursor:pointer;margin-top:15px}
.cancelbtn{width:100%;padding:14px;color:#0f172a;border:none;border-radius:16px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}
/* btn-glass: liquidGlass.cssに集約 */
/* glass-plus-btn: 友達追加ボタン。素材はliquidGlass.cssの.glass-clearに統一し、
   ここでは形状と「+」アイコン(::before/::after の十字線)のみ定義する。 */
.glass-plus-btn{
  position:absolute;right:20px;top:70px;width:40px;height:40px;border-radius:50%;
  border:none;color:transparent;font-size:0;cursor:pointer;display:grid;place-items:center;
  flex-shrink:0;padding:0;outline:0;
}
.glass-plus-btn::before,.glass-plus-btn::after{content:"";position:absolute;background:#0f172a;border-radius:10px}
.glass-plus-btn::before{width:40%;height:2px}
.glass-plus-btn::after{width:2px;height:40%}
</style>
<script src="/js/nacl.min.js"></script>
<script src="/js/nacl-util.min.js"></script>
<script src="/js/libsodium-wrappers.min.js"></script>
<script src="/js/signalkeymanager.js"></script>
<script src="/js/groupE2E.js"></script>
<script src="/js/e2eKeys.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/linkify.js"></script>
<script defer src="/js/globalBg.js"></script>
<script defer src="/js/globalSettings.js"></script>
<script defer src="/js/liquidGlass.js"></script>
<script defer src="/js/pushSubscribe.js"></script>
<script defer src="/js/cacheManager.js"></script>
<script defer src="/js/cloudinaryE2EUpload.js"></script>
</head>
<body>
<svg style="position:absolute;width:0;height:0">
  <defs>
    <filter id="glassFrost" primitiveUnits="objectBoundingBox" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise" seed="4"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.02"/>
    </filter>
    <filter id="plusGlass" primitiveUnits="objectBoundingBox" x="-60%" y="-60%" width="220%" height="220%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.06" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
<div class="pc" id="pc">
  <div class="bgo"></div>
  <div class="tp">
    <header class="ahdr">
      <div class="sc lg-segment" id="tabSegment">
        <div class="nav-glow" id="navGlow"></div>
        <div class="sslider lg-segment-slider" id="slider"></div>
        <button class="sbtn lg-segment-btn active" id="btnTalk" type="button" data-i18n="talk">トーク</button>
        <button class="sbtn lg-segment-btn" id="btnHome" type="button" data-i18n="home">ホーム</button>
        <button class="sbtn lg-segment-btn" id="btnPosts" type="button" data-i18n="post">投稿</button>
      </div>
    </header>
    <main class="tc">
      <section id="pageTalk" class="lg-page-enter">
        <div class="card">
          <input type="text" placeholder="トークを検索..." id="talkSearchInput" data-i18n-placeholder="search_talk_placeholder" style="flex:1;padding:10px 14px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.5);border-radius:999px;box-sizing:border-box;outline:none;font-size:14px;width:100%;margin-bottom:12px;">
          <button onclick="openAddFriend()" class="glass-plus-btn glass-clear glass-interactive" aria-label="友達を追加"></button>
          <div id="talkList"><div style="text-align:center;color:#94a3b8;font-size:14px;padding:24px">読み込み中...</div></div>
        </div>
        <div class="card">
          <div class="slabel" data-i18n="group">グループ</div>
          <div>
            <button class="ngbtn" id="ngBtn" type="button">
              <div class="ngicon glass-clear"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
              <span class="nglabel" data-i18n="create_new_group">新しいグループを作成</span>
            </button>
            <div id="groupList"></div>
          </div>
        </div>
        <div class="card">
          <div class="slabel" data-i18n="community">コミュニティ</div>
          <div>
            <button class="ngbtn" id="communityCreateBtn" type="button">
              <div class="ngicon glass-clear"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
              <span class="nglabel" data-i18n="create_new_community">コミュニティを作成</span>
            </button>
            <div id="communityList"></div>
          </div>
        </div>
      </section>
      <section id="pageHome" style="display:none">
        <div class="card">
          <div class="hha">
            <div class="mypro">
              <div class="myav" id="dispAv"></div>
              <div>
                <div class="myn" id="dispName">マイネーム</div>
                <div id="myIdCode" style="font-size:12px;color:#64748b;margin-top:2px;">ID: 読み込み中...</div>
              </div>
            </div>
            <button class="sibtn glass-interactive" id="openSettings" type="button">
              <svg class="siico" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="sg-bg" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#c8c8cc"/>
                    <stop offset="100%" stop-color="#8e8e93"/>
                  </linearGradient>
                  <linearGradient id="sg-gear" x1="0%" y1="0%" x2="30%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
                    <stop offset="100%" stop-color="#d0d0d5" stop-opacity="0.85"/>
                  </linearGradient>
                  <linearGradient id="sg-shine" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#fff" stop-opacity="0.55"/>
                    <stop offset="60%" stop-color="#fff" stop-opacity="0"/>
                  </linearGradient>
                </defs>
                <!-- 背景 -->

<script>
// タブ切り替え
const slider=document.getElementById('slider');
const pageTalk=document.getElementById('pageTalk');
const pageHome=document.getElementById('pageHome');
const pagePosts=document.getElementById('pagePosts');
const pc=document.getElementById('pc');

const token = localStorage.getItem('ring_token');
const myUserId = localStorage.getItem('ring_userId');
window.myUserId = myUserId; // e2eKeys.js から参照できるようにグローバル化
if (!token) location.href = '/auth.html';

// ============================================================================
// Codepen "Liquid Glass Demo" (demo.js) を忠実に移植。
// SVG feDisplacementMap による本物の光学屈折 + specular ハイライトを
// tab-indicator(slider)に適用し、ドラッグでタブ間を移動できるようにする。
// ============================================================================
const LG_SWITCHER_CONFIG = {
  glassThickness: 30, bezelWidth: 40, ior: 1.4, scaleRatio: 1.0,
  blur: 0, specularOpacity: 0.5, specularSat: 0,
  tintColor: '255,255,255', tintOpacity: 0,
  innerShadow: 'rgba(255,255,255,0)', innerShadowBlur: 0, innerShadowSpread: 0,
  balancedSpecular: true
};

function lgClamp(n,min,max){ return Math.min(max,Math.max(min,n)); }

function lgSurfaceFn(x){ return Math.pow(1-Math.pow(1-x,4),0.25); }

function lgCalcRefractionProfile(glassThickness,bezelWidth,ior,samples){
  samples=samples||128;
  const eta=1/ior;
  function refract(nx,ny){
    const dot=ny;
    const k=1-eta*eta*(1-dot*dot);
    if(k<0) return null;
    const sq=Math.sqrt(k);
    return [-(eta*dot+sq)*nx, eta-(eta*dot+sq)*ny];
  }
  const p=new Float64Array(samples);
  for(let i=0;i<samples;i++){
    const x=i/samples, y=lgSurfaceFn(x);
    const dx=x<1?0.0001:-0.0001;
    const y2=lgSurfaceFn(x+dx);
    const deriv=(y2-y)/dx;
    const mag=Math.sqrt(deriv*deriv+1);
    const ref=refract(-deriv/mag,-1/mag);
    p[i]=ref?ref[0]*((y*bezelWidth+glassThickness)/ref[1]):0;
  }
  return p;
}

function lgGenerateDisplacementMap(w,h,radius,bezelWidth,profile,maxDisp){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d');
  const img=ctx.createImageData(w,h);
  const d=img.data;
  for(let i=0;i<d.length;i+=4){d[i]=128;d[i+1]=128;d[i+2]=0;d[i+3]=255;}
  const r=radius, rSq=r*r, r1Sq=(r+1)**2;
  const rBSq=Math.max(r-bezelWidth,0)**2;
  const wB=w-r*2, hB=h-r*2, S=profile.length;
  for(let y1=0;y1<h;y1++){
    for(let x1=0;x1<w;x1++){
      const x=x1<r?x1-r:x1>=w-r?x1-r-wB:0;
      const y=y1<r?y1-r:y1>=h-r?y1-r-hB:0;
      const dSq=x*x+y*y;
      if(dSq>r1Sq||dSq<rBSq) continue;
      const dist=Math.sqrt(dSq);
      const fromSide=r-dist;
      const op=dSq<rSq?1:1-(dist-Math.sqrt(rSq))/(Math.sqrt(r1Sq)-Math.sqrt(rSq));
      if(op<=0||dist===0) continue;
      const cos=x/dist, sin=y/dist;
      const bi=Math.min(((fromSide/bezelWidth)*S)|0,S-1);
      const disp=profile[bi]||0;
      const dX=(-cos*disp)/maxDisp, dY=(-sin*disp)/maxDisp;
      const idx=(y1*w+x1)*4;
      d[idx]=(128+dX*127*op+0.5)|0;
      d[idx+1]=(128+dY*127*op+0.5)|0;
    }
  }
  ctx.putImageData(img,0,0);
  return c.toDataURL();
}

function lgGenerateSpecularMap(w,h,radius,bezelWidth,balanced){
  const angle=Math.PI/3;
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d');
  const img=ctx.createImageData(w,h);
  const d=img.data; d.fill(0);
  const r=radius, rSq=r*r, r1Sq=(r+1)**2;
  const rBSq=Math.max(r-bezelWidth,0)**2;
  const wB=w-r*2, hB=h-r*2;
  const sv=[Math.cos(angle),Math.sin(angle)];
  for(let y1=0;y1<h;y1++){
    for(let x1=0;x1<w;x1++){
      const x=x1<r?x1-r:x1>=w-r?x1-r-wB:0;
      const y=y1<r?y1-r:y1>=h-r?y1-r-hB:0;
      const dSq=x*x+y*y;
      if(dSq>r1Sq||dSq<rBSq) continue;
      const dist=Math.sqrt(dSq);
      const fromSide=r-dist;
      const op=dSq<rSq?1:1-(dist-Math.sqrt(rSq))/(Math.sqrt(r1Sq)-Math.sqrt(rSq));
      if(op<=0||dist===0) continue;
      const cos=x/dist, sin=-y/dist;
      const dot=balanced?1:Math.abs(cos*sv[0]+sin*sv[1]);
      const edge=Math.sqrt(Math.max(0,1-(1-fromSide)**2));
      const coeff=dot*edge;
      const col=(255*coeff)|0;
      const alpha=(col*coeff*op)|0;
      const idx=(y1*w+x1)*4;
      d[idx]=col; d[idx+1]=col; d[idx+2]=col; d[idx+3]=alpha;
    }
  }
  ctx.putImageData(img,0,0);
  return c.toDataURL();
}

function lgSvgEl(tag,attrs){
  const el=document.createElementNS('http://www.w3.org/2000/svg',tag);
  for(const [k,v] of Object.entries(attrs)) el.setAttribute(k,v);
  return el;
}

let lgDefs=null;
function lgEnsureDefs(){
  const old=document.getElementById('lg-talklist-defs');
  if(old && document.documentElement.contains(old)){ lgDefs=old; return; }
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width','0'); svg.setAttribute('height','0');
  svg.style.cssText='position:fixed;top:0;left:0;width:0;height:0;pointer-events:none;z-index:-1;';
  lgDefs=document.createElementNS('http://www.w3.org/2000/svg','defs');
  lgDefs.id='lg-talklist-defs';
  svg.appendChild(lgDefs);
  document.documentElement.appendChild(svg);
}

function lgBuildFilter(id,w,h,radius,cfg){
  const bezel=Math.min(cfg.bezelWidth,radius-1,Math.min(w,h)/2-1);
  const profile=lgCalcRefractionProfile(cfg.glassThickness,bezel,cfg.ior,128);
  const maxDisp=Math.max(...Array.from(profile).map(Math.abs))||1;
  const dispUrl=lgGenerateDisplacementMap(w,h,radius,bezel,profile,maxDisp);
  const specUrl=lgGenerateSpecularMap(w,h,radius,bezel*2.5,!!cfg.balancedSpecular);
  const scale=maxDisp*cfg.scaleRatio;
  const pad=cfg.balancedSpecular?0.36:0;
  const fx=Math.round(-w*pad), fy=Math.round(-h*pad);
  const fw=Math.round(w*(1+pad*2)), fh=Math.round(h*(1+pad*2));

  const filter=lgSvgEl('filter',{
    id, x:String(fx), y:String(fy), width:String(fw), height:String(fh),
    filterUnits:'userSpaceOnUse', primitiveUnits:'userSpaceOnUse',
    'color-interpolation-filters':'sRGB'
  });
  const blur=lgSvgEl('feGaussianBlur',{in:'SourceGraphic',stdDeviation:cfg.blur,result:'blurred'});
  const dispImg=lgSvgEl('feImage',{href:dispUrl,x:0,y:0,width:w,height:h,result:'disp_map'});
  const dispMap=lgSvgEl('feDisplacementMap',{in:'blurred',in2:'disp_map',scale,xChannelSelector:'R',yChannelSelector:'G',result:'displaced'});
  const sat=lgSvgEl('feColorMatrix',{in:'displaced',type:'saturate',values:cfg.specularSat,result:'displaced_sat'});
  const spec=lgSvgEl('feImage',{href:specUrl,x:0,y:0,width:w,height:h,result:'spec_layer'});
  const comp=lgSvgEl('feComposite',{in:'displaced_sat',in2:'spec_layer',operator:'in',result:'spec_masked'});
  const tr=lgSvgEl('feComponentTransfer',{in:'spec_layer',result:'spec_faded'});
  tr.appendChild(lgSvgEl('feFuncA',{type:'linear',slope:cfg.specularOpacity}));
  const b1=lgSvgEl('feBlend',{in:'spec_masked',in2:'displaced',mode:'normal',result:'with_sat'});
  const b2=lgSvgEl('feBlend',{in:'spec_faded',in2:'with_sat',mode:'normal'});
  filter.append(blur,dispImg,dispMap,sat,spec,comp,tr,b1,b2);
  return filter;
}

const lgTargets=new Map();
function lgApplyGlass(el,cfgGetter){
  if(lgTargets.has(el)) return;
  if(getComputedStyle(el).position==='static') el.style.position='relative';
  let filterNode=null, timer=null;
  function rebuild(){
    lgEnsureDefs();
    const rect=el.getBoundingClientRect();
    const w=Math.round(el.offsetWidth||rect.width);
    const h=Math.round(el.offsetHeight||rect.height);
    if(w<4||h<4) return;
    const dataR=parseFloat(el.getAttribute('data-radius')||'0');
    const cssR=parseFloat(getComputedStyle(el).borderTopLeftRadius||'0');
    const r=Math.max(2,Math.min(dataR||cssR||24,w/2,h/2));
    if(filterNode) filterNode.remove();
    const cfg=cfgGetter();
    const id='lg-tab-'+Math.random().toString(36).slice(2,10);
    filterNode=lgBuildFilter(id,w,h,r,cfg);
    lgDefs.appendChild(filterNode);
    el.style.backdropFilter=`url(#${id})`;
    el.style.webkitBackdropFilter=`url(#${id})`;
  }
  function schedule(){ clearTimeout(timer); timer=setTimeout(rebuild,16); }
  const ro=new ResizeObserver(schedule);
  ro.observe(el);
  lgTargets.set(el,{
    rebuild,
    destroy(){ clearTimeout(timer); ro.disconnect(); if(filterNode) filterNode.remove(); }
  });
  rebuild();
}
function lgRemoveGlass(el){
  const inst=lgTargets.get(el);
  if(!inst) return;
  inst.destroy();
  lgTargets.delete(el);
}
function lgEnableGlass(el,cfgGetter){
  if(!lgTargets.has(el)) lgApplyGlass(el,cfgGetter);
  else lgTargets.get(el).rebuild();
}
function lgQueueGlassRebuild(el){
  requestAnimationFrame(()=>{
    const inst=lgTargets.get(el);
    if(inst) inst.rebuild();
  });
}

// ============================================================================
// bindNavSwitcher: Codepen準拠のドラッグ可能タブインジケーター
// ============================================================================
function bindTalkNavSwitcher(){
  const nav=document.getElementById('tabSegment');
  const indicator=document.getElementById('slider');
  const glow=document.getElementById('navGlow');
  const items=[
    {el:document.getElementById('btnTalk'), page:pageTalk, onSelect:()=>loadTalks(true)},
    {el:document.getElementById('btnHome'), page:pageHome, onSelect:()=>loadPendingRequests(true)},
    {el:document.getElementById('btnPosts'), page:pagePosts, onSelect:loadPosts},
  ];
  if(!nav||!indicator||!glow||!items.length) return;

  const DRAG_THRESHOLD=6, OVERSHOOT=22;
  let active=0, targetIndex=0, pointerId=null, pressX=0, pressY=0;
  let dragMode=false, pressWidth=0, finishTimer=null;

  function navRect(){ return nav.getBoundingClientRect(); }
  function toLocalX(clientX){
    const nr=navRect();
    const sx=nr.width>0?nav.clientWidth/nr.width:1;
    return (clientX-nr.left)*sx;
  }
  function itemMetrics(i){
    const nr=navRect(), ir=items[i].el.getBoundingClientRect();
    const sx=nr.width>0?nav.clientWidth/nr.width:1;
    const left=(ir.left-nr.left)*sx, width=ir.width*sx;
    return {left,width,center:left+width/2};
  }
  function nearestIndex(localX){
    let best=0,bestD=Infinity;
    for(let i=0;i<items.length;i++){
      const d=Math.abs(localX-itemMetrics(i).center);
      if(d<bestD){bestD=d;best=i;}
    }
    return best;
  }
  function setActive(i){
    const prev = active;
    active=i;
    // 移動方向に応じて左右どちらから入ってくるかを決める
    const dirClass = i > prev ? 'lg-page-enter-right' : (i < prev ? 'lg-page-enter-left' : 'lg-page-enter');
    items.forEach((it,idx)=>{
      it.el.classList.toggle('active',idx===i);
      const wasHidden = it.page.style.display==='none';
      it.page.style.display=idx===i?'block':'none';
      if(idx===i && wasHidden){
        it.page.classList.remove('lg-page-enter','lg-page-enter-right','lg-page-enter-left');
        void it.page.offsetWidth; // reflow強制でアニメーション再生を保証
        it.page.classList.add(dirClass);
      }
    });
  }
  function setIndicator(left,width,animate){
    if(!animate){
      const old=indicator.style.transition;
      indicator.style.transition='none';
      indicator.style.left=`${left}px`;
      indicator.style.width=`${width}px`;
      indicator.offsetWidth;
      indicator.style.transition=old;
      return;
    }
    indicator.style.left=`${left}px`;
    indicator.style.width=`${width}px`;
  }
  function snapToIndex(i,animate){
    const m=itemMetrics(i);
    setIndicator(m.left,m.width,animate);
  }
  function setGlow(clientX,clientY,alpha){
    const nr=navRect();
    const lx=toLocalX(clientX);
    nav.style.setProperty('--gx',`${lx}px`);
    nav.style.setProperty('--gy',`${clientY-nr.top}px`);
    nav.style.setProperty('--ga',String(alpha));
  }
  function beginInteraction(clientX,clientY){
    clearTimeout(finishTimer);
    indicator.classList.add('interacting');
    setGlow(clientX,clientY,0.24);
    lgEnableGlass(indicator,()=>Object.assign({},LG_SWITCHER_CONFIG,{balancedSpecular:true}));
    lgQueueGlassRebuild(indicator);
  }
  function endInteraction(){
    clearTimeout(finishTimer);
    finishTimer=setTimeout(()=>{
      indicator.classList.remove('interacting');
      nav.classList.remove('dragging');
      nav.style.setProperty('--ga','0');
      lgRemoveGlass(indicator);
    },500);
  }
  function dragMove(clientX){
    const localX=toLocalX(clientX);
    const w=pressWidth||itemMetrics(active).width;
    let left=localX-w/2;
    left=lgClamp(left,-OVERSHOOT,nav.clientWidth-w+OVERSHOOT);
    indicator.style.left=`${left}px`;
    indicator.style.width=`${w}px`;
    targetIndex=nearestIndex(localX);
    lgQueueGlassRebuild(indicator);
  }
  function clearPointerHandlers(){
    window.removeEventListener('pointermove',onPointerMove);
    window.removeEventListener('pointerup',onPointerUp);
    window.removeEventListener('pointercancel',onPointerCancel);
  }
  function finishSelection(){
    nav.classList.remove('dragging');
    const changed=targetIndex!==active;
    setActive(targetIndex);
    snapToIndex(targetIndex,true);
    lgQueueGlassRebuild(indicator);
    setTimeout(()=>lgQueueGlassRebuild(indicator),120);
    endInteraction();
    if(changed && items[targetIndex].onSelect) items[targetIndex].onSelect();
  }
  function onPointerMove(e){
    if(e.pointerId!==pointerId) return;
    const dx=Math.abs(e.clientX-pressX), dy=Math.abs(e.clientY-pressY);
    if(!dragMode&&(dx>DRAG_THRESHOLD||dy>DRAG_THRESHOLD)){ dragMode=true; nav.classList.add('dragging'); }
    if(dragMode){ setGlow(e.clientX,e.clientY,0.18); dragMove(e.clientX); }
    else{ setGlow(e.clientX,e.clientY,0.22); }
  }
  function onPointerUp(e){
    if(e.pointerId!==pointerId) return;
    clearPointerHandlers();
    finishSelection();
    pointerId=null; dragMode=false;
  }
  function onPointerCancel(e){
    if(e.pointerId!==pointerId) return;
    clearPointerHandlers();
    nav.classList.remove('dragging');
    snapToIndex(active,true);
    endInteraction();
    pointerId=null; dragMode=false;
  }
  function armPointer(idx,e){
    if(pointerId!==null) return;
    pointerId=e.pointerId; dragMode=false; targetIndex=idx;
    pressX=e.clientX; pressY=e.clientY;
    pressWidth=itemMetrics(idx).width;
    beginInteraction(e.clientX,e.clientY);
    window.addEventListener('pointermove',onPointerMove);
    window.addEventListener('pointerup',onPointerUp);
    window.addEventListener('pointercancel',onPointerCancel);
  }

  items.forEach((it,idx)=>{
    it.el.style.touchAction='none';
    it.el.addEventListener('pointerdown',e=>{
      if(!e.isPrimary||e.button!==0) return;
      e.preventDefault();
      armPointer(idx,e);
    });
  });

  snapToIndex(active,false);
  window.addEventListener('resize',()=>snapToIndex(active,false));
}

// switchTab: 外部(ログイン後の初期表示など)から呼ばれる互換関数として維持
function switchTab(activeBtnId){
  const idx=activeBtnId==='btnTalk'?0:activeBtnId==='btnHome'?1:2;
  const items=[
    {el:document.getElementById('btnTalk'), page:pageTalk},
    {el:document.getElementById('btnHome'), page:pageHome},
    {el:document.getElementById('btnPosts'), page:pagePosts},
  ];
  // 現在表示中のページ位置を調べて、移動方向を決める
  let prevIdx = items.findIndex(it => it.page.style.display !== 'none');
  if (prevIdx < 0) prevIdx = idx;
  const dirClass = idx > prevIdx ? 'lg-page-enter-right' : (idx < prevIdx ? 'lg-page-enter-left' : 'lg-page-enter');
  items.forEach((it,i)=>{
    it.el.classList.toggle('active',i===idx);
    const wasHidden = it.page.style.display==='none';
    it.page.style.display=i===idx?'block':'none';
    if(i===idx && wasHidden){
      it.page.classList.remove('lg-page-enter','lg-page-enter-right','lg-page-enter-left');
      void it.page.offsetWidth;
      it.page.classList.add(dirClass);
    }
  });
  const btn=items[idx].el, seg=document.getElementById('tabSegment'), slider=document.getElementById('slider');
  if(btn&&seg&&slider){
    const btnRect=btn.getBoundingClientRect(), segRect=seg.getBoundingClientRect();
    slider.style.left=(btnRect.left-segRect.left)+'px';
    slider.style.width=btnRect.width+'px';
  }
}

// トークリスト読み込み
async function loadTalks(animate = false) {
  try {
    const talks = await api('/api/messages/talks');
    const friends = await api('/api/friends/list');
    const groupsData = await api('/api/groups/list');
    const list = document.getElementById('talkList');
    
    // トークリストのユーザーIDセット
    const talkUserIds = new Set(Array.isArray(talks) ? talks.map(t => t.userId) : []);
    
    // 合併リスト：トーク + 友達（重複削除）
    const merged = [];
    
    if (Array.isArray(talks) && talks.length > 0) {
      merged.push(...talks.map(t => ({ ...t, kind: 'dm' })));
    }
    
    if (Array.isArray(friends)) {
      friends.forEach(f => {
        if (!talkUserIds.has(f.userId)) {
          merged.push({
            kind: 'dm',
            userId: f.userId,
            displayName: f.displayName,
            profilePic: f.profilePic,
            userIdCode: f.userIdCode,
            lastMessage: 'まだメッセージがありません',
            lastTime: null
          });
        }
      });
    }

    // グループをリストに統合せず、別セクションで表示する
    // (グループは下のgroupListカードに表示)
    if (groupsData && Array.isArray(groupsData.groups)) {
      renderGroups(groupsData.groups);
    }

    // 最終メッセージ時刻で降順ソート（メッセージが無いものは末尾）
    merged.sort((a, b) => {
      if (!a.lastTime && !b.lastTime) return 0;
      if (!a.lastTime) return 1;
      if (!b.lastTime) return -1;
      return new Date(b.lastTime) - new Date(a.lastTime);
    });

    // 4秒ごとの自動更新は「変化があった時だけ」DOMを再構築する。
    // タブ切り替え等の明示的な操作(animate=true)は毎回きちんと
    // アニメーション付きで再描画したいので、差分チェックは自動更新時のみ行う。
    const mergedFingerprint = JSON.stringify(merged);
    if (!animate && mergedFingerprint === window.__lastTalkListFingerprint) {
      return; // 前回と同じ内容なので描画をスキップ
    }
    window.__lastTalkListFingerprint = mergedFingerprint;

    if (merged.length === 0) {
      list.textContent = '';
      const empty = document.createElement('div');
      empty.style.cssText = 'text-align:center;color:#94a3b8;font-size:14px;padding:24px';
      empty.innerHTML = 'トークリストが空です<br>友達を追加してメッセージしよう！'; // 固定文言のみ、ユーザー入力なし
      list.appendChild(empty);
      return;
    }

    // セキュリティ上の理由でDOM構築方式を使う(innerHTML文字列組み立てにしない)。
    // 以前は `onclick="openChat('${userId}','${escHtml(displayName)}')"` のように
    // ユーザーが自由に設定できる表示名・グループ名をHTML文字列へ直接埋め込んでいた。
    // escHtml はシングルクォートをエスケープしておらず、しかも仮にエスケープしても
    // ブラウザはHTML属性値のエンティティを先にデコードしてからonclickの中身をJSとして
    // 解釈するため、シングルクォート1文字を名前に含めるだけでJS文字列リテラルを
    // 脱出でき、任意のJavaScriptを実行できてしまっていた(保存型XSS→
    // localStorageのJWT/暗号鍵窃取→アカウント乗っ取りが可能な重大な脆弱性)。
    // addEventListenerとtextContentを使うDOM構築方式は、ユーザー文字列が
    // 一切HTML/JSソースとして再解釈されないため、この種の攻撃が構造的に成立しない。
    list.textContent = '';
    merged.forEach((t, idx) => {
      const item = document.createElement('div');
      item.className = animate ? 'ti glass-materialize-light' : 'ti';
      if (animate) item.style.animationDelay = Math.min(idx * 30, 300) + 'ms';

      const av = document.createElement('div');
      const time = t.lastTime ? formatTime(t.lastTime) : '';

      if (t.kind === 'group') {
        av.className = 'tav group-default-av';
        setAvatarBackground(av, t.avatarImg, (t.displayName || '?')[0]);

        const body = document.createElement('div');
        body.className = 'tbody';
        const row = document.createElement('div');
        row.className = 'ttr';
        const nameEl = document.createElement('div');
        nameEl.className = 'tname';
        nameEl.textContent = t.displayName;
        const timeEl = document.createElement('div');
        timeEl.className = 'ttime';
        timeEl.textContent = time;
        row.appendChild(nameEl);
        row.appendChild(timeEl);
        const msgEl = document.createElement('div');
        msgEl.className = 'tmsg';
        msgEl.textContent = `${t.lastMessage || ''} ・ ${t.memberCount}人`;
        body.appendChild(row);
        body.appendChild(msgEl);

        item.appendChild(av);
        item.appendChild(body);
        item.addEventListener('click', () => {
          // アバターをヘッダー位置へ飛ばしてから遷移する(Shared Element Transition)
          if (window.LiquidGlass && window.LiquidGlass.flyAvatarTo) {
            window.LiquidGlass.flyAvatarTo(av, () => openGroupChat(t.groupId, t.displayName));
          } else {
            openGroupChat(t.groupId, t.displayName);
          }
        });
      } else {
        av.className = 'tav';
        setAvatarBackground(av, t.profilePic, (t.displayName || '?')[0]);

        const body = document.createElement('div');
        body.className = 'tbody';
        const row = document.createElement('div');
        row.className = 'ttr';
        const nameEl = document.createElement('div');
        nameEl.className = 'tname';
        nameEl.textContent = t.displayName;
        const timeEl = document.createElement('div');
        timeEl.className = 'ttime';
        timeEl.textContent = time;
        row.appendChild(nameEl);
        row.appendChild(timeEl);
        const msgEl = document.createElement('div');
        msgEl.className = 'tmsg';
        msgEl.textContent = t.lastMessage || '';
        body.appendChild(row);
        body.appendChild(msgEl);

        item.appendChild(av);
        item.appendChild(body);

        if (t.unreadCount > 0) {
          const badge = document.createElement('div');
          badge.style.cssText = 'background:rgba(255,255,255,.3);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);color:#0f172a;border:1px solid rgba(255,255,255,.5);border-radius:50%;width:20px;height:20px;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700';
          badge.textContent = String(t.unreadCount);
          item.appendChild(badge);
        }

        // クリックされたアバターをチャット画面のヘッダーアバター位置へ
        // 実際に飛ばしてから遷移する(FLIP方式のShared Element Transition)。
        item.addEventListener('click', () => {
          if (window.LiquidGlass && window.LiquidGlass.flyAvatarTo) {
            window.LiquidGlass.flyAvatarTo(av, () => openChat(t.userId, t.displayName));
          } else {
            openChat(t.userId, t.displayName);
          }
        });
      }

      list.appendChild(item);
    });
  } catch(e) { console.error('loadTalks:', e); }
}

// アバター画像を安全に背景として設定する共通ヘルパー。
// 生のHTML属性文字列(style="background-image:url(...)")としてではなく、
// DOM要素のCSSOMプロパティへ直接代入することで、値に " や < のような文字が
// 含まれていてもHTML/属性コンテキストから脱出できないようにする。
// さらに、data:image/ または https:// 以外の値は画像として扱わず、
// 常に頭文字表示にフォールバックすることで、CSS式やjavascript:のような
// 危険なスキームが url() に紛れ込む余地そのものを塞ぐ。
function setAvatarBackground(el, picValue, initial) {
  const isSafeImage = typeof picValue === 'string'
    && (/^data:image\/(png|jpe?g|gif|webp);base64,/.test(picValue) || /^https:\/\//.test(picValue));
  if (isSafeImage) {
    el.style.backgroundImage = `url(${JSON.stringify(picValue)})`;
    el.textContent = '';
  } else {
    el.style.backgroundImage = '';
    el.textContent = initial;
  }
}

function openGroupChat(groupId, name) {
  location.href = `/groupchat.html?groupId=${encodeURIComponent(groupId)}&name=${encodeURIComponent(name)}`;
}

// キャッシュマネージャーの初期化と復元
async function initializeWithCache() {
  try {
    // キャッシュを初期化
    await cacheManager.init();
    
    // キャッシュから友達情報を復元して表示
    const cachedFriends = await cacheManager.getFriends();
    if (Array.isArray(cachedFriends) && cachedFriends.length > 0) {
      renderFriends(cachedFriends);
    }
    
    // キャッシュからグループ情報を復元して表示
    const cachedGroups = await cacheManager.getGroups();
    if (Array.isArray(cachedGroups) && cachedGroups.length > 0) {
      renderGroups(cachedGroups);
    }
    
    // バックグラウンドでサーバーから最新データを取得（非同期）
    refreshFromServer();
  } catch (e) {
    console.error('Cache initialization error:', e);
    // キャッシュ初期化失敗時も、サーバーから読み込み
    refreshFromServer();
  }
}

async function refreshFromServer() {
  try {
    const token = localStorage.getItem('jwt');
    const headers = token ? { 'Authorization': 'Bearer ' + token } : {};

    // 友達情報を取得
    const response = await fetch('/api/friends/list', { headers });
    if (response.ok) {
      const friends = await response.json();
      await cacheManager.saveFriends(friends);
      renderFriends(friends);
    }

    // グループ情報を取得
    const groupsResponse = await fetch('/api/groups/list', { headers });
    if (groupsResponse.ok) {
      const groupsData = await groupsResponse.json();
      const groups = groupsData.groups || groupsData;
      await cacheManager.saveGroups(groups);
      renderGroups(groups);
    }
  } catch (e) {
    console.error('Server refresh error:', e);
  }
}

    // アバター要素はこの直後に生成されるため、参照を遅延評価する
    card.onclick = () => {
      if (window.LiquidGlass && window.LiquidGlass.flyAvatarTo) {

function formatTime(ts) {
  const d = new Date(ts);
  const today = new Date();
  if (d.toDateString() === today.toDateString()) {
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }
  return (d.getMonth()+1) + '/' + d.getDate();
}

// なので、今後もこの用途では使わずaddEventListener方式を用いること。
function escHtml(str) {
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// クロップ
let cx=0,cy=0,cs=1,cd=false,csx=0,csy=0;
const cropBox=document.getElementById('cropBox');
const cropImg=document.getElementById('cropImg');
const cropZoom=document.getElementById('cropZoom');
const cropZoomLabel=document.getElementById('cropZoomLabel');
const cropControls=document.getElementById('cropControls');
let croppedUrl=localStorage.getItem('myAvatar')||'';
let bgUrl=localStorage.getItem('myBgImage')||'';

// 円形ガイド(直径140px)の外側まで画像を動かせてしまうと、保存時に
// 「見えない部分(黒背景)」まで含んだ画像になってしまう事故が起きやすかった。
// 画像の表示サイズを常にガイド円より大きく保つよう、cx/cy/csの取りうる範囲を
// 都度クランプ(制限)することで、常に円全体が画像で埋まった状態を保証する。
const CROP_GUIDE_SIZE = 140; // ガイド円の直径(px)
function clampCropTransform(){
  if(!cropImg.naturalWidth||!cropImg.naturalHeight)return;
  const bx=cropBox.offsetWidth/2, by=cropBox.offsetHeight/2;
  const iw=cropImg.naturalWidth*cs, ih=cropImg.naturalHeight*cs;
  // 画像の表示サイズがガイド円より小さくならないよう、最小スケールを再計算
  const minScaleToFillGuide=CROP_GUIDE_SIZE/Math.min(cropImg.naturalWidth,cropImg.naturalHeight);
  if(cs<minScaleToFillGuide){cs=minScaleToFillGuide;cropZoom.min=minScaleToFillGuide.toFixed(3);}
  const iw2=cropImg.naturalWidth*cs, ih2=cropImg.naturalHeight*cs;
  // 円のガイド範囲(中心±70px)が常に画像の内側に収まるようcx/cyを制限する
  const halfGuide=CROP_GUIDE_SIZE/2;
  const minCx=bx-halfGuide-(iw2-halfGuide*2), maxCx=bx-halfGuide;
  const minCy=by-halfGuide-(ih2-halfGuide*2), maxCy=by-halfGuide;
  cx=Math.min(maxCx,Math.max(minCx,cx));
  cy=Math.min(maxCy,Math.max(minCy,cy));
}

document.getElementById('inAvFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    cropImg.src=ev.target.result;
    cropBox.style.display='block';cropZoom.style.display='none';
    cropControls.style.display='block';
    cropImg.onload=()=>{
      // 初期表示は画像がガイド円をちょうど埋める倍率から開始する
      const minScale=CROP_GUIDE_SIZE/Math.min(cropImg.naturalWidth,cropImg.naturalHeight);
      cs=minScale;
      cropZoom.min=minScale.toFixed(3);
      cropZoom.max=(minScale*4).toFixed(3);
      cropZoom.value=cs;
      cx=(cropBox.offsetWidth-cropImg.naturalWidth*cs)/2;
      cy=(cropBox.offsetHeight-cropImg.naturalHeight*cs)/2;
      updC();
    };
  };r.readAsDataURL(f);
};
function updC(){
  clampCropTransform();
  cropImg.style.transform=`translate(${cx}px,${cy}px) scale(${cs})`;
  cropImg.style.transformOrigin='0 0';
  cropZoom.value=cs;
  if(cropZoomLabel){
    const minScale=CROP_GUIDE_SIZE/Math.min(cropImg.naturalWidth||1,cropImg.naturalHeight||1);
    cropZoomLabel.textContent=Math.round((cs/minScale)*100)+'%';
  }
}
let pinchStartDist=0,pinchStartScale=1;
function touchDist(touches){const dx=touches[0].clientX-touches[1].clientX,dy=touches[0].clientY-touches[1].clientY;return Math.hypot(dx,dy);}
cropBox.addEventListener('mousedown',e=>{cd=true;csx=e.clientX-cx;csy=e.clientY-cy;});
cropBox.addEventListener('touchstart',e=>{
  if(e.touches.length===1){cd=true;csx=e.touches[0].clientX-cx;csy=e.touches[0].clientY-cy;}
  else if(e.touches.length===2){cd=false;pinchStartDist=touchDist(e.touches);pinchStartScale=cs;}
},{passive:true});
window.addEventListener('mousemove',e=>{if(!cd)return;cx=e.clientX-csx;cy=e.clientY-csy;updC();});
window.addEventListener('touchmove',e=>{
  if(cropBox.style.display!=='block')return;
  if(e.touches.length===2){
    e.preventDefault();
    const scale=pinchStartScale*(touchDist(e.touches)/pinchStartDist);
    cs=Math.min(parseFloat(cropZoom.max||3),Math.max(parseFloat(cropZoom.min||0.5),scale));
    updC();
    return;
  }
  if(!cd||e.touches.length!==1)return;
  e.preventDefault();
  cx=e.touches[0].clientX-csx;cy=e.touches[0].clientY-csy;updC();
},{passive:false});
window.addEventListener('mouseup',()=>cd=false);window.addEventListener('touchend',()=>cd=false);
cropZoom.oninput=e=>{cs=parseFloat(e.target.value);updC();};

// リセットボタン: 位置・ズームを画像読み込み直後の状態(ガイド円ぴったり・中央)に戻す。
// 「動かしすぎてよく分からなくなった」を即座にやり直せるようにする。
document.getElementById('cropResetBtn').onclick=()=>{
  if(!cropImg.naturalWidth)return;
  if(window.LiquidGlass)window.LiquidGlass.haptic('light');
  const minScale=CROP_GUIDE_SIZE/Math.min(cropImg.naturalWidth,cropImg.naturalHeight);
  cs=minScale;
  cx=(cropBox.offsetWidth-cropImg.naturalWidth*cs)/2;
  cy=(cropBox.offsetHeight-cropImg.naturalHeight*cs)/2;
  updC();
};

document.getElementById('inBgFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  // 背景画像はリサイズしてDataURL容量を抑える（localStorage上限対策）
  const img = new Image();
  img.onload = () => {
    const MAX = 1280;
    let w = img.width, h = img.height;
    if (w > MAX || h > MAX) {
      if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
      else { w = Math.round(w * MAX / h); h = MAX; }
    }
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    bgUrl = canvas.toDataURL('image/jpeg', 0.7);
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(f);
};

document.getElementById('saveSettings').onclick=async ()=>{
  const name=document.getElementById('inName').value.trim();
  let newAvatarUrl=null;

  if(cropImg.src&&cropImg.complete&&cropImg.src!==location.href&&cropBox.style.display!=='none'){
    const canvas=document.createElement('canvas');canvas.width=140;canvas.height=140;
    const ctx=canvas.getContext('2d');
    // ガイド円の中心 = cropBoxの中心
    const guideCenterX=cropBox.offsetWidth/2;
    const guideCenterY=cropBox.offsetHeight/2;
    // ガイド円中心が原画像のどの座標に対応するか
    const srcCenterX=(guideCenterX-cx)/cs;
    const srcCenterY=(guideCenterY-cy)/cs;
    // 原画像座標でのガイド円半径
    const srcRadius=70/cs;
    // 原画像から切り出す矩形（ガイド円に内接する正方形）
    const srcX=srcCenterX-srcRadius;
    const srcY=srcCenterY-srcRadius;
    const srcW=srcRadius*2;
    const srcH=srcRadius*2;
    ctx.drawImage(cropImg,srcX,srcY,srcW,srcH,0,0,140,140);
    croppedUrl=canvas.toDataURL();
    newAvatarUrl=croppedUrl;
    localStorage.setItem('myAvatar',croppedUrl);
    const dav=document.getElementById('dispAv');
    dav.style.backgroundImage=`url(${croppedUrl})`;
  }

  if(name){
    localStorage.setItem('myName',name);
    document.getElementById('dispName').textContent=name;
  }

  // 名前・画像のどちらか一方でも変更があればサーバーへ反映する
  if(name||newAvatarUrl!==null){
    const body={ displayName: name||localStorage.getItem('myName')||'' };
    if(newAvatarUrl!==null) body.profilePic=newAvatarUrl;
    try{
      await api('/api/friends/me', { method:'POST', body: JSON.stringify(body) });
    }catch(e){console.error('プロフィール保存エラー:',e);}
  }

  if(bgUrl){
    try {
      localStorage.setItem('myBgImage',bgUrl);
    } catch(e) {
      console.error('背景画像の保存に失敗（容量超過）:', e);
      // localStorageに入らなくてもセッション中は表示する
    }
    document.documentElement.style.backgroundImage=`url(${bgUrl})`;
    document.documentElement.style.backgroundSize='cover';
    document.documentElement.style.backgroundPosition='center';
    document.documentElement.style.backgroundAttachment='fixed';
    document.body.classList.add('has-custom-bg');
  }
  settingsMov.classList.remove('open');
};

function formatPostTime(ts) {
  const d = new Date(ts.includes('T') ? ts : ts.replace(' ', 'T') + 'Z');
  const now = new Date();
  const diffMs = now - d;
  const diffMin = Math.floor(diffMs / 60000);
  if (diffMin < 1) return 'たった今';
  if (diffMin < 60) return `${diffMin}分前`;
  const diffHour = Math.floor(diffMin / 60);
  if (diffHour < 24) return `${diffHour}時間前`;
  const diffDay = Math.floor(diffHour / 24);
  if (diffDay < 7) return `${diffDay}日前`;
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

document.getElementById('postImageFile').onchange = e => {

document.getElementById('postVideoFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  if (f.size > 500 * 1024 * 1024) { // Cloudinary 対応で 500MB まで対応
    alert(i18n.t('err_video_too_large'));

  }

    const videoContainer = document.getElementById('postVideoContainer');

    const onLoadedMetadata = () => {

      const duration = video.duration;
      const minutes = Math.floor(duration / 60);

document.getElementById('postSubmitBtn').onclick = async () => {
  const textInput = document.getElementById('postTextInput');
  const text = textInput.value.trim();
  if (!text && !pendingPostMedia) return;
  if (window.LiquidGlass) window.LiquidGlass.haptic('medium');

  const submitBtn = document.getElementById('postSubmitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = '投稿中...';

  try {
    const body = { text: text || null };
    
    // メディアがある場合、Cloudinaryに直接アップロード（投稿は全員が閲覧するためE2E暗号化不要）
    if (pendingPostMedia) {
      try {
        const mediaFile = pendingPostMedia.file;
        const resourceType = pendingPostMedia.type === 'video' ? 'video' : 'image';
        console.log('[postSubmit] Starting media upload:', { size: mediaFile.size, type: resourceType });

        const formData = new FormData();
        formData.append('file', mediaFile);
        formData.append('upload_preset', 'brochat_upload');
        formData.append('folder', 'brochat/posts');

        const cloudinaryUrl = await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.upload.addEventListener('progress', (ev) => {
            if (ev.lengthComputable) {
              const pct = Math.round((ev.loaded / ev.total) * 100);
              submitBtn.textContent = i18n.t('post_btn') + `...${pct}%`;
            }
          });
          xhr.addEventListener('load', () => {
            if (xhr.status < 200 || xhr.status >= 300) {
              let detail = '';
              try { detail = JSON.parse(xhr.responseText)?.error?.message || ''; } catch {}
              console.error('[postUpload] status', xhr.status, 'body:', xhr.responseText);
              reject(new Error(`${xhr.status}${detail ? ' - ' + detail : ''}`));
              return;
            }
            const resp = JSON.parse(xhr.responseText);
            resolve(resp.secure_url);
          });
          xhr.addEventListener('error', () => reject(new Error('Network error')));
          xhr.open('POST', `https://api.cloudinary.com/v1_1/a6rxinoz/${resourceType}/upload`);
          xhr.send(formData);
        });

        body.mediaUrl = cloudinaryUrl;
        body.mediaType = pendingPostMedia.type;
        body.encrypted = false;
        console.log('[postSubmit] Upload complete:', cloudinaryUrl);
      } catch (e) {
        console.error('[postSubmit] Media upload error:', e);
        alert(i18n.t('err_media_upload_failed') + e.message);
        submitBtn.disabled = false;
        submitBtn.textContent = i18n.t('post_btn');
        return;
      }
    }

    const data = await api('/api/posts', { method: 'POST', body: JSON.stringify(body) });
    if (data.ok) {
      textInput.value = '';
      pendingPostMedia = null;
      document.getElementById('postMediaPreview').style.display = 'none';
      document.getElementById('postMediaPreviewImg').src = '';
      document.getElementById('postMediaPreviewVideo').src = '';
      document.getElementById('postVideoContainer').style.display = 'none';
      document.getElementById('postVideoLoading').style.display = 'none';
      document.getElementById('postImageFile').value = '';
      document.getElementById('postVideoFile').value = '';
      postsOldestTimestamp = null;
      loadPosts();
    } else {
      alert(data.error || '投稿に失敗しました');
    }
  } catch (e) {
    alert(i18n.t('err_post_failed'));
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = '投稿する';
  }
};

    delBtn.addEventListener('click', () => deletePost(p.id, card));
    header.appendChild(delBtn);
  }

    textEl.className = 'post-text';

async function toggleLike(postId, btn, countSpan) {
  if (window.LiquidGlass) window.LiquidGlass.haptic('selection');
  try {
    const data = await api(`/api/posts/${postId}/like`, { method: 'POST' });
    if (data.ok) {
      const wasLiked = btn.dataset.liked === '1';
      btn.dataset.liked = data.liked ? '1' : '0';
      btn.classList.toggle('liked', data.liked);
      const svg = btn.querySelector('svg');
      if (svg) svg.setAttribute('fill', data.liked ? 'currentColor' : 'none');
      countSpan.textContent = parseInt(countSpan.textContent, 10) + (data.liked ? 1 : -1);
    }
  } catch (e) { console.error('toggleLike error:', e); }
}

async function toggleComments(postId, wrap) {
  if (wrap.style.display === 'block') {
    wrap.style.display = 'none';
    return;
  }
  wrap.style.display = 'block';
  wrap.textContent = '';
  const loading = document.createElement('div');
  loading.style.cssText = 'font-size:12px;color:#94a3b8;padding:4px 0';
  loading.textContent = '読み込み中...';
  wrap.appendChild(loading);

  try {
    const comments = await api(`/api/posts/${postId}/comments`);
    wrap.textContent = '';
    comments.forEach(c => wrap.appendChild(renderCommentRow(c)));
    wrap.appendChild(renderCommentForm(postId, wrap));
  } catch (e) {
    wrap.textContent = '';
    const err = document.createElement('div');
    err.style.cssText = 'font-size:12px;color:#ef4444';
    err.textContent = 'コメントの読み込みに失敗しました';
    wrap.appendChild(err);
  }
}

function renderCommentRow(c) {
  const row = document.createElement('div');
  row.className = 'post-comment-row';
  const nameEl = document.createElement('span');
  nameEl.className = 'post-comment-author';
  nameEl.textContent = c.authorName + '：';
  const textEl = document.createElement('span');
  textEl.className = 'post-comment-text';
  setLinkedText(textEl, c.text);
  row.appendChild(nameEl);
  row.appendChild(textEl);
  return row;
}

function renderCommentForm(postId, wrap) {
  const form = document.createElement('div');
  form.className = 'post-comment-form';
  const input = document.createElement('input');
  input.className = 'post-comment-input';
  input.placeholder = 'コメントを追加...';
  const sendBtn = document.createElement('button');
  sendBtn.className = 'post-comment-send';
  sendBtn.textContent = '送信';
  const submit = async () => {
    const text = input.value.trim();
    if (!text) return;
    sendBtn.disabled = true;
    try {
      const data = await api(`/api/posts/${postId}/comments`, { method: 'POST', body: JSON.stringify({ text }) });
      if (data.ok) {
        input.value = '';
        const row = renderCommentRow(data.comment);
        form.parentElement.insertBefore(row, form);
        // コメント数バッジも更新
        const card = document.querySelector(`.post-card[data-post-id="${postId}"]`);
        if (card) {
          const commentBtn = card.querySelectorAll('.post-action-btn')[1];
          const span = commentBtn?.querySelector('span');
          if (span) span.textContent = parseInt(span.textContent, 10) + 1;
        }
      }
    } catch (e) { console.error('comment submit error:', e); }
    finally { sendBtn.disabled = false; }
  };
  sendBtn.addEventListener('click', submit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  form.appendChild(input);
  form.appendChild(sendBtn);
  return form;
}

async function deletePost(postId, card) {
  if (!confirm('この投稿を削除しますか？')) return;
  try {
    const data = await api(`/api/posts/${postId}`, { method: 'DELETE' });
    if (data.ok) {
      if (window.LiquidGlass) {
        window.LiquidGlass.dematerialize(card, () => card.remove());
      } else {
        card.remove();
      }
    }
  } catch (e) { console.error('deletePost error:', e); }
}

// =============================================================================
// Tactile Switch Engine
// 物理スプリング + SVGフィルター(feDisplacementMap)による本物のガラストグル
// オン時はグリーン(#34c759)発光
// =============================================================================
(function() {
  const SurfaceEquations = {
    convex_squircle: (x) => Math.pow(1 - Math.pow(1 - x, 4), 1/4)
  };

  class Spring {
    constructor(v, s=300, d=20) {
      this.value=v; this.target=v; this.velocity=0;
      this.stiffness=s; this.damping=d;
    }
    setTarget(t){ this.target=t; }
    update(dt){
      const f=(this.target-this.value)*this.stiffness;
      const df=this.velocity*this.damping;
      this.velocity+=(f-df)*dt;
      this.value+=this.velocity*dt;
      return this.value;
    }
    isSettled(){
      return Math.abs(this.target-this.value)<0.001 && Math.abs(this.velocity)<0.001;
    }
  }

  function calcDispMap1D(gt,bw,sf,ri,s=128){
    const e=1/ri,r=[];
    for(let i=0;i<s;i++){
      const x=i/s, y=sf(x);
      const dx=x<1?0.0001:-0.0001;
      const d=(sf(Math.max(0,Math.min(1,x+dx)))-y)/dx;
      const m=Math.sqrt(d*d+1);
      const n=[-d/m,-1/m];
      const dt2=n[1];
      const k=1-e*e*(1-dt2*dt2);
      if(k<0){r.push(0);}
      else{
        const rf=[-(e*dt2+Math.sqrt(k))*n[0],e-(e*dt2+Math.sqrt(k))*n[1]];
        r.push(rf[0]*((y*bw+gt)/rf[1]));
      }
    }
    return r;
  }

  function calcDispMap2D(cw,ch,ow,oh,rad,bw,md,pMap){
    const img=new ImageData(cw,ch);
    for(let i=0;i<img.data.length;i+=4){img.data[i]=128;img.data[i+1]=128;img.data[i+3]=255;}
    const rSq=rad*rad,rp1Sq=(rad+1)**2,rmBwSq=Math.max(0,rad-bw)**2;
    const wB=ow-rad*2,hB=oh-rad*2,oX=(cw-ow)/2,oY=(ch-oh)/2;
    for(let y1=0;y1<oh;y1++){
      for(let x1=0;x1<ow;x1++){
        const idx=((oY+y1)*cw+oX+x1)*4;
        const x=x1<rad?x1-rad:x1>=ow-rad?x1-rad-wB:0;
        const y=y1<rad?y1-rad:y1>=oh-rad?y1-rad-hB:0;
        const dSq=x*x+y*y;
        if(dSq<=rp1Sq&&dSq>=rmBwSq){
          const dist=Math.sqrt(dSq);
          const op=dSq<rSq?1:1-(dist-rad)/(Math.sqrt(rp1Sq)-rad);
          const bIdx=Math.floor(Math.max(0,Math.min(1,(rad-dist)/bw))*pMap.length);
          const dVal=pMap[Math.max(0,Math.min(bIdx,pMap.length-1))]||0;
          const dX=md>0?(-(dist>0?x/dist:0)*dVal)/md:0;
          const dY=md>0?(-(dist>0?y/dist:0)*dVal)/md:0;
          img.data[idx]=Math.max(0,Math.min(255,128+dX*127*op));
          img.data[idx+1]=Math.max(0,Math.min(255,128+dY*127*op));
        }
      }
    }
    return img;
  }

  function calcSpecular(ow,oh,rad){
    const img=new ImageData(ow,oh);
    const sVec=[Math.cos(Math.PI/3),Math.sin(Math.PI/3)];
    const rSq=rad*rad,rp1Sq=(rad+1)**2,rmSSq=Math.max(0,(rad-1.5)**2);
    for(let y1=0;y1<oh;y1++){
      for(let x1=0;x1<ow;x1++){
        const x=x1<rad?x1-rad:x1>=ow-rad?x1-rad-(ow-rad*2):0;
        const y=y1<rad?y1-rad:y1>=oh-rad?y1-rad-(oh-rad*2):0;
        const dSq=x*x+y*y;
        if(dSq<=rp1Sq&&dSq>=rmSSq){
          const dist=Math.sqrt(dSq);
          const op=dSq<rSq?1:1-(dist-rad)/(Math.sqrt(rp1Sq)-rad);
          const dp=Math.abs((dist>0?x/dist:0)*sVec[0]+(dist>0?-y/dist:0)*sVec[1]);
          const cf=dp*Math.sqrt(1-(1-Math.max(0,Math.min(1,(rad-dist)/1.5)))**2);
          const c=Math.min(255,255*cf);
          const idx=(y1*ow+x1)*4;
          img.data[idx]=img.data[idx+1]=img.data[idx+2]=c;
          img.data[idx+3]=Math.min(255,c*cf*op);
        }
      }
    }
    return img;
  }

  function imgToDataURL(img){
    const c=document.createElement('canvas');
    c.width=img.width;c.height=img.height;
    c.getContext('2d').putImageData(img,0,0);
    return c.toDataURL();
  }

  // グリーン(#34c759)のRGB
  const GREEN_R=52,GREEN_G=199,GREEN_B=89;

  function initTactileSwitch(thumbEl, trackEl, cloneInnerEl, inputEl, dispImgId, dispMapId) {
    const c={tw:80,th:34,w:72,h:46,r:23,bw:10,gt:24,ri:1.5,sr:0.65,sa:0.88};
    const s={chk:inputEl.checked,pd:false,ix:0,xr:inputEl.checked?1:0,md:0};
    const sp={
      xr:new Spring(s.chk?1:0,1000,80),
      sc:new Spring(c.sr,2000,80),
      bo:new Spring(1,2000,80),
      tc:new Spring(s.chk?1:0,1000,80),
      sr:new Spring(0.4,100,10)
    };
    c.ro=((1-c.sr)*c.w)/2;
    c.tr=c.tw-c.th-(c.w-c.h)*c.sr;
    let af=null;

    // displacement mapはdispImgIdが存在する最初のスイッチにのみ設定
    const dispImgEl=document.getElementById(dispImgId);
    const dispMapEl=document.getElementById(dispMapId);
    if(dispImgEl){
      const pc=calcDispMap1D(c.gt,c.bw,SurfaceEquations.convex_squircle,c.ri);
      s.md=Math.max(...pc.map(Math.abs));
      dispImgEl.setAttribute('href',imgToDataURL(calcDispMap2D(c.w,c.h,c.w,c.h,c.r,c.bw,s.md||1,pc)));
      const specEl=document.getElementById(dispImgId.replace('DispImg','SpecImg'));
      if(specEl) specEl.setAttribute('href',imgToDataURL(calcSpecular(c.w,c.h,c.r)));
    }

    function loop(){
      const dt=Math.min(0.032,1/60);
      sp.sc.setTarget(s.pd?c.sa:c.sr);
      sp.bo.setTarget(s.pd?0.1:1);
      sp.sr.setTarget(s.pd?0.9:0.4);
      if(!s.pd) sp.xr.setTarget(s.chk?1:0);
      sp.tc.setTarget(s.pd?(s.xr>0.5?1:0):(s.chk?1:0));

      const xr=sp.xr.update(dt),sc=sp.sc.update(dt),bo=sp.bo.update(dt),tc=sp.tc.update(dt);
      const tx=-c.ro+(c.th-c.h*c.sr)/2+xr*c.tr;

      thumbEl.style.left=tx+'px';
      thumbEl.style.transform=`translateY(-50%) scale(${sc})`;
      thumbEl.style.backgroundColor=`rgba(255,255,255,${bo})`;
      thumbEl.style.boxShadow=s.pd
        ?'0 4px 18px rgba(0,0,0,0.1),inset 2px 7px 20px rgba(0,0,0,0.08),inset -2px -7px 20px rgba(255,255,255,0.08)'
        :'0 8px 28px rgba(0,0,0,0.38)';

      if(cloneInnerEl){
        const cloneOp=1-bo;
        thumbEl.querySelector('.ts-thumb-clone').style.opacity=cloneOp;
      }

      // オン=グリーン(#34c759)、オフ=ガラス素材
      const r=Math.round(255+(GREEN_R-255)*tc);
      const g=Math.round(255+(GREEN_G-255)*tc);
      const b=Math.round(255+(GREEN_B-255)*tc);
      const a=0.05+(0.55-0.05)*tc;
      const tBg=`rgba(${r},${g},${b},${a})`;
      trackEl.style.backgroundColor=tBg;

      // グリーングロー
      const glowA=tc*0.5;
      trackEl.style.boxShadow=`inset 0 2px 8px rgba(0,0,0,0.18),0 1px 0 rgba(255,255,255,0.6),0 0 0 ${tc*3}px rgba(52,199,89,${glowA})`;

      if(cloneInnerEl){
        const aR=trackEl.closest('.ts-wrap')||trackEl.parentElement;
        const aRect=aR.getBoundingClientRect();
        const cl=(aRect.width-c.tw)/2;
        const ct=(aRect.height-c.th)/2;
        cloneInnerEl.style.width=aRect.width+'px';
        cloneInnerEl.style.height=aRect.height+'px';
        cloneInnerEl.style.transform=`translate(${-(cl+tx)}px,${-(ct+(c.th/2-c.h/2))}px)`;
        cloneInnerEl.style.setProperty('--ts-track-color',tBg);
        cloneInnerEl.style.setProperty('--track-left',`${cl}px`);
        cloneInnerEl.style.setProperty('--track-top',`${ct}px`);
      }

      if(dispMapEl) dispMapEl.setAttribute('scale',s.md*sp.sr.update(dt));

      if(!Object.values(sp).every(x=>x.isSettled())) af=requestAnimationFrame(loop);
      else af=null;
    }

    function fireChange(){
      const ev=new Event('change',{bubbles:true});
      inputEl.checked=s.chk;
      inputEl.dispatchEvent(ev);
    }

    thumbEl.addEventListener('mousedown',e=>{
      e.preventDefault();e.stopPropagation();
      s.pd=true;s.ix=e.clientX;s.xr=s.chk?1:0;
      if(!af)af=requestAnimationFrame(loop);
    });
    thumbEl.addEventListener('touchstart',e=>{
      e.preventDefault();e.stopPropagation();
      s.pd=true;s.ix=e.touches[0].clientX;s.xr=s.chk?1:0;
      if(!af)af=requestAnimationFrame(loop);
    },{passive:false});
    window.addEventListener('mousemove',e=>{
      if(!s.pd)return;
      const cx=e.clientX;
      const r2=(s.chk?1:0)+(cx-s.ix)/c.tr;
      s.xr=Math.min(1,Math.max(0,r2))+((r2<0?1:-1)*(r2<0?-r2:r2>1?r2-1:0))/22;
      sp.xr.setTarget(s.xr);
      if(!af)af=requestAnimationFrame(loop);
    });
    window.addEventListener('touchmove',e=>{
      if(!s.pd)return;
      const cx=e.touches[0].clientX;
      const r2=(s.chk?1:0)+(cx-s.ix)/c.tr;
      s.xr=Math.min(1,Math.max(0,r2))+((r2<0?1:-1)*(r2<0?-r2:r2>1?r2-1:0))/22;
      sp.xr.setTarget(s.xr);
      if(!af)af=requestAnimationFrame(loop);
    },{passive:false});
    window.addEventListener('mouseup',e=>{
      if(s.pd){
        s.pd=false;
        s.chk=Math.abs(e.clientX-s.ix)<4?!s.chk:s.xr>0.5;
        fireChange();
        if(!af)af=requestAnimationFrame(loop);
      }
    });
    window.addEventListener('touchend',e=>{
      if(s.pd){
        s.pd=false;
        const cx=e.changedTouches?e.changedTouches[0].clientX:0;
        s.chk=Math.abs(cx-s.ix)<4?!s.chk:s.xr>0.5;
        fireChange();
        if(!af)af=requestAnimationFrame(loop);
      }
    });
    trackEl.addEventListener('click',e=>{
      if(e.target===trackEl){
        s.chk=!s.chk;
        fireChange();
        if(!af)af=requestAnimationFrame(loop);
      }
    });
    // 初期状態を描画
    af=requestAnimationFrame(loop);
  }

  document.addEventListener('DOMContentLoaded',()=>{
    // Chrome系のbackdrop-filter: url() サポート検出
    const t=document.createElement('div');
    t.style.backdropFilter='url(#test)';
    if(!!window.chrome&&t.style.backdropFilter.includes('url')) document.body.classList.add('use-backdrop-filter');

    // 各スイッチを初期化
    const switches=[
      {thumb:'tsThumbDarkMode',  track:'tsTrackDarkMode',  clone:'tsCloneInnerDarkMode',  input:'toggleDarkMode',   dispImg:'tsDispImg',  dispMap:'tsDispMap'},
      {thumb:'tsThumbDataSaver', track:'tsTrackDataSaver', clone:'tsCloneInnerDataSaver', input:'toggleDataSaver',  dispImg:null,         dispMap:null},
      {thumb:'tsThumbBatterySaver',track:'tsTrackBatterySaver',clone:'tsCloneInnerBatterySaver',input:'toggleBatterySaver',dispImg:null,dispMap:null},
    ];
    switches.forEach(sw=>{
      const thumbEl=document.getElementById(sw.thumb);
      const trackEl=document.getElementById(sw.track);
      const cloneEl=document.getElementById(sw.clone);
      const inputEl=document.getElementById(sw.input);
      if(thumbEl&&trackEl&&inputEl){
        initTactileSwitch(thumbEl,trackEl,cloneEl,inputEl,sw.dispImg,sw.dispMap);
      }
    });
  });
})();

</script>

<script>
// ============================================================================
// 画像/動画プレビュー(投稿のメディア・プロフィールアイコン共通)
// ============================================================================
(function () {
  const modal = document.getElementById('tlMediaModal');
  const inner = document.getElementById('tlMediaInner');

  // src: 表示するメディアのURL(またはdata:URL)、isVideo: 動画かどうか
  window.openTalklistMedia = function (src, isVideo) {
    if (!src) return;
    inner.innerHTML = '';
    let el;
    if (isVideo) {
      el = document.createElement('video');
      el.controls = true;
      el.autoplay = true;
      el.playsInline = true;
    } else {
      el = document.createElement('img');
    }
    el.src = src;
    el.style.cssText = 'max-width:100%;max-height:88vh;object-fit:contain;border-radius:12px;display:block';
    inner.appendChild(el);

    modal.style.display = 'flex';
    requestAnimationFrame(() => { modal.style.opacity = '1'; });
  };

  function closeModal() {
    modal.style.opacity = '0';
    setTimeout(() => {
      modal.style.display = 'none';
      inner.innerHTML = '';
    }, 280);
  }

  document.getElementById('tlMediaClose').onclick = closeModal;
  // 背景(メディア以外の領域)タップでも閉じる
  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

  // プレビュー中のメディアを端末に保存する
  document.getElementById('tlMediaDownload').onclick = async () => {
    const el = inner.firstElementChild;
    if (!el || !el.src) return;
    try {
      const res = await fetch(el.src);
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const isVideo = el.tagName.toLowerCase() === 'video';
      a.download = `brochat_${Date.now()}.${isVideo ? 'mp4' : 'jpg'}`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      if (window.LiquidGlass) window.LiquidGlass.haptic('success');
    } catch (e) {
      console.error('download error:', e);
    }
  };
})();
</script>

<script>
// ========== コミュニティ機能 ==========
(function() {
  const communityMov = document.getElementById('communityMov');
  const createForm = document.getElementById('communityCreateForm');
  const joinForm = document.getElementById('communityJoinForm');
  const tabCreate = document.getElementById('communityTabCreate');
  const tabJoin = document.getElementById('communityTabJoin');

  // モーダル開閉
  document.getElementById('communityCreateBtn').onclick = () => {
    communityMov.classList.add('open');
    createForm.style.display = '';
    joinForm.style.display = 'none';
    tabCreate.style.opacity = '1';
    tabJoin.style.opacity = '0.5';
  };
  document.getElementById('communityCancel').onclick = () => {
    communityMov.classList.remove('open');
  };
  communityMov.onclick = e => { if (e.target === communityMov) communityMov.classList.remove('open'); };

  // タブ切り替え
  tabCreate.onclick = () => {
    createForm.style.display = '';
    joinForm.style.display = 'none';
    tabCreate.style.opacity = '1';
    tabJoin.style.opacity = '0.5';
  };
  tabJoin.onclick = () => {
    createForm.style.display = 'none';
    joinForm.style.display = '';
    tabCreate.style.opacity = '0.5';
    tabJoin.style.opacity = '1';
  };

  // コミュニティ作成
  document.getElementById('communityCreateSubmit').onclick = async () => {
    const name = document.getElementById('communityNameInput').value.trim();
    if (!name) return;
    const desc = document.getElementById('communityDescInput').value.trim();
    try {
      const data = await api('/api/communities', {
        method: 'POST',
        body: JSON.stringify({ name, description: desc || null })
      });
      if (data.ok) {
        communityMov.classList.remove('open');
        document.getElementById('communityNameInput').value = '';
        document.getElementById('communityDescInput').value = '';
        loadCommunities();
        if (window.LiquidGlass) window.LiquidGlass.haptic('success');
        // 招待コードを表示
        alert('コミュニティを作成しました！\n招待コード: ' + data.community.inviteCode);
      }
    } catch (e) {
      console.error('Community create error:', e);
      alert('コミュニティの作成に失敗しました');
    }
  };

  // コミュニティ参加
  document.getElementById('communityJoinSubmit').onclick = async () => {
    const code = document.getElementById('communityInviteInput').value.trim();
    if (!code) return;
    try {
      const data = await api('/api/communities/join', {
        method: 'POST',
        body: JSON.stringify({ inviteCode: code })
      });
      if (data.ok) {
        communityMov.classList.remove('open');
        document.getElementById('communityInviteInput').value = '';
        loadCommunities();
        if (window.LiquidGlass) window.LiquidGlass.haptic('success');
        if (data.already) {
          alert('既に参加しています: ' + data.name);
        } else {
          alert(data.name + ' に参加しました！');
        }
      }
    } catch (e) {
      console.error('Community join error:', e);
      alert('参加に失敗しました。招待コードを確認してください');
    }
  };

  // コミュニティ一覧読み込み
  window.loadCommunities = async function() {
    try {
      const data = await api('/api/communities/list');
      const list = document.getElementById('communityList');
      list.textContent = '';
      if (!data.ok || !data.communities || data.communities.length === 0) return;

      data.communities.forEach(c => {
        const item = document.createElement('div');
        item.className = 'ti';

        const av = document.createElement('div');
        av.className = 'tav';
        // コミュニティアイコン or 頭文字
        if (c.icon_url) {
          av.style.backgroundImage = `url(${c.icon_url})`;
          av.style.backgroundSize = 'cover';
          av.style.backgroundPosition = 'center';
        } else {
          const hue = Math.abs((c.name || '').charCodeAt(0) * 47) % 360;
          av.style.background = `linear-gradient(135deg, hsl(${hue},70%,60%), hsl(${(hue+40)%360},70%,50%))`;
          av.style.display = 'flex';
          av.style.alignItems = 'center';
          av.style.justifyContent = 'center';
          av.style.fontWeight = '700';
          av.style.color = '#fff';
          av.style.fontSize = '16px';
          av.textContent = (c.name || '?')[0];
        }

        const body = document.createElement('div');
        body.className = 'tbody';
        const row = document.createElement('div');
        row.className = 'ttr';
        const nameEl = document.createElement('div');
        nameEl.className = 'tname';
        nameEl.textContent = c.name;
        const countEl = document.createElement('div');
        countEl.className = 'ttime';
        countEl.textContent = c.member_count + '人';
        row.appendChild(nameEl);
        row.appendChild(countEl);

        const descEl = document.createElement('div');
        descEl.className = 'tmsg';
        descEl.textContent = c.description || '';
        body.appendChild(row);
        body.appendChild(descEl);

        item.appendChild(av);
        item.appendChild(body);
        item.addEventListener('click', () => {
          location.href = '/community.html?id=' + c.id;
        });
        list.appendChild(item);
      });
    } catch (e) {
      console.error('loadCommunities error:', e);
    }
  };

  // 初回読み込み
  loadCommunities();
})();
</script>

<script>
// ========== アプリ内自動アップデート ==========
(function() {
  // Capacitorネイティブアプリの場合のみ実行
  if (!window.Capacitor || !window.Capacitor.Plugins || !window.Capacitor.Plugins.AppUpdater) return;

  const AppUpdater = window.Capacitor.Plugins.AppUpdater;

  async function checkUpdate() {
    try {
      const result = await AppUpdater.checkForUpdate();
      console.log('[AppUpdater]', result);

      if (result.available && result.apkUrl) {
        // アップデートダイアログ表示
        const msg = `新しいバージョンが利用可能です\n${result.releaseName}\n\n今すぐアップデートしますか？`;
        if (confirm(msg)) {
          await AppUpdater.downloadAndInstall({ apkUrl: result.apkUrl });
        }
      }
    } catch (e) {
      console.log('[AppUpdater] check failed:', e);
    }
  }

  // 起動後3秒で静かにチェック
  setTimeout(checkUpdate, 3000);
})();
</script>
