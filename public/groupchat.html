<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title data-i18n="group_chat">グループチャット</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1e293b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bro Chat">
<link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/css/globalTheme.css">
<link rel="stylesheet" href="/css/liquidGlass.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#fdfaf6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body.has-custom-bg{background:transparent}
.pc{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:#fdfaf6;z-index:9999}
body.has-custom-bg .pc{background:transparent}
.bg-orb{position:absolute;border-radius:40% 60% 70% 30%/40% 50% 60% 50%;filter:blur(60px);z-index:0;opacity:.5}
.version-badge{position:fixed;left:8px;bottom:6px;font-size:10px;color:rgba(100,116,139,.6);z-index:10000;pointer-events:none;user-select:none;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
html.dark-mode .version-badge{color:rgba(148,163,184,.5)}
body.has-custom-bg .bg-orb,body.has-custom-bg .pc::before{display:none}
.o1{width:90vw;height:90vw;background:radial-gradient(circle,#fde3cf 0%,rgba(253,227,207,0) 70%);top:-20%;left:-20%}
.o2{width:100vw;height:100vw;background:radial-gradient(circle,#d1fae5 0%,rgba(209,250,229,0) 70%);bottom:-10%;right:-25%}
.o3{width:80vw;height:80vw;background:radial-gradient(circle,#fce7f3 0%,rgba(252,231,243,0) 70%);bottom:-20%;left:-10%}
.pc::before{content:'';position:absolute;width:70vw;height:70vw;background:radial-gradient(circle,#e0f2fe 0%,rgba(224,242,254,0) 70%);top:15%;right:-10%;filter:blur(50px);z-index:0;opacity:.4}
.hdr-wrap,.cs,.ibc{position:relative;z-index:10}
.hdr-wrap{padding:14px 16px}
.hdr{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.25);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid rgba(255,255,255,.4);border-top:1px solid rgba(255,255,255,.8);border-left:1px solid rgba(255,255,255,.8);box-shadow:0 10px 30px rgba(0,0,0,.05);padding:10px 14px;border-radius:24px;width:100%}
.back{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.6);color:#0f172a;font-weight:700;text-decoration:none;flex-shrink:0}
.gav{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;cursor:pointer;background-size:cover;background-position:center;background:rgba(255,255,255,.2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 4px 10px rgba(0,0,0,.1)}
.hinfo{flex:1;min-width:0;cursor:pointer}
.gname{font-weight:700;font-size:15px;color:#1e293b}
.mcnt{font-size:12px;color:#64748b;font-weight:500}
/* hbtn: ヘッダーの電話/設定アイコンボタン。素材はliquidGlass.cssの.glass-clearに
   統一し、形状のみ定義する。 */
.hbtn{border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;width:36px;height:36px;flex-shrink:0}
.pin-banner{position:relative;z-index:10;margin:0 16px 6px;background:rgba(255,255,255,.4);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.6);border-radius:14px;padding:9px 12px;display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(-6px);transition:all .3s ease;pointer-events:none}
.pin-banner.show{opacity:1;transform:translateY(0);pointer-events:auto}
.pin-text{flex:1;font-size:12px;font-weight:600;color:#0f172a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pin-cls{font-size:14px;color:#64748b;cursor:pointer}
.cs{flex:1;padding:8px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;width:100%;align-items:flex-end;gap:8px}
.msg.out{justify-content:flex-end}
.msg.inc{justify-content:flex-start}
.sav{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;align-self:flex-end;background-size:cover;background-position:center;background:rgba(255,255,255,.2);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px)}
.mwrap{display:flex;flex-direction:column;max-width:72%}
.out .mwrap{align-items:flex-end}
.inc .mwrap{align-items:flex-start}
.sname{font-size:11px;font-weight:600;color:#64748b;margin-bottom:2px;padding-left:4px}
.bub{padding:11px 15px;font-size:15px;line-height:1.5;position:relative;background:rgba(255,255,255,.35);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.4);border-top:1px solid rgba(255,255,255,.9);border-left:1px solid rgba(255,255,255,.9);box-shadow:0 8px 24px rgba(0,0,0,.04);color:#0f172a;display:flex;flex-direction:column;align-items:flex-start;min-width:80px;word-break:break-all;overflow-wrap:break-word}
.out .bub{border-radius:20px 20px 4px 20px}
.inc .bub{border-radius:20px 20px 20px 4px;background:rgba(255,255,255,.55)}
.bub.mbub{padding:0!important;background:none!important;backdrop-filter:none!important;border:none!important;box-shadow:0 12px 30px rgba(0,0,0,.15)!important;border-radius:16px!important;overflow:hidden;min-width:unset}
.bub.mbub img,.bub.mbub video{display:block;width:100%;max-height:260px;object-fit:cover;cursor:pointer}
.fi{display:flex;align-items:center;gap:10px}
.ficon{font-size:26px;flex-shrink:0}
.finfo{flex:1;min-width:0}
.fname{font-size:13px;font-weight:600;color:#0f172a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsz{font-size:11px;color:#64748b}
.dlbtn{display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:5px 12px;background:rgba(59,130,246,.12);border:none;border-radius:999px;font-size:12px;font-weight:700;color:#3b82f6;cursor:pointer;text-decoration:none}
.mmeta{align-self:flex-end;margin-top:4px;margin-bottom:-3px;display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:rgba(15,23,42,.5)}
.chk{stroke:rgba(15,23,42,.3);transition:stroke .4s ease}
.chk.lit{stroke:#059669}
.rdrow{display:flex;align-items:center;gap:2px;margin-top:3px}
.rav{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#fff;cursor:pointer;border:1px solid rgba(255,255,255,.8);flex-shrink:0;background-size:cover;background-position:center;transition:transform .15s ease}
.rav:hover{transform:scale(1.25)}
.rext{font-size:10px;font-weight:700;color:#64748b;background:rgba(255,255,255,.7);border-radius:999px;padding:1px 4px;cursor:pointer}
.cancel-notice{text-align:center;font-size:12px;color:#94a3b8;padding:6px 20px;font-weight:500;width:100%}
.rbar{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.rbadge{display:inline-flex;align-items:center;gap:2px;background:rgba(255,255,255,.75);backdrop-filter:blur(10px);border:1.5px solid rgba(255,255,255,.9);border-radius:999px;padding:3px 8px;font-size:13px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.04);transition:all .15s ease}
.rbadge.active{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.3)}
.ibc{padding:10px 16px 14px;width:100%}
.ibar{display:flex;flex-direction:column;background:rgba(255,255,255,.3);backdrop-filter:blur(35px) saturate(200%);-webkit-backdrop-filter:blur(35px) saturate(200%);border:1px solid rgba(255,255,255,.5);border-top:1px solid rgba(255,255,255,.9);border-left:1px solid rgba(255,255,255,.9);box-shadow:0 16px 40px rgba(0,0,0,.08);padding:10px 14px;border-radius:28px;max-height:54px;transition:all .45s cubic-bezier(.25,1,.5,1);overflow:hidden;width:100%}
.ibar.open{max-height:240px;border-radius:22px}
.imrow{display:flex;align-items:center;width:100%;height:34px;min-width:0}
/* pbtn: 添付メニュー開閉ボタン。形状のみ定義し、素材はglass-clearに任せる。 */
.pbtn{border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;width:34px;height:34px;flex-shrink:0;transition:transform .3s ease}
.ibar.open .pbtn{transform:rotate(45deg)}
.tform{flex:1;display:flex;align-items:center;gap:8px;margin-left:10px;min-width:0}
#mi{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:15px;color:#0f172a;height:34px}
.tform input{flex:1;border:none;background:transparent;outline:none;font-size:16px;color:#0f172a;padding:6px 0}
.tform input::placeholder{color:rgba(15,23,42,.4)}
.mopts{display:flex;flex-direction:column;gap:4px;padding-top:10px;margin-top:8px;border-top:1px solid rgba(255,255,255,.4);opacity:0;transform:translateY(-8px);transition:all .4s ease}
.ibar.open .mopts{opacity:1;transform:translateY(0)}
.mopt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;cursor:pointer;border:none;background:none;width:100%;text-align:left}
.mopt:hover{background:rgba(255,255,255,.5)}
.mopt span{font-size:14px;font-weight:600;color:#1e293b}
.mov{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,.08);opacity:0;pointer-events:none;transition:all .3s ease;z-index:150}
.mov.show{opacity:1;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);pointer-events:auto}
.ctx{position:absolute;background:rgba(255,255,255,.6);backdrop-filter:blur(40px) saturate(200%);-webkit-backdrop-filter:blur(40px) saturate(200%);border:1px solid rgba(255,255,255,.7);border-top:1px solid #fff;border-left:1px solid #fff;box-shadow:0 20px 50px rgba(0,0,0,.12);min-width:190px;z-index:200;pointer-events:none;border-radius:24px;transform:scale(.4) translateY(30px);opacity:0;transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .2s ease;overflow:hidden}
.ctx.show{pointer-events:auto;transform:scale(1) translateY(0);opacity:1}
.ctxbtn{background:none;border:none;padding:14px 18px;width:100%;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s}
.ctxbtn:hover{background:rgba(255,255,255,.5)}
.c-react{color:#f59e0b}.c-edit{color:#007aff}.c-pin{color:#8b5cf6}.c-del{color:#ff3b30}
.cdiv{height:1px;background:rgba(0,0,0,.05);margin:0 12px}
.rpicker{position:absolute;display:flex;gap:6px;padding:10px 14px;background:rgba(255,255,255,.88);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.9);border-radius:999px;box-shadow:0 8px 32px rgba(0,0,0,.1);z-index:260;opacity:0;pointer-events:none;transition:all .25s cubic-bezier(.34,1.56,.64,1);transform:scale(.8) translateY(10px)}
.rpicker.show{opacity:1;pointer-events:auto;transform:scale(1) translateY(0)}
.rpbtn{font-size:22px;background:none;border:none;cursor:pointer;padding:2px 4px;border-radius:8px;transition:transform .15s ease}
.rpbtn:hover{transform:scale(1.3)}
.conf-ov{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,.3);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:500;display:flex;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:opacity .25s ease}
.conf-ov.show{opacity:1;pointer-events:auto}
.conf-box{background:rgba(255,255,255,.9);border-radius:24px;padding:24px 20px;width:80%;max-width:300px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.15)}
.conf-title{font-size:16px;font-weight:800;color:#0f172a;margin-bottom:8px}
.conf-msg{font-size:13px;color:#64748b;margin-bottom:20px}
.conf-btns{display:flex;gap:10px}
/* cbtn/sh-close/sh-save/inv-btn: 確認ダイアログ・シート内の各種ボタンも
   Clear Glassに統一。意味的な色(削除=赤、招待=青)は薄い色付きガラスとして
   表現し、視覚的な機能の違いは保ちつつ素材は統一する。 */
.cbtn{flex:1;padding:12px;border:none;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer}
.cbtn.no{color:#0f172a}
.cbtn.yes{background:rgba(255,59,48,.5);color:#fff}
.sh-close{width:100%;padding:13px;margin-top:10px;border:none;border-radius:14px;font-size:15px;font-weight:700;color:#0f172a;cursor:pointer}
.sh-save{width:100%;padding:13px;color:#0f172a;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
.inv-btn{padding:10px 16px;background:rgba(59,130,246,.5);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer}
.sheet-ov{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,.25);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:300;display:flex;justify-content:center;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s ease}
.sheet-ov.show{opacity:1;pointer-events:auto}
.sheet{width:100%;max-height:78vh;overflow-y:auto;background:rgba(255,255,255,.88);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:28px 28px 0 0;padding:20px;transform:translateY(100%);transition:transform .35s cubic-bezier(.25,1,.5,1)}
.sheet-ov.show .sheet{transform:translateY(0)}
.sh-title{font-size:16px;font-weight:800;color:#0f172a;text-align:center;margin-bottom:16px}
/* glass-btn: 送信ボタン。素材はliquidGlass.cssの.glass-clearに統一し、
   ここでは形状とホバー/タップ演出のみ定義する。 */
.glass-btn{
  position:relative;width:34px;height:34px;border-radius:50%;border:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;outline:0;padding:0;flex-shrink:0;
}
.glass-btn:hover{transform:scale(1.08);}
.glass-btn:active{/* liquidGlass.cssで管理 */}
.litem{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(15,23,42,.05)}
.litem:last-child{border-bottom:none}
.lav{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;background-size:cover;background-position:center}
.lname{flex:1;font-size:14px;font-weight:600;color:#0f172a}
.lrole{font-size:11px;font-weight:600;color:#64748b;background:rgba(15,23,42,.06);padding:2px 8px;border-radius:999px}
.rmvbtn{background:rgba(255,59,48,.15);border:1px solid rgba(255,59,48,.25);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;color:#ff3b30;cursor:pointer}
.srow{margin-bottom:14px}
.slabel{font-size:12px;font-weight:700;color:#64748b;margin-bottom:6px;display:block}
.sinput{width:100%;padding:11px 14px;background:rgba(255,255,255,.8);border:1px solid rgba(15,23,42,.1);border-radius:12px;font-size:15px;font-weight:600;outline:none;box-sizing:border-box}
.crop-wrap{position:relative;display:inline-block}
.crop-prev{width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;border:2px dashed rgba(15,23,42,.15);background-size:cover;background-position:center;overflow:hidden}
.crop-file{position:absolute;inset:0;opacity:0;cursor:pointer;border-radius:50%}
.cropbox{position:relative;width:100%;height:200px;background:#0f172a;border-radius:16px;overflow:hidden;display:none;margin-top:10px;touch-action:none}
.cropimg{position:absolute;top:0;left:0;cursor:move;user-select:none;transform-origin:top left}
.cropmask{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle 65px at center,transparent 99%,rgba(0,0,0,.6) 100%);pointer-events:none;border-radius:16px}
.croprange{width:100%;margin-top:8px;display:none}
.crop-controls{margin-top:8px}
.crop-zoom-row{display:flex;align-items:center;gap:8px}
.crop-zoom-row .croprange{display:block;margin-top:0;flex:1;width:auto}
.crop-zoom-label{font-size:12px;font-weight:700;color:#64748b;min-width:38px;text-align:right}
.crop-reset-btn{width:100%;margin-top:8px;padding:9px;border-radius:12px;font-size:13px;font-weight:700;color:#0f172a;cursor:pointer;border:none}
.inv-row{display:flex;gap:8px;margin-top:10px}
.inv-input{flex:1;padding:10px 14px;background:rgba(255,255,255,.8);border:1px solid rgba(15,23,42,.1);border-radius:12px;font-size:14px;outline:none}
.mm-ov{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;background:rgba(0,0,0,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:400;display:flex;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:opacity .3s ease;overflow:hidden}
.mm-ov.show{opacity:1;pointer-events:auto}
.mm-inner{width:100%;height:100%;display:flex;justify-content:center;align-items:center;position:relative}
.mm-inner img,.mm-inner video{max-width:96%;max-height:96%;border-radius:12px;object-fit:contain}
.mm-cls{position:absolute;top:22px;right:22px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:50%;width:42px;height:42px;display:flex;justify-content:center;align-items:center;cursor:pointer;z-index:420}
</style>

<body>
<svg style="position:absolute;width:0;height:0">
  <defs>
    <filter id="glassFrost" primitiveUnits="objectBoundingBox" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise" seed="4"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.02"/>
    </filter>
  </defs>
</svg>
<div class="pc">
  <div class="version-badge">Bro Chat v1.28.28 beta</div>
  <div class="bg-orb o1"></div>
  <div class="bg-orb o2"></div>
  <div class="bg-orb o3"></div>

  <div class="hdr-wrap">
    <div class="hdr">
      <a href="talklist.html" class="back">←</a>
      <div class="gav" id="gavEl" onclick="openGS()"></div>
      <div class="hinfo" id="hinfoEl">
        <div class="gname" id="gnameEl" data-i18n="group">グループ</div>
        <div class="mcnt" id="mcntEl" data-i18n="members_count">メンバー 0人</div>
      </div>
      <button class="hbtn glass-clear glass-interactive" id="phoneBtnG" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>

<script>
const REACTIONS=['❤️','😂','👍','😮','😢','🔥','👏','🎉'];
const COLORS=['#3b82f6','#ec4899','#8b5cf6','#f59e0b','#10b981','#ef4444','#06b6d4','#84cc16'];

function nameColor(n){let h=0;for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))&0xffffffff;return COLORS[Math.abs(h)%COLORS.length]}

// ブラウザ通知(グループチャットには一切実装されていなかったため新規追加)
function sendNotification(title, options = {}) {
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification(title, { icon: '/favicon.ico', ...options });
  }
}

const params=new URLSearchParams(location.search);
const myName=localStorage.getItem('myName')||'自分';
const myAvatar=localStorage.getItem('myAvatar')||'';
const myColor='#3b82f6';
const myUserId=localStorage.getItem('ring_userId');
window.myUserId=myUserId; // e2eKeys.js から参照できるようにグローバル化
const token=localStorage.getItem('ring_token');
if(!token) location.href='/auth.html';

// groupIdは必ずURLパラメータから取得する(localStorageのみに依存すると
// 複数グループを行き来した際に混線するため)
const groupId=params.get('groupId');
if(!groupId){
  alert(i18n.t('err_group_not_found'));
  location.href='/talklist.html';
}
localStorage.setItem('groupId', groupId);

async function api(path, opts={}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', ...(opts.headers||{}) }
  });
  return res.json();
}

// gi(グループ情報)はサーバーから取得する。取得完了までは
// URLパラメータのnameのみで暫定表示し、loadGroupInfo()完了後に更新する。
let gi = { id: groupId, name: params.get('name') || 'グループ', avatarImg: '', members: [], ownerId: null };

// グループのE2E共有鍵(復号済みUint8Array)。取得済みならメモリ上に保持し、
// メッセージ・メディアの送受信のたびに毎回サーバー問い合わせ・復号をしないようにする。
let cachedGroupKey = null;
async function ensureGroupKey() {
  if (cachedGroupKey) return cachedGroupKey;
  const result = await groupE2E.getGroupKey(groupId);
  cachedGroupKey = result.key;
  return cachedGroupKey;
}

async function loadGroupInfo(){
  try {
    const data = await api('/api/groups/list');
    if (data && Array.isArray(data.groups)) {
      const found = data.groups.find(g => g.groupId === groupId);
      if (found) {
        gi.name = found.name;
        gi.ownerId = found.ownerId;
        gi.members = found.members.map(m => {
          const displayName = m.userId === myUserId ? myName : m.displayName;
          return {
            id: m.userId,
            name: displayName,
            color: nameColor(displayName || '?'),
            initials: (displayName || '?').charAt(0),
            avatarImg: m.userId === myUserId ? myAvatar : (m.profilePic || ''),
            isOwner: m.userId === found.ownerId,
          };
        });
        refreshHdr();
      }
    }
  } catch (err) {
    console.error('グループ情報取得エラー:', err);
  }
}
function saveGI(g){ /* サーバー保存はプロフィール編集モーダル側のAPI呼び出しで行う。ここでは何もしない */ }

let activeMsg=null,activeBubble=null,activeWrap=null,isOwn=false;
let isEditing=false,editNode=null,editMeta=null,editTargetMsgId=null;
let reactTarget=null;
let confCB=null;
let cropX=0,cropY=0,cropS=1,cropDrag=false,cropSX=0,cropSY=0;

const pp=`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#007aff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>`;
const ck=`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;

function refreshHdr(){
  document.getElementById('gnameEl').textContent=gi.name;
  const cnt=gi.members.length;
  document.getElementById('mcntEl').textContent=cnt>0?`メンバー ${cnt}人`:'読み込み中...';
  const av=document.getElementById('gavEl');
  if(gi.avatarImg){
    av.style.backgroundImage=`url(${gi.avatarImg})`;
    av.style.background='';
    av.textContent='';
  }else{
    av.style.backgroundImage='';
    av.style.background=nameColor(gi.name||'グループ');
    av.textContent=(gi.name||'グループ').charAt(0);
  }
  // talklist.htmlのトーク一覧アバターから、このヘッダーアバターへ滑らかにモーフィングする
  // (Cross-Document View Transitions、talklist.html側のglassMorphTag('chat-avatar')と対になる)
  if ('viewTransitionName' in av.style) {
    av.style.viewTransitionName = 'chat-avatar';
  }
}
refreshHdr();
// loadGroupInfo()の呼び出しはファイル末尾でloadGroupMessages()より先に
// await完了させる形にまとめてある(メンバー情報が揃ってから履歴を描画するため)

// リアクションピッカー生成
const rp=document.getElementById('rpicker');
REACTIONS.forEach(e=>{
  const b=document.createElement('button');b.className='rpbtn';b.textContent=e;
  b.onclick=()=>{if(window.LiquidGlass)window.LiquidGlass.haptic('selection');if(reactTarget)addReact(reactTarget,e);rp.classList.remove('show');};
  rp.appendChild(b);
});

function addReact(wrap,emoji){
  let bar=wrap.querySelector('.rbar');
  if(!bar){bar=document.createElement('div');bar.className='rbar';wrap.appendChild(bar);}
  let badge=[...bar.children].find(b=>b.dataset.e===emoji);
  if(badge){
    const c=parseInt(badge.dataset.c||1);
    if(badge.classList.contains('active')){
      const nc=c-1;if(nc<=0)badge.remove();
      else{badge.dataset.c=nc;badge.textContent=`${emoji} ${nc}`;badge.classList.remove('active');}
    }else{badge.dataset.c=c+1;badge.textContent=`${emoji} ${c+1}`;badge.classList.add('active');}
  }else{
    badge=document.createElement('button');badge.className='rbadge active';badge.dataset.e=emoji;badge.dataset.c=1;badge.textContent=`${emoji} 1`;
    badge.onclick=()=>{const c=parseInt(badge.dataset.c||1)-1;if(c<=0)badge.remove();else{badge.dataset.c=c;badge.textContent=`${emoji} ${c}`;badge.classList.remove('active');}};
    bar.appendChild(badge);
  }
}

document.getElementById('pbtn').onclick=()=>document.getElementById('ibar').classList.toggle('open');
document.getElementById('imgI').onchange=e=>{handleMediaGroup(e.target.files[0],'image');};
document.getElementById('vidI').onchange=e=>{handleMediaGroup(e.target.files[0],'video');};
document.getElementById('fileI').onchange=e=>{handleMediaGroup(e.target.files[0],'file');};

async function handleMediaGroup(f,t){
  if(!f)return;
  if(t==='file'){
    alert(i18n.t('err_group_file_unsupported'));
    document.getElementById('ibar').classList.remove('open');
    return;
  }

  const maxSize = t === 'video' ? 500 * 1024 * 1024 : 100 * 1024 * 1024; // Cloudinary対応で制限アップ
  if(f.size > maxSize){
    alert(i18n.t('err_file_too_large'));
    return;
  }

  // グループ共有鍵を取得(全メンバーが復号できるようにするため、個人の秘密鍵ではなく
  // groupE2Eのグループ鍵を使う)
  let groupKey;
  try {
    groupKey = await ensureGroupKey();
  } catch (e) {
    console.error('グループ鍵の取得に失敗:', e);
    alert(i18n.t('err_encryption_not_ready'));
    return;
  }

  // 楽観的更新用のテンポラリID
  const tempId = 'temp-' + Date.now() + '-' + Math.random().toString(36).slice(2, 9);
  const caption = `[${t === 'image' ? '画像' : '動画'}]`;
  
  // ローディングメッセージを表示
  const msgDiv = createMsg(caption, { mediaType: t, mediaData: null, uploading: true }, false, null, tempId, null, true);

  try {
    // Cloudinary E2E アップロード（グループ共有鍵で暗号化 → 全メンバーが復号可能）
    const metadata = await cloudinaryE2EUploader.uploadEncryptedChunked(
      f,
      groupKey,
      `brochat/groups/${groupId}`,
      (progress) => {
        // 進捗表示（オプション）
        console.log('[upload] Progress:', progress + '%');
      }
    );

    if (!metadata || !metadata.cloudinaryUrl) {
      throw new Error('Upload failed');
    }

    // グループチャットにメディア送信（メタデータのみ）
    const data = await api('/api/groups/' + groupId + '/messages/send', {
      method: 'POST',
      body: JSON.stringify({
        content: caption,
        mediaType: t,
        mediaUrl: metadata.cloudinaryUrl,
        mediaPublicId: metadata.cloudinaryPublicId,
        encryptedMetadata: metadata.encryptedMetadata,
        chunkCount: metadata.chunkCount,
        encrypted: true
      })
    });

    if (data && data.ok && data.message) {
      msgDiv.dataset.msgId = data.message.id;
      msgDiv.classList.remove('uploading');
    } else {
      console.error('メディア送信に失敗しました:', data);
      msgDiv.remove();
    }
  } catch (err) {
    console.error('media send error:', err);
    msgDiv.remove();
    alert(i18n.t('err_file_upload_failed') + err.message);
  }

  document.getElementById('ibar').classList.remove('open');
}

document.getElementById('tform').onsubmit=async e=>{
  e.preventDefault();
  const txt=document.getElementById('mi').value.trim();
  if(!txt)return;
  if(window.LiquidGlass) window.LiquidGlass.haptic('light');

  document.getElementById('mi').value='';
  document.getElementById('ibar').classList.remove('open');

  if(isEditing){
    // 編集モード: 実際にサーバーへ保存し、成功したら該当メッセージのテキストを書き換える
    const targetMsgId=editTargetMsgId;
    isEditing=false;editNode=null;editMeta=null;editTargetMsgId=null;
    const sbtn=document.getElementById('sbtn');
    if(sbtn) sbtn.querySelector('svg').outerHTML=pp;
    if(!targetMsgId){
      console.error('編集対象のmsgIdが特定できませんでした');
      return;
    }
    try{
      let editBody;
      try {
        const groupKey = await ensureGroupKey();
        const encryptedContent = await groupE2E.encryptGroupText(txt, groupKey);
        editBody = { content: encryptedContent, encrypted: true };
      } catch (keyErr) {
        console.error('グループ鍵の取得/暗号化に失敗しました(編集):', keyErr);
        alert(i18n.t('err_encryption_not_ready'));
        return;
      }
      const data=await api('/api/groups/'+groupId+'/messages/'+targetMsgId+'/edit',{
        method:'POST',
        body:JSON.stringify(editBody)
      });
      if(data&&data.ok){
        const el=document.querySelector(`[data-msg-id="${targetMsgId}"] .msg-text`);
        if(el)el.textContent=txt;
        const editedLabel=document.querySelector(`[data-msg-id="${targetMsgId}"] .edited-label`);
        if(!editedLabel){
          const meta=document.querySelector(`[data-msg-id="${targetMsgId}"] .mmeta .time`);
          if(meta)meta.insertAdjacentHTML('afterend','<span class="edited-label" style="margin-left:4px;opacity:.6">(編集済)</span>');
        }
      }else{
        console.error('編集に失敗しました:',data);
      }
    }catch(err){console.error('編集エラー:',err);}
    return;
  }

  // 新規送信: 楽観的更新で即座に表示し、サーバー応答で正式なmsgIdに差し替える
  const tempId='temp-'+Date.now()+'-'+Math.random().toString(36).slice(2,9);
  const msgDiv=createMsg(txt,null,false,null,tempId,null,true);

  try{
    let sendBody;
    try {
      const groupKey = await ensureGroupKey();
      const encryptedContent = await groupE2E.encryptGroupText(txt, groupKey);
      sendBody = { content: encryptedContent, encrypted: true };
    } catch (keyErr) {
      console.error('グループ鍵の取得/暗号化に失敗しました。平文で送信せず中断します:', keyErr);
      msgDiv.remove();
      alert(i18n.t('err_encryption_not_ready'));
      return;
    }

    const data=await api('/api/groups/'+groupId+'/messages/send',{
      method:'POST',
      body:JSON.stringify(sendBody)
    });
    if(data&&data.ok&&data.message){
      msgDiv.dataset.msgId=data.message.id;
    }else{
      console.error('送信に失敗しました:',data);
    }
  }catch(err){
    console.error('送信エラー:',err);
  }
};

// text: 表示テキスト(メディアメッセージの場合はキャプション)
// media: {mediaType, mediaData} 形式のオブジェクト、または null(テキストのみ)
// incoming: 相手からのメッセージか
// member: 送信者情報(incoming時のみ使用)
// msgId: サーバー側のメッセージID(編集・削除・既読・ピン留めの対象特定に必須)
// createdAt: サーバーが記録した送信時刻(未指定時は現在時刻)
function createMsg(text,media,incoming,member,msgId,createdAt,isRealtime){
  const cs=document.getElementById('cs');
  const msgDiv=document.createElement('div');
  const isInc=!!incoming;
  msgDiv.classList.add('msg',isInc?'inc':'out');
  if(msgId) msgDiv.dataset.msgId=msgId;

  const wrap=document.createElement('div');wrap.classList.add('mwrap');

  if(isInc&&member){
    const sa=document.createElement('div');sa.className='sav';
    sa.style.background='rgba(255,255,255,.2)';
    sa.style.backdropFilter='blur(15px)';
    if(member.avatarImg)sa.style.backgroundImage=`url(${member.avatarImg})`;
    else sa.textContent=member.initials||member.name?.charAt(0)||'?';
    msgDiv.appendChild(sa);
    const sn=document.createElement('div');sn.className='sname';sn.textContent=member.name;
    wrap.appendChild(sn);
  }

  const bub=document.createElement('div');bub.classList.add('bub');
  let mediaEl=null;

  if(media&&media.mediaType==='image'){
    bub.classList.add('mbub');
    mediaEl=document.createElement('img');mediaEl.src=media.mediaData;bub.appendChild(mediaEl);
  }else if(media&&media.mediaType==='video'){
    bub.classList.add('mbub');
    mediaEl=document.createElement('video');mediaEl.src=media.mediaData;mediaEl.controls=true;bub.appendChild(mediaEl);
  }else if(text){
    const sp=document.createElement('span');sp.className='msg-text';sp.textContent=text;bub.appendChild(sp);
  }

  const dt=createdAt?new Date(createdAt):new Date();
  const t=`${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
  const meta=document.createElement('div');meta.className='mmeta';

  if(!isInc){
    // 送信メッセージ: チェック1個 + 既読アバター(実際の既読状況はrefreshGroupReadStatus()で反映)
    meta.innerHTML=`<span class="time">${t}</span><svg width="13" height="11" viewBox="0 0 13 11" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 6 4.5 10 12 1" class="chk"/></svg>`;
    const rd=document.createElement('div');rd.className='rdrow';meta.appendChild(rd);
    bub.appendChild(meta);
    wrap.appendChild(bub);
  }else{
    meta.innerHTML=`<span class="time">${t}</span>`;
    bub.appendChild(meta);
    wrap.appendChild(bub);
  }

  msgDiv.appendChild(wrap);
  cs.appendChild(msgDiv);
  cs.scrollTop=99999;
  // 履歴の一括読み込みではなく、自分の送信直後・リアルタイム受信の時だけ
  // ガラスが凝縮するように出現させる(大量の履歴に一斉適用すると
  // 視覚的にうるさく描画負荷にもなるため)
  if(isRealtime&&window.LiquidGlass){
    window.LiquidGlass.materializeIn(msgDiv,true);
  }

  // 長押しイベント: 自分のメッセージのみ編集/取り消し
  attachPress(msgDiv,wrap,bub,!isInc);

  if(mediaEl&&media){
    mediaEl.addEventListener('click',()=>openMM(mediaEl,media.mediaType));
  }

  ['imgI','vidI','fileI'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});

  // 受信メッセージは表示された時点で既読対象としてキューに積む
  if(isInc&&msgId){
    queueReadReceipt(msgId);
  }

  return msgDiv;
}

// 既読マークをまとめて送るためのキュー(1メッセージごとにAPIを叩くと
// 大量メッセージ受信時に負荷が高いため、少し間隔を空けてまとめて送る)
let pendingReadIds=new Set();
let readFlushTimer=null;
function queueReadReceipt(msgId){
  pendingReadIds.add(msgId);
  if(readFlushTimer)return;
  readFlushTimer=setTimeout(flushReadReceipts,800);
}
async function flushReadReceipts(){
  readFlushTimer=null;
  if(pendingReadIds.size===0)return;
  const ids=Array.from(pendingReadIds);
  pendingReadIds=new Set();
  try{
    await api('/api/groups/'+groupId+'/messages/read',{
      method:'POST',
      body:JSON.stringify({messageIds:ids})
    });
  }catch(err){console.error('既読送信エラー:',err);}
}

function attachPress(msgDiv,wrap,bub,own){
  let timer;let lp=false;
  const start=ev=>{
    lp=false;
    const cx=ev.touches?ev.touches[0].clientX:ev.clientX;
    const cy=ev.touches?ev.touches[0].clientY:ev.clientY;
    timer=setTimeout(()=>{lp=true;showMenu(msgDiv,wrap,bub,cx,cy,own);},400);
  };
  const cancel=()=>clearTimeout(timer);
  bub.addEventListener('contextmenu',ev=>{ev.preventDefault();showMenu(msgDiv,wrap,bub,ev.clientX,ev.clientY,own);});
  bub.addEventListener('mousedown',start);
  bub.addEventListener('touchstart',start,{passive:true});
  bub.addEventListener('mouseup',cancel);
  bub.addEventListener('mouseleave',cancel);
  bub.addEventListener('touchend',cancel);
}

            // 残るメンバー全員分の新しいグループ鍵を先に生成してから送信する。
            const remainingMemberIds = gi.members.filter(x=>x.id!==m.id).map(x=>x.id);
            const dist = await groupE2E.createInitialGroupKeyDistribution(remainingMemberIds);

            const data = await api('/api/groups/remove-member',{
              method:'POST',
              body:JSON.stringify({
                groupId,
                removeUserId:m.id,
                encryptedKeysForRemainingMembers: dist.distributions,
              })
            });
            if(data && data.ok){
              cachedGroupKey = dist.groupKey;
              gi.members=gi.members.filter(x=>x.id!==m.id);refreshHdr();
            }else{
              alert((data && data.error) || i18n.t('err_group_create_failed'));
            }
          }catch(err){
            console.error('メンバー削除エラー:',err);
            alert(i18n.t('err_group_create_failed'));

document.getElementById('invBtn').onclick=async ()=>{
  const targetUsername=document.getElementById('invInput').value.trim();
  if(!targetUsername)return;

  const invBtn=document.getElementById('invBtn');
  invBtn.disabled=true;
  const originalLabel=invBtn.textContent;
  invBtn.textContent='...';

  try{
    // 新メンバーは過去のメッセージを読めないようにするため、鍵ローテーションが必要。
    // 現メンバー全員(自分含む)+招待対象の新しいバージョンのグループ鍵を生成し、
    // それぞれの公開鍵でX3DH暗号化してからサーバーに送る。
    const currentMemberIds = gi.members.map(m=>m.id);
    // 招待対象のuserIdはまだ分からない(usernameでしか指定できない)ため、
    // サーバー側で招待成立後に新バージョンの鍵を配布し直す2段階方式にする:
    // 1. まず招待APIを呼び、成功したらinvitedUserIdを受け取る
    // 2. その場でクライアント側が新グループ鍵を作り、現メンバー+新メンバー全員に配布する
    //
    // ただしサーバー側/inviteは「鍵配布も同じリクエストで」という設計のため、
    // ここでは先にuserIdを解決してから鍵を生成する2段階にする。
    const searchRes = await api('/api/friends/search?q='+encodeURIComponent(targetUsername));
    const exactMatch = Array.isArray(searchRes) ? searchRes.find(u => u.userIdCode === targetUsername) : null;
    if(!exactMatch){
      alert('そのユーザーは見つかりません');
      return;
    }
    const newMemberId = exactMatch.userId;

    const allMemberIds = [...currentMemberIds, newMemberId];
    const dist = await groupE2E.createInitialGroupKeyDistribution(allMemberIds);

    const data = await api('/api/groups/invite', {
      method:'POST',
      body: JSON.stringify({
        groupId,
        targetUsername,
        encryptedKeysForMembers: dist.distributions,
      }),
    });

    if(data && data.ok){
      // 新しいグループ鍵バージョンをローカルキャッシュにも反映
      cachedGroupKey = dist.groupKey;
      await loadGroupInfo(); // メンバー一覧をサーバーから再取得して正しいidに更新
      document.getElementById('invInput').value='';
      openMemModal();
    }else{
      alert((data && data.error) || i18n.t('err_group_create_failed'));
    }
  }catch(e){
    console.error('招待エラー:', e);
    alert(i18n.t('err_group_create_failed'));
  }finally{
    invBtn.disabled=false;
    invBtn.textContent=originalLabel;
  }
};

// 画像アップロード+クロップ
let gImgSrc='';
const G_CROP_GUIDE_SIZE=130; // ガイド円の直径(px)、保存時の出力サイズと合わせる
function clampGCropTransform(){
  const img=document.getElementById('gCropImg');
  if(!img.naturalWidth||!img.naturalHeight)return;
  const box=document.getElementById('gCropBox');
  const bx=box.offsetWidth/2, by=box.offsetHeight/2;
  const minScale=G_CROP_GUIDE_SIZE/Math.min(img.naturalWidth,img.naturalHeight);
  if(cropS<minScale){
    cropS=minScale;
    document.getElementById('gCropRange').min=minScale.toFixed(3);
  }
  const iw2=img.naturalWidth*cropS, ih2=img.naturalHeight*cropS;
  const halfGuide=G_CROP_GUIDE_SIZE/2;
  const minCx=bx-halfGuide-(iw2-halfGuide*2), maxCx=bx-halfGuide;
  const minCy=by-halfGuide-(ih2-halfGuide*2), maxCy=by-halfGuide;
  cropX=Math.min(maxCx,Math.max(minCx,cropX));
  cropY=Math.min(maxCy,Math.max(minCy,cropY));
}
document.getElementById('gImgFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    gImgSrc=ev.target.result;
    const img=document.getElementById('gCropImg');img.src=gImgSrc;
    document.getElementById('gCropBox').style.display='block';
    document.getElementById('gCropControls').style.display='block';
    img.onload=()=>{
      const minScale=G_CROP_GUIDE_SIZE/Math.min(img.naturalWidth,img.naturalHeight);
      cropS=minScale;
      const range=document.getElementById('gCropRange');
      range.min=minScale.toFixed(3);range.max=(minScale*4).toFixed(3);range.value=cropS;
      cropX=(document.getElementById('gCropBox').offsetWidth-img.naturalWidth*cropS)/2;
      cropY=(document.getElementById('gCropBox').offsetHeight-img.naturalHeight*cropS)/2;
      updCrop();
    };
  };reader.readAsDataURL(f);
};
function updCrop(){
  clampGCropTransform();
  const img=document.getElementById('gCropImg');
  img.style.transform=`translate(${cropX}px,${cropY}px) scale(${cropS})`;
  img.style.transformOrigin='0 0';
  document.getElementById('gCropRange').value=cropS;
  const label=document.getElementById('gCropZoomLabel');
  if(label&&img.naturalWidth){
    const minScale=G_CROP_GUIDE_SIZE/Math.min(img.naturalWidth,img.naturalHeight);
    label.textContent=Math.round((cropS/minScale)*100)+'%';
  }
}
const cb=document.getElementById('gCropBox');
cb.addEventListener('mousedown',e=>{cropDrag=true;cropSX=e.clientX-cropX;cropSY=e.clientY-cropY;});
cb.addEventListener('touchstart',e=>{if(e.touches.length===1){cropDrag=true;cropSX=e.touches[0].clientX-cropX;cropSY=e.touches[0].clientY-cropY;}});
window.addEventListener('mousemove',e=>{if(!cropDrag)return;cropX=e.clientX-cropSX;cropY=e.clientY-cropSY;updCrop();});
window.addEventListener('touchmove',e=>{if(!cropDrag||e.touches.length!==1)return;cropX=e.touches[0].clientX-cropSX;cropY=e.touches[0].clientY-cropSY;updCrop();});
window.addEventListener('mouseup',()=>cropDrag=false);
window.addEventListener('touchend',()=>cropDrag=false);
document.getElementById('gCropRange').oninput=e=>{cropS=parseFloat(e.target.value);updCrop();};

document.getElementById('gCropResetBtn').onclick=()=>{

function updMM(){const e=document.getElementById('mmIn').firstElementChild;if(e)e.style.transform=`translate(${px}px,${py}px) scale(${sc})`;}
const gd=(a,b)=>Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);
document.getElementById('mmOv').addEventListener('wheel',e=>{e.preventDefault();const o=sc;sc=e.deltaY<0?Math.min(sc+.15,5):Math.max(sc-.15,.7);if(sc!==o){px*=sc/o;py*=sc/o;}updMM();},{passive:false});
document.getElementById('mmOv').addEventListener('mousedown',e=>{if(e.target.closest('#mmCls')||!document.getElementById('mmIn').firstElementChild)return;dr=true;tm='pan';sx=e.clientX-(px/sc);sy=e.clientY-(py/sc);});
document.getElementById('mmOv').addEventListener('touchstart',e=>{const t=e.touches;if(!document.getElementById('mmIn').firstElementChild)return;if(t.length===2){tm='zoom';ip=gd(t[0],t[1]);is=sc;}else if(t.length===1){tm='pan';dr=true;sx=t[0].clientX-(px/sc);sy=t[0].clientY-(py/sc);}},{passive:true});
window.addEventListener('mousemove',e=>{if(!dr||tm!=='pan')return;px=(e.clientX-sx)*sc;py=(e.clientY-sy)*sc;updMM();});
window.addEventListener('touchmove',e=>{const t=e.touches;if(!document.getElementById('mmIn').firstElementChild)return;if(tm==='zoom'&&t.length===2){e.preventDefault();const o=sc;sc=Math.max(.7,Math.min(is*(gd(t[0],t[1])/ip),5));if(sc!==o){px*=sc/o;py*=sc/o;}updMM();}else if(tm==='pan'&&dr&&t.length===1){e.preventDefault();px=(t[0].clientX-sx)*sc;py=(t[0].clientY-sy)*sc;updMM();}},{passive:false});
window.addEventListener('mouseup',()=>{dr=false;tm='';});window.addEventListener('touchend',()=>{dr=false;tm='';});
document.getElementById('mmCls').onclick=()=>{document.getElementById('mmOv').classList.remove('show');setTimeout(()=>document.getElementById('mmIn').innerHTML='',300);};
document.getElementById('mmOv').onclick=e=>{if(e.target===document.getElementById('mmOv')){document.getElementById('mmOv').classList.remove('show');setTimeout(()=>document.getElementById('mmIn').innerHTML='',300);}};

// サーバーのcontentカラムは以下のいずれかの形式:
// 1. 平文テキスト(暗号化前の古いメッセージ、または鍵未配布時の互換)
// 2. JSON.stringify({text, media, mediaType}) - Base64直送り方式の古いメディア
// 3. JSON.stringify({text, mediaType, mediaUrl, mediaPublicId, encryptedMetadata, chunkCount}) - Cloudinary方式
// 4. JSON.stringify({ciphertext, nonce}) - groupE2E.encryptGroupTextで暗号化されたテキスト(msg.encrypted===trueの時)
// msg.encryptedフラグと中身を見て判別し、復号が必要なものは復号してから返す。
async function parseMsgContent(rawContent, isEncrypted){
  if(typeof rawContent!=='string')return{text:'',media:null};

  if(rawContent.startsWith('{')){
    let parsed;
    try{ parsed=JSON.parse(rawContent); }catch(e){ return{text:rawContent,media:null}; }

    // Cloudinary方式のメディア(暗号化された動画/画像)
    if(parsed && parsed.mediaUrl && parsed.mediaType){
      try{
        const groupKey = await ensureGroupKey();
        const blob = await cloudinaryE2EUploader.downloadAndDecryptMedia(
          parsed.mediaUrl, parsed.encryptedMetadata, groupKey
        );
        const objectUrl = URL.createObjectURL(blob);
        return{text:parsed.text||'', media:{mediaType:parsed.mediaType, mediaData:objectUrl}};
      }catch(e){
        console.error('メディア復号エラー:', e);
        return{text:parsed.text||'(メディアの復号に失敗しました)', media:null};
      }
    }

    // 旧Base64直送り方式のメディア(暗号化されていない)
    if(parsed && parsed.media && parsed.mediaType){
      return{text:parsed.text||'',media:{mediaType:parsed.mediaType,mediaData:parsed.media}};
    }

    // groupE2Eで暗号化されたテキスト
    if(isEncrypted && parsed && parsed.ciphertext && parsed.nonce){
      try{
        const groupKey = await ensureGroupKey();
        const text = await groupE2E.decryptGroupText(rawContent, groupKey);
        return{text, media:null};
      }catch(e){
        console.error('テキスト復号エラー:', e);
        return{text:'(復号に失敗しました)', media:null};
      }
    }
  }
  return{text:rawContent,media:null};
}

// グループメッセージ履歴をサーバーから読み込み
async function loadGroupMessages(){
  try{
    const msgs=await api('/api/groups/'+groupId+'/messages');
    if(Array.isArray(msgs)){
      for(const msg of msgs){
        const member=gi.members.find(m=>m.id===msg.sender_id);
        const{text,media}=await parseMsgContent(msg.content, msg.encrypted);
        const incoming=msg.sender_id!==myUserId;
        const msgDiv=createMsg(text,media,incoming,member,msg.id,msg.created_at);
        if(msg.edited_at){
          const meta=msgDiv.querySelector('.mmeta .time');
          if(meta)meta.insertAdjacentHTML('afterend','<span class="edited-label" style="margin-left:4px;opacity:.6">(編集済)</span>');
        }
      }
    }
    // ピン留め中のメッセージがあればバナーを表示
    const pinned=await api('/api/groups/'+groupId+'/pinned');
    if(Array.isArray(pinned)&&pinned.length>0){
      const latest=pinned[0];
      const{text}=await parseMsgContent(latest.content, latest.encrypted);
      document.getElementById('pinText').textContent=text||'メディア';
      document.getElementById('pinBanner').classList.add('show');
      document.getElementById('pinBanner').dataset.msgId=latest.id;
    }
  }catch(err){console.error('load messages error:',err);}
}


// 初期化順序: グループ情報(メンバー一覧)を取得してから履歴を読み込む
// (メンバー名・アバターを正しく紐付けるため)
(async ()=>{
  // キャッシュマネージャーを初期化
  try {
    await cacheManager.init();
  } catch (e) {
    console.error('Cache init error:', e);
  }
  
  // E2E暗号化用の鍵を初期化（e2eKeys.js の読み込みを待つ）
  try {
    // getOrCreateMyKeyPair が定義されるまで最大3秒待機
    let waitCount = 0;
    while (typeof window.getOrCreateMyKeyPair !== 'function' && waitCount < 30) {
      await new Promise(resolve => setTimeout(resolve, 100));
      waitCount++;
    }
    
    if (typeof window.getOrCreateMyKeyPair === 'function') {
      if (!window.myE2EKey) {
        const keypair = await window.getOrCreateMyKeyPair();
        window.myE2EKey = keypair.secretKey;
        console.log('[groupchat] E2E key initialized');
      }
    } else {
      console.error('[groupchat] getOrCreateMyKeyPair not available after waiting');
    }
  } catch (e) {
    console.error('[groupchat] E2E key init error:', e);
  }
  
  // ページ読み込み完了を待たずにすぐ初期化開始
  Promise.all([loadGroupInfo(), loadGroupMessages()]).then(() => {
    connectGroupWS();
  }).catch(err => console.error('初期化エラー:', err));
})();

// --- WebSocketでリアルタイム受信 ---
// (これまで一切実装されておらず、リロードしないと他メンバーの
// メッセージが表示されなかったため新規追加)
let groupWs=null;
// メッセージIDごとの既読者リスト(WebSocketで通知が来るたびに追加していく)
const msgReaders={};
function connectGroupWS(){
  const wsUrl=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';
  groupWs=new WebSocket(wsUrl);

  groupWs.onopen=()=>{
    groupWs.send(JSON.stringify({type:'auth',token}));
  };

  groupWs.onmessage=async e=>{
    try{
      const data=JSON.parse(e.data);
      if(data.type==='group_message'&&data.groupId===groupId){
        const msg=data.message;
        if(msg.senderId===myUserId)return; // 自分の送信は楽観的更新済みなので二重表示しない
        const member=gi.members.find(m=>m.id===msg.senderId);
        const{text,media}=await parseMsgContent(msg.content, msg.encrypted);
        createMsg(text,media,true,member,msg.id,msg.createdAt,true);
        // タブが非表示(バックグラウンド)の時のみブラウザ通知を送る
        // (見ている最中に通知を出すのは煩わしいため)
        if(document.hidden){
          sendNotification(member?member.name:gi.name, { body: media?`[${media.mediaType==='image'?'画像':'動画'}]`:text, tag: 'group-'+groupId });
        }
      }else if(data.type==='group_message_edited'&&data.groupId===groupId){
        const el=document.querySelector(`[data-msg-id="${data.messageId}"] .msg-text`);
        if(el)el.textContent=data.content;
        const editedLabel=document.querySelector(`[data-msg-id="${data.messageId}"] .edited-label`);
        if(!editedLabel){
          const meta=document.querySelector(`[data-msg-id="${data.messageId}"] .mmeta .time`);
          if(meta)meta.insertAdjacentHTML('afterend','<span class="edited-label" style="margin-left:4px;opacity:.6">(編集済)</span>');
        }
      }else if(data.type==='group_message_read'&&data.groupId===groupId){
        // 自分が送ったメッセージが読まれた場合、既読アバターを反映する
        const msgDiv=document.querySelector(`[data-msg-id="${data.messageId}"]`);
        if(msgDiv&&!msgDiv.classList.contains('inc')){
          const chk=msgDiv.querySelector('.chk');
          if(chk&&data.readCount>0)chk.classList.add('lit');
          const rd=msgDiv.querySelector('.rdrow');
          const reader=gi.members.find(m=>m.id===data.readerUserId);
          if(rd&&reader){
            if(!msgReaders[data.messageId])msgReaders[data.messageId]=[];
            if(!msgReaders[data.messageId].some(m=>m.id===reader.id)){
              msgReaders[data.messageId].push(reader);
            }
            const t=msgDiv.querySelector('.time')?.textContent||'';
            renderRD(rd,msgReaders[data.messageId],t);
          }
        }
      }else if(data.type==='group_message_pinned'&&data.groupId===groupId){
        if(data.pinned){
          const el=document.querySelector(`[data-msg-id="${data.messageId}"] .msg-text,[data-msg-id="${data.messageId}"] .fname`);
          document.getElementById('pinText').textContent=el?el.textContent:'メディア';
          document.getElementById('pinBanner').classList.add('show');
          document.getElementById('pinBanner').dataset.msgId=data.messageId;
        }else if(document.getElementById('pinBanner').dataset.msgId===data.messageId){
          document.getElementById('pinBanner').classList.remove('show');
        }
      }else if(data.type==='group_message_deleted'&&data.groupId===groupId){
        const msgDiv=document.querySelector(`[data-msg-id="${data.messageId}"]`);
        if(msgDiv){
          const notice=document.createElement('div');
          notice.className='cancel-notice';
          notice.textContent='メッセージが取り消されました';
          msgDiv.parentNode.replaceChild(notice,msgDiv);
        }
      }else if(data.type==='added_to_group'){
        // 自分が新しいグループに追加された通知(トーク一覧側で表示更新が必要になるため、
        // 現在開いているのが別グループの場合は何もしない)
      }else if(data.type==='removed_from_group'&&data.groupId===groupId){
        // 自分または他のメンバーが削除 → 鍵がローテーションされた可能性があるのでキャッシュ破棄
        cachedGroupKey = null;
        loadGroupInfo();
      }else if(data.type==='group_member_added'&&data.groupId===groupId){
        // 新メンバー追加 → 鍵がローテーションされた可能性があるのでキャッシュ破棄
        cachedGroupKey = null;
        loadGroupInfo();
      }else if(data.type==='group_key_rotated'&&data.groupId===groupId){
        // 鍵ローテーション通知 → メモリキャッシュとlocalStorageの古いバージョンを破棄して次回取得時に再取得させる
        cachedGroupKey = null;
      }
    }catch(err){console.error('WebSocketメッセージ処理エラー:',err);}
  };

  groupWs.onclose=()=>{
    // 切断時は5秒後に再接続を試みる
    setTimeout(connectGroupWS,5000);
  };
  groupWs.onerror=err=>{console.error('WebSocketエラー:',err);};
}
</script>
