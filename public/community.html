<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>コミュニティ - Bro Chat</title>
<link rel="stylesheet" href="/css/liquidGlass.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#0f172a;min-height:100dvh;overflow:hidden}
.header{position:fixed;top:0;left:0;right:0;z-index:100;padding:12px 16px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.15);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-bottom:1px solid rgba(255,255,255,.2)}
.back-btn{width:36px;height:36px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.header-info{flex:1;min-width:0}
.header-name{font-weight:700;font-size:16px;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-sub{font-size:12px;color:#64748b}
.content{display:flex;height:100dvh;padding-top:60px}
.sidebar{width:200px;flex-shrink:0;background:rgba(255,255,255,.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:1px solid rgba(255,255,255,.1);overflow-y:auto;padding:8px 0}
.channel-item{padding:8px 16px;cursor:pointer;font-size:14px;color:rgba(255,255,255,.7);transition:background .15s;display:flex;align-items:center;gap:6px}
.channel-item:hover{background:rgba(255,255,255,.08)}
.channel-item.active{background:rgba(255,255,255,.15);color:#fff;font-weight:600}
.channel-hash{opacity:.5;font-size:16px}
.add-channel-btn{padding:8px 16px;cursor:pointer;font-size:13px;color:rgba(255,255,255,.4);display:flex;align-items:center;gap:6px}
.add-channel-btn:hover{color:rgba(255,255,255,.7)}
.chat-area{flex:1;display:flex;flex-direction:column;min-width:0}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg-av{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px;background-size:cover;background-position:center}
.msg-body{min-width:0}
.msg-header{display:flex;align-items:baseline;gap:8px}
.msg-name{font-weight:700;font-size:13px;color:rgba(255,255,255,.9)}
.msg-time{font-size:11px;color:rgba(255,255,255,.4)}
.msg-text{font-size:14px;color:rgba(255,255,255,.85);margin-top:2px;word-break:break-word;white-space:pre-wrap}
.input-bar{padding:12px 16px;background:rgba(255,255,255,.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.1);display:flex;gap:8px;align-items:center}
.input-bar input{flex:1;padding:10px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font-size:14px;outline:none}
.input-bar input::placeholder{color:rgba(255,255,255,.4)}
.send-btn{width:36px;height:36px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.invite-badge{position:fixed;bottom:80px;right:16px;padding:8px 16px;border-radius:12px;background:rgba(255,255,255,.15);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;font-size:12px;cursor:pointer;border:1px solid rgba(255,255,255,.2);z-index:50}
/* モバイル対応: サイドバーを隠してチャンネル選択はヘッダーから */
@media(max-width:640px){
  .sidebar{display:none}
  .header-sub{cursor:pointer}
  .mobile-channel-list{position:fixed;top:60px;left:0;right:0;bottom:0;z-index:90;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;flex-direction:column;padding:16px}
  .mobile-channel-list.show{display:flex}
  .mobile-channel-item{padding:12px 16px;font-size:15px;color:#fff;border-radius:12px;cursor:pointer}
  .mobile-channel-item.active{background:rgba(255,255,255,.15)}
}
</style>
</head>
<body>
<div class="header">
  <button class="back-btn glass-clear glass-interactive" onclick="location.href='/talklist.html'">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <div class="header-info">
    <div class="header-name" id="communityName">読み込み中...</div>
    <div class="header-sub" id="channelName" onclick="toggleMobileChannels()"></div>
  </div>
  <button class="back-btn glass-clear glass-interactive" id="membersBtn" title="メンバー">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
  </button>
</div>

<div class="mobile-channel-list" id="mobileChannels"></div>

<div class="content">
  <div class="sidebar" id="sidebar"></div>
  <div class="chat-area">
    <div class="messages" id="messages"></div>
    <div class="input-bar">
      <input type="text" id="msgInput" placeholder="メッセージを入力...">
      <button class="send-btn glass-clear glass-interactive" id="sendBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="invite-badge" id="inviteBadge" style="display:none" onclick="copyInvite()"></div>

<script defer src="/js/globalBg.js"></script>
<script>
const token = localStorage.getItem('ring_token');
const myUserId = localStorage.getItem('ring_userId');
if (!token) location.href = '/auth.html';

const communityId = new URLSearchParams(location.search).get('id');
if (!communityId) location.href = '/talklist.html';

let currentChannelId = null;
let communityData = null;
let myRole = null;

async function api(url, opts = {}) {
  const res = await fetch(url, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token, ...(opts.headers || {}) }
  });
  return res.json();
}

async function loadCommunity() {
  const data = await api('/api/communities/' + communityId);
  if (!data.ok) {
    alert('コミュニティが見つかりません');
    location.href = '/talklist.html';
    return;
  }
  communityData = data;
  myRole = data.community.myRole;
  document.getElementById('communityName').textContent = data.community.name;

  // 招待バッジ
  if (data.community.inviteCode) {
    const badge = document.getElementById('inviteBadge');
    badge.textContent = '招待: ' + data.community.inviteCode;
    badge.style.display = '';
  }

  // チャンネル描画
  renderChannels(data.channels);

  // 最初のチャンネルを選択
  if (data.channels.length > 0) {
    selectChannel(data.channels[0].id, data.channels[0].name);
  }
}

function renderChannels(channels) {
  const sidebar = document.getElementById('sidebar');
  const mobile = document.getElementById('mobileChannels');
  sidebar.textContent = '';
  mobile.textContent = '';

  channels.forEach(ch => {
    // デスクトップ
    const item = document.createElement('div');
    item.className = 'channel-item' + (ch.id === currentChannelId ? ' active' : '');
    item.innerHTML = '<span class="channel-hash">#</span>';
    const nameSpan = document.createElement('span');
    nameSpan.textContent = ch.name;
    item.appendChild(nameSpan);
    item.addEventListener('click', () => selectChannel(ch.id, ch.name));
    sidebar.appendChild(item);

    // モバイル
    const mItem = document.createElement('div');
    mItem.className = 'mobile-channel-item' + (ch.id === currentChannelId ? ' active' : '');
    mItem.textContent = '# ' + ch.name;
    mItem.addEventListener('click', () => {
      selectChannel(ch.id, ch.name);
      document.getElementById('mobileChannels').classList.remove('show');
    });
    mobile.appendChild(mItem);
  });

  // チャンネル追加ボタン(adminのみ)
  if (myRole === 'admin') {
    const addBtn = document.createElement('div');
    addBtn.className = 'add-channel-btn';
    addBtn.textContent = '+ チャンネルを追加';
    addBtn.addEventListener('click', addChannel);
    sidebar.appendChild(addBtn);
  }
}

async function selectChannel(channelId, name) {
  currentChannelId = channelId;
  document.getElementById('channelName').textContent = '# ' + name;
  // アクティブ表示更新
  document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.mobile-channel-item').forEach(el => el.classList.remove('active'));
  if (communityData) renderChannels(communityData.channels);
  await loadMessages();
}

async function loadMessages() {
  if (!currentChannelId) return;
  const data = await api(`/api/communities/${communityId}/channels/${currentChannelId}/messages`);
  const container = document.getElementById('messages');
  container.textContent = '';
  if (!data.ok || !data.messages) return;

  data.messages.forEach(m => {
    const msg = document.createElement('div');
    msg.className = 'msg';

    const av = document.createElement('div');
    av.className = 'msg-av';
    if (m.sender_pic) {
      av.style.backgroundImage = `url(${m.sender_pic})`;
    } else {
      const hue = Math.abs((m.sender_name || '').charCodeAt(0) * 47) % 360;
      av.style.background = `hsl(${hue},60%,55%)`;
      av.textContent = (m.sender_name || '?')[0];
    }

    const body = document.createElement('div');
    body.className = 'msg-body';

    const header = document.createElement('div');
    header.className = 'msg-header';
    const nameEl = document.createElement('span');
    nameEl.className = 'msg-name';
    nameEl.textContent = m.sender_name || '不明';
    const timeEl = document.createElement('span');
    timeEl.className = 'msg-time';
    timeEl.textContent = formatTime(m.created_at);
    header.appendChild(nameEl);
    header.appendChild(timeEl);

    const text = document.createElement('div');
    text.className = 'msg-text';
    text.textContent = m.content;

    body.appendChild(header);
    body.appendChild(text);
    msg.appendChild(av);
    msg.appendChild(body);
    container.appendChild(msg);
  });

  container.scrollTop = container.scrollHeight;
}

function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const now = new Date();
  if (d.toDateString() === now.toDateString()) {
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }
  return (d.getMonth()+1) + '/' + d.getDate() + ' ' + d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

// メッセージ送信
document.getElementById('sendBtn').onclick = sendMessage;
document.getElementById('msgInput').onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) sendMessage(); };

async function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !currentChannelId) return;
  input.value = '';

  const data = await api(`/api/communities/${communityId}/channels/${currentChannelId}/messages`, {
    method: 'POST',
    body: JSON.stringify({ content: text })
  });
  if (data.ok && data.message) {
    await loadMessages();
  }
}

async function addChannel() {
  const name = prompt('チャンネル名を入力:');
  if (!name || !name.trim()) return;
  const data = await api(`/api/communities/${communityId}/channels`, {
    method: 'POST',
    body: JSON.stringify({ name: name.trim() })
  });
  if (data.ok) {
    communityData.channels.push(data.channel);
    renderChannels(communityData.channels);
  }
}

function toggleMobileChannels() {
  document.getElementById('mobileChannels').classList.toggle('show');
}

function copyInvite() {
  if (!communityData) return;
  navigator.clipboard.writeText(communityData.community.inviteCode).then(() => {
    alert('招待コードをコピーしました: ' + communityData.community.inviteCode);
  });
}

// ポーリングで新着を取得(5秒ごと)
setInterval(() => {
  if (currentChannelId) loadMessages();
}, 5000);

loadCommunity();
</script>
</body>
</html>
