<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メディアの保存先 - Bro Chat</title>
<link rel="stylesheet" href="/css/legal.css">
<style>
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-top: 20px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .row:last-child { border-bottom: 0; }
  .row span:first-child { color: var(--sub); }
  .btn { display: block; width: 100%; margin-top: 18px; padding: 14px; border: 0; border-radius: 14px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
  .btn[disabled] { opacity: .5; cursor: default; }
  .bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; }
  .err { color: #ef4444; font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>
<main class="legal">
  <nav class="legal-top">
    <a href="/talklist.html" class="legal-back" aria-label="戻る"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
  </nav>
  <h1>メディアの保存先</h1>
  <p class="legal-date">運営だけが見られるページ</p>
  <p>トークで送る画像・動画(端末で暗号化済み)を、公式アカウントのGoogleドライブに置きます。つながっていない間は今まで通りCloudinaryに置きます。</p>
  <div class="box">
    <div class="row"><span>今の保存先</span><b id="where">確認中...</b></div>
    <div class="row"><span>ドライブの容量</span><span id="quota">-</span></div>
    <div class="bar"><i id="qbar"></i></div>
  </div>
  <button class="btn" id="connect" type="button" disabled>公式アカウントでGoogleドライブをつなぐ</button>
  <div class="err" id="err"></div>
  <p style="font-size:13px;color:var(--sub);margin-top:16px">ボタンを押すとGoogleのログイン画面が開きます。必ず <b>brochatofficialglobal</b> のアカウントで許可してください。このアプリが作ったファイル以外は見えない権限(drive.file)だけを使います。</p>
</main>
<script>
(function () {
  var token = localStorage.getItem('ring_token') || '';
  var $ = function (id) { return document.getElementById(id); };
  var gb = function (n) { return (Number(n) / 1073741824).toFixed(2) + ' GB'; };
  fetch('/api/drive/status', { headers: { Authorization: 'Bearer ' + token } }).then(function (r) { return r.json(); }).then(function (d) {
    if (!('configured' in d)) { $('where').textContent = '運営アカウントでログインしてください'; return; }
    $('where').textContent = d.enabled ? 'Googleドライブ' : 'Cloudinary';
    if (!d.configured) { $('err').textContent = 'RenderにGDRIVE_CLIENT_ID と GDRIVE_CLIENT_SECRET が入っていません。'; return; }
    $('connect').disabled = false;
    if (d.enabled) $('connect').textContent = 'つなぎ直す(別の許可を取り直す)';
    if (d.quota && d.quota.limit) {
      $('quota').textContent = gb(d.quota.usage) + ' / ' + gb(d.quota.limit);
      $('qbar').style.width = Math.min(100, d.quota.usage / d.quota.limit * 100).toFixed(1) + '%';
    }
  }).catch(function () { $('where').textContent = '読み込めませんでした'; });
  $('connect').addEventListener('click', function () {
    $('connect').disabled = true; $('err').textContent = '';
    fetch('/api/drive/connect-url', { method: 'POST', headers: { Authorization: 'Bearer ' + token } }).then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.url) location.href = d.url; else { $('err').textContent = (d && d.error) || 'URLを作れませんでした'; $('connect').disabled = false; }
    }).catch(function () { $('err').textContent = '通信に失敗しました'; $('connect').disabled = false; });
  });
})();
</script>
</body>
</html>
