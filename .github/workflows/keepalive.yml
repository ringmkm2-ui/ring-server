name: Keep Render service awake

on:
  schedule:
    # 5分おき。GitHubのcronは遅延/スキップが多いので本命はサーバー側のutils/keepAlive.js、こっちは寝た時の起こし役
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://ring-server-50sy.onrender.com/health)
          echo "health check status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "::warning::ring-server /health returned $STATUS"
          fi
